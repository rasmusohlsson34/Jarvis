<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
  }
  .subtitle {
    font-size: 0.75rem;
    color: #4a7a8a;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.78rem;
  }
  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }
  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
  .status-dot.red   { background: #ff1744; box-shadow: 0 0 6px #ff1744; }
  .status-right { color: #4a7a8a; }
  #clock-display { color: #00e5ff; }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 18px 20px;
  }
  .card-label {
    font-size: 0.65rem;
    color: #4a7a8a;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.35rem;
    color: #00e5ff;
  }
  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
  }
  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: #a0c8d8; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  thead th {
    background: rgba(0,229,255,0.07);
    color: #4a7a8a;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.15);
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; }
  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }
  tbody tr:hover { background: rgba(0,229,255,0.03); }
  td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
  }
  td:first-child { text-align: left; }

  .ticker {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    color: #00e5ff;
  }
  .stock-name {
    font-size: 0.68rem;
    color: #4a7a8a;
    margin-top: 3px;
  }
  .badge {
    display: inline-block;
    font-size: 0.58rem;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
    letter-spacing: 0.1em;
    vertical-align: middle;
  }
  .badge-live { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
  .badge-fallback { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }

  /* Bar cell */
  .bar-cell { width: 120px; min-width: 80px; }
  .bar-bg {
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    height: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  /* Total row */
  .total-row td {
    border-top: 1px solid rgba(0,229,255,0.25);
    font-weight: 700;
    color: #00e5ff;
    padding-top: 14px;
    padding-bottom: 14px;
  }
  .total-row .ticker { font-size: 0.7rem; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 0.62rem;
    color: #2a4a5a;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock-display"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
      <div class="card-sub neu">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="card-varde">—</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="card-pl">—</div>
      <div class="card-sub" id="card-pl-pct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="card-best" style="font-size:1rem">—</div>
      <div class="card-sub" id="card-worst">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell">▮</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="footer">Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
const INVESTED_TOTAL = 699474.50;

const stocks = [
  { ticker: 'NDA-SE',  name: 'Nordea Bank',          noll: 175.25, antal: 570,  investerat: 99892.50,  kurs: 179.65, dag: -0.08, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       noll: 135.15, antal: 740,  investerat: 100011.00, kurs: 140.65, dag: 0.32,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       noll: 224.20, antal: 446,  investerat: 99993.20,  kurs: 233.00, dag: 0.26,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 noll: 184.00, antal: 543,  investerat: 99912.00,  kurs: 191.05, dag: 0.47,  status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 noll: 188.20, antal: 531,  investerat: 99934.20,  kurs: 194.20, dag: 0.31,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',            noll: 336.10, antal: 297,  investerat: 99821.70,  kurs: 355.70, dag: 0.76,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  investerat: 99909.90,  kurs: 380.00, dag: 0.66,  status: 'LIVE' }
];

const liveCount = stocks.filter(s => s.status === 'LIVE').length;
const totalCount = stocks.length;

// P&L per stock
stocks.forEach(s => {
  s.varde   = s.kurs * s.antal;
  s.pl      = s.varde - s.investerat;
  s.plPct   = (s.pl / s.investerat) * 100;
  s.vsNoll  = ((s.kurs - s.noll) / s.noll) * 100;
});

const totalVarde = stocks.reduce((a, s) => a + s.varde, 0);
const totalPl    = totalVarde - INVESTED_TOTAL;
const totalPlPct = (totalPl / INVESTED_TOTAL) * 100;

// Best / worst by vsNoll
const sorted = [...stocks].sort((a, b) => b.vsNoll - a.vsNoll);
const best   = sorted[0];
const worst  = sorted[sorted.length - 1];

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

function fmt(n, decimals = 0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtSign(n, decimals = 2) {
  const s = Math.abs(n).toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return (n >= 0 ? '+' : '−') + s;
}
function colorClass(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu'; }

// Cards
document.getElementById('card-varde').textContent = fmt(totalVarde) + ' kr';

const plEl = document.getElementById('card-pl');
plEl.textContent = fmtSign(totalPl, 0) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);

const plPctEl = document.getElementById('card-pl-pct');
plPctEl.textContent = fmtSign(totalPlPct) + '%';
plPctEl.className = 'card-sub ' + colorClass(totalPl);

const bestEl = document.getElementById('card-best');
bestEl.innerHTML = `<span class="pos">${best.ticker} ${fmtSign(best.vsNoll)}%</span>`;

const worstEl = document.getElementById('card-worst');
worstEl.innerHTML = `<span class="${colorClass(worst.vsNoll)}">${worst.ticker} ${fmtSign(worst.vsNoll)}%</span>`;

// Status bar
const dot = document.getElementById('status-dot');
const statusTxt = document.getElementById('status-text');
if (liveCount === totalCount) {
  dot.className = 'status-dot';
  statusTxt.textContent = `${liveCount}/${totalCount} live · Stockholmsbörsen`;
} else if (liveCount === 0) {
  dot.className = 'status-dot red';
  statusTxt.textContent = `${liveCount}/${totalCount} live · 25 jun 2026`;
} else {
  dot.className = 'status-dot amber';
  statusTxt.textContent = `${liveCount}/${totalCount} live · 25 jun 2026`;
}

// Table
const tbody = document.getElementById('table-body');
stocks.forEach(s => {
  const barWidth = maxAbsPlPct > 0 ? (Math.abs(s.plPct) / maxAbsPlPct) * 100 : 0;
  const barColor = s.plPct >= 0 ? '#00ff88' : '#ff1744';
  const badge = s.status === 'LIVE'
    ? `<span class="badge badge-live">LIVE</span>`
    : `<span class="badge badge-fallback">FALLBACK</span>`;

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker">${s.ticker} ${badge}</div>
      <div class="stock-name">${s.name}</div>
    </td>
    <td>${fmt(s.noll, 2)}</td>
    <td>${fmt(s.kurs, 2)}</td>
    <td class="${colorClass(s.dag)}">${s.dag != null ? fmtSign(s.dag) + '%' : '–'}</td>
    <td class="${colorClass(s.vsNoll)}">${fmtSign(s.vsNoll)}%</td>
    <td class="${colorClass(s.pl)}">${fmtSign(s.pl, 0)} kr</td>
    <td class="bar-cell">
      <div class="bar-bg"><div class="bar-fill" style="width:${barWidth.toFixed(1)}%;background:${barColor}"></div></div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalVsNoll = ((totalVarde - INVESTED_TOTAL) / INVESTED_TOTAL) * 100;
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td><div class="ticker">TOTALT</div></td>
  <td>${fmt(INVESTED_TOTAL, 0)} kr</td>
  <td>${fmt(totalVarde, 0)} kr</td>
  <td>–</td>
  <td class="${colorClass(totalPlPct)}">${fmtSign(totalPlPct)}%</td>
  <td class="${colorClass(totalPl)}">${fmtSign(totalPl, 0)} kr</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock-display').textContent =
    now.toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
