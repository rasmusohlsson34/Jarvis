<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050c12; color: #a0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh; padding: 24px 20px 40px;
    position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none; z-index: 100;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none; z-index: 101;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 28px; }
  .logo { font-family: 'Orbitron', sans-serif; font-size: 2.8rem; font-weight: 900; color: #00e5ff; letter-spacing: 0.3em; text-shadow: 0 0 20px rgba(0,229,255,0.5); }
  .subtitle { font-size: 0.85rem; color: #4a7a8a; letter-spacing: 0.2em; margin-top: 4px; text-transform: uppercase; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(0,229,255,0.15); background: rgba(0,229,255,0.03); padding: 8px 16px; margin-bottom: 24px; font-size: 0.78rem; letter-spacing: 0.05em; }
  .status-left { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,0.7); }
  .status-right { color: #4a7a8a; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .card { border: 1px solid rgba(0,229,255,0.2); background: rgba(0,229,255,0.04); padding: 16px; }
  .card-label { font-size: 0.65rem; color: #4a7a8a; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .card-value { font-size: 1.25rem; color: #00e5ff; font-weight: bold; }
  .card-sub { font-size: 0.75rem; margin-top: 4px; }
  .pos { color: #00ff88; } .neg { color: #ff1744; } .neu { color: #a0c8d8; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: #4a7a8a; letter-spacing: 0.12em; text-transform: uppercase; text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(0,229,255,0.15); background: rgba(0,229,255,0.03); }
  td { padding: 12px 12px; border-bottom: 1px solid rgba(0,229,255,0.07); vertical-align: middle; }
  tr:hover td { background: rgba(0,229,255,0.04); }
  tr.total-row td { border-top: 1px solid rgba(0,229,255,0.25); border-bottom: none; background: rgba(0,229,255,0.05); color: #00e5ff; font-size: 0.8rem; }
  .ticker-name { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: #00e5ff; font-weight: 700; }
  .badge { display: inline-block; font-size: 0.55rem; padding: 1px 5px; margin-left: 6px; letter-spacing: 0.08em; vertical-align: middle; border-radius: 2px; }
  .badge-live { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.4); }
  .badge-fallback { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.4); }
  .stock-fullname { font-size: 0.65rem; color: #4a7a8a; margin-top: 3px; }
  .bar-cell { min-width: 80px; }
  .bar-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 6px; border-radius: 3px; }
  .footer { text-align: center; font-size: 0.62rem; color: #2a4a5a; letter-spacing: 0.15em; margin-top: 32px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>
  <div class="status-bar">
    <div class="status-left"><div class="dot"></div><span>7/7 live · Stockholmsbörsen</span></div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>
  <div class="cards">
    <div class="card"><div class="card-label">Investerat</div><div class="card-value">699 475 kr</div><div class="card-sub neu">Nollpunkt: 9 jun 2026</div></div>
    <div class="card"><div class="card-label">Portföljvärde</div><div class="card-value" id="totalVarde">—</div></div>
    <div class="card"><div class="card-label">Total P&L</div><div class="card-value" id="totalPL">—</div><div class="card-sub" id="totalPLPct">—</div></div>
    <div class="card"><div class="card-label">Bäst / Sämst</div><div class="card-value" style="font-size:1rem;" id="bestWorst">—</div><div class="card-sub neu">vs nollkurs</div></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Aktie</th><th>Nollkurs</th><th>Kurs</th><th>Dag%</th><th>Vs noll%</th><th>P&L (SEK)</th><th style="min-width:90px;">Bar</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="footer">Källa: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>
<script>
const INVESTERAT = 699474.50;
const stocks = [
  { ticker:'NDA-SE', name:'Nordea Bank',        zero:175.25, antal:570, inv:99892.50,  price:182.95, dayPct:-0.97, status:'LIVE' },
  { ticker:'SHB-A',  name:'Handelsbanken A',     zero:135.15, antal:740, inv:100011.00, price:141.70, dayPct:-0.28, status:'LIVE' },
  { ticker:'SHB-B',  name:'Handelsbanken B',     zero:224.20, antal:446, inv:99993.20,  price:235.20, dayPct:-0.25, status:'LIVE' },
  { ticker:'SEB-A',  name:'SEB A',               zero:184.00, antal:543, inv:99912.00,  price:194.05, dayPct:-0.79, status:'LIVE' },
  { ticker:'SEB-C',  name:'SEB C',               zero:188.20, antal:531, inv:99934.20,  price:197.00, dayPct:-0.61, status:'LIVE' },
  { ticker:'SWED-A', name:'Swedbank A',           zero:336.10, antal:297, inv:99821.70,  price:357.40, dayPct:-0.86, status:'LIVE' },
  { ticker:'AZA',    name:'Avanza Bank Holding',  zero:358.10, antal:279, inv:99909.90,  price:382.00, dayPct:-1.24, status:'LIVE' }
];
function fmt(n,d=0){return n.toLocaleString('sv-SE',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtSign(n,d=2){return(n>=0?'+':'')+fmt(n,d);}
function cc(n){return n>0?'pos':n<0?'neg':'neu';}
stocks.forEach(s=>{s.varde=s.price*s.antal;s.pl=s.varde-s.inv;s.plPct=(s.pl/s.inv)*100;s.vsNoll=(s.price-s.zero)/s.zero*100;});
const tv=stocks.reduce((a,s)=>a+s.varde,0),tp=tv-INVESTERAT,tpp=(tp/INVESTERAT)*100,tvn=(tv/INVESTERAT-1)*100;
const srt=[...stocks].sort((a,b)=>b.vsNoll-a.vsNoll),best=srt[0],worst=srt[srt.length-1];
const mpp=Math.max(...stocks.map(s=>Math.abs(s.plPct)));
document.getElementById('totalVarde').textContent=fmt(tv,0)+' kr';
const ple=document.getElementById('totalPL');ple.className='card-value '+cc(tp);ple.textContent=fmtSign(tp,0)+' kr';
const ppce=document.getElementById('totalPLPct');ppce.className='card-sub '+cc(tpp);ppce.textContent=fmtSign(tpp)+'% vs noll';
document.getElementById('bestWorst').innerHTML='<span class="pos">'+best.ticker+' '+fmtSign(best.vsNoll)+'%</span> / <span class="'+cc(worst.vsNoll)+'">'+worst.ticker+' '+fmtSign(worst.vsNoll)+'%</span>';
const tb=document.getElementById('tableBody');
stocks.forEach(s=>{
  const bw=mpp>0?Math.abs(s.plPct)/mpp*100:0,bc=s.pl>=0?'#00ff88':'#ff1744';
  const r=document.createElement('tr');
  r.innerHTML='<td><div class="ticker-name">'+s.ticker+'<span class="badge badge-'+(s.status==='LIVE'?'live':'fallback')+'">'+s.status+'</span></div><div class="stock-fullname">'+s.name+'</div></td><td class="neu">'+fmt(s.zero,2)+'</td><td class="neu">'+fmt(s.price,2)+'</td><td class="'+cc(s.dayPct)+'">'+fmtSign(s.dayPct)+'%</td><td class="'+cc(s.vsNoll)+'">'+fmtSign(s.vsNoll)+'%</td><td class="'+cc(s.pl)+'">'+fmtSign(s.pl,0)+'</td><td class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:'+bw+'%;background:'+bc+';"></div></div></td>';
  tb.appendChild(r);
});
const tr2=document.createElement('tr');tr2.className='total-row';
tr2.innerHTML='<td><span style="font-family:'Orbitron',sans-serif;font-size:0.75rem;letter-spacing:0.1em;">TOTALT</span></td><td>'+fmt(INVESTERAT,0)+' kr</td><td>'+fmt(tv,0)+' kr</td><td>—</td><td class="'+cc(tvn)+'">'+fmtSign(tvn)+'%</td><td class="'+cc(tp)+'">'+fmtSign(tp,0)+'</td><td></td>';
tb.appendChild(tr2);
setInterval(()=>{document.getElementById('updateTime').textContent=new Date().toLocaleTimeString('sv-SE');},1000);
document.getElementById('updateTime').textContent=new Date().toLocaleTimeString('sv-SE');
</script>
</body>
</html>
