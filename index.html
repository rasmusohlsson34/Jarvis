<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #050c12;
    --accent: #00e5ff;
    --pos: #00ff88;
    --neg: #ff1744;
    --panel: rgba(0, 229, 255, 0.04);
    --border: rgba(0, 229, 255, 0.18);
    --dim: #5b7a86;
    --amber: #ffb300;
  }
  html, body {
    background: var(--bg);
    color: #cfeef5;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
  }
  body { padding: 28px 22px 60px; position: relative; }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 9998;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 9997;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  }
  .wrap { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 6px; }
  .logo {
    font-family: 'Orbitron', monospace; font-weight: 900;
    font-size: clamp(30px, 6vw, 54px); letter-spacing: 6px; color: var(--accent);
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }
  .subtitle { color: var(--dim); letter-spacing: 3px; font-size: 13px; margin-top: 4px; text-transform: uppercase; }
  .clock {
    font-family: 'Orbitron', monospace; font-size: 20px; color: var(--accent);
    text-align: center; margin: 10px 0 18px; letter-spacing: 2px;
  }

  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
    border: 1px solid var(--border); background: var(--panel);
    padding: 10px 16px; margin-bottom: 22px; font-size: 13px; letter-spacing: 1px;
  }
  .status-left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .dot.green { background: var(--pos); color: var(--pos); }
  .dot.amber { background: var(--amber); color: var(--amber); }
  .dot.red   { background: var(--neg); color: var(--neg); }
  .status-right { color: var(--dim); }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
  @media (max-width: 760px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card {
    border: 1px solid var(--border); background: var(--panel);
    padding: 16px 18px; position: relative; overflow: hidden;
  }
  .card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); opacity: 0.5; }
  .card .label { color: var(--dim); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  .card .value { font-family: 'Orbitron', monospace; font-size: 22px; margin-top: 8px; color: #eafcff; }
  .card .sub { font-size: 13px; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); }
  thead th {
    background: rgba(0,229,255,0.08); color: var(--accent); font-weight: 400;
    text-align: right; padding: 11px 12px; font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; border-bottom: 1px solid var(--border);
  }
  thead th:first-child { text-align: left; }
  tbody td { padding: 11px 12px; text-align: right; border-bottom: 1px solid rgba(0,229,255,0.07); font-size: 14px; }
  tbody td:first-child { text-align: left; }
  tbody tr:hover { background: rgba(0,229,255,0.03); }
  .tkr { font-family: 'Orbitron', monospace; font-size: 14px; color: #eafcff; letter-spacing: 1px; }
  .name { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .badge {
    display: inline-block; font-size: 9px; letter-spacing: 1px; padding: 2px 6px;
    border-radius: 2px; margin-left: 8px; vertical-align: middle;
  }
  .badge.live { background: rgba(0,255,136,0.15); color: var(--pos); border: 1px solid rgba(0,255,136,0.4); }
  .badge.fb   { background: rgba(255,179,0,0.12); color: var(--amber); border: 1px solid rgba(255,179,0,0.4); }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .barcell { width: 120px; }
  .bar-track { width: 110px; height: 10px; background: rgba(255,255,255,0.05); border-radius: 2px; display: inline-block; vertical-align: middle; overflow: hidden; }
  .bar-fill { height: 100%; display: block; }
  tfoot td { padding: 13px 12px; text-align: right; border-top: 2px solid var(--border); font-size: 14px; background: rgba(0,229,255,0.05); }
  tfoot td:first-child { text-align: left; font-family: 'Orbitron', monospace; color: var(--accent); letter-spacing: 1px; }

  footer { text-align: center; color: var(--dim); font-size: 11px; letter-spacing: 2px; margin-top: 26px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="wrap">
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </header>
  <div class="clock" id="clock">--:--:--</div>

  <div class="statusbar">
    <div class="status-left"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
    <div class="status-right" id="updatedText"></div>
  </div>

  <div class="cards" id="cards"></div>

  <table>
    <thead>
      <tr>
        <th>Aktie</th><th>Nollkurs</th><th>Kurs</th><th>Dag%</th><th>Vs noll%</th><th>P&amp;L (SEK)</th><th class="barcell"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>

  <footer>KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>
</div>

<script>
  const INVESTED_TOTAL = 699474.50;
  const UPDATED_AT = "14:09:40";
  // Nollpunkt 9 juni 2026, kl 10:30
  const stocks = [
    { ticker: "NDA-SE", name: "Nordea Bank",          zero: 175.25, qty: 570, invested: 99892.50, price: 181.35, day: 0.44,  status: "LIVE" },
    { ticker: "SHB-A",  name: "Handelsbanken A",      zero: 135.15, qty: 740, invested: 100011.00, price: 141.35, day: -0.18, status: "LIVE" },
    { ticker: "SHB-B",  name: "Handelsbanken B",      zero: 224.20, qty: 446, invested: 99993.20, price: 234.00, day: 0.09,  status: "LIVE" },
    { ticker: "SEB-A",  name: "SEB A",                zero: 184.00, qty: 543, invested: 99912.00, price: 190.60, day: -0.18, status: "LIVE" },
    { ticker: "SEB-C",  name: "SEB C",                zero: 188.20, qty: 531, invested: 99934.20, price: 192.80, day: -0.41, status: "LIVE" },
    { ticker: "SWED-A", name: "Swedbank A",           zero: 336.10, qty: 297, invested: 99821.70, price: 358.40, day: -0.14, status: "LIVE" },
    { ticker: "AZA",    name: "Avanza Bank Holding",  zero: 358.10, qty: 279, invested: 99909.90, price: 393.80, day: 1.65,  status: "LIVE" },
  ];

  const fmtSek = n => Math.round(n).toLocaleString('sv-SE');
  const fmtPct = n => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(2) + '%';
  const fmtPrice = n => n.toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cls = n => n >= 0 ? 'pos' : 'neg';

  // Compute
  let totalVarde = 0;
  stocks.forEach(s => {
    s.varde = s.price * s.qty;
    s.pl = s.varde - s.invested;
    s.plPct = (s.pl / s.invested) * 100;
    s.vsNoll = ((s.price - s.zero) / s.zero) * 100;
    totalVarde += s.varde;
  });
  const totalPl = totalVarde - INVESTED_TOTAL;
  const totalPlPct = (totalPl / INVESTED_TOTAL) * 100;
  const totalVsNoll = totalPlPct; // weighted by invested ≈ same baseline metric
  const maxAbs = Math.max(...stocks.map(s => Math.abs(s.plPct)));

  const best = stocks.reduce((a, b) => b.vsNoll > a.vsNoll ? b : a);
  const worst = stocks.reduce((a, b) => b.vsNoll < a.vsNoll ? b : a);

  const liveCount = stocks.filter(s => s.status === "LIVE").length;

  // Status bar
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  if (liveCount === stocks.length) { dot.className = 'dot green'; statusText.textContent = liveCount + '/' + stocks.length + ' live · Stockholmsbörsen'; }
  else if (liveCount === 0) { dot.className = 'dot red'; statusText.textContent = liveCount + '/' + stocks.length + ' live · 2026-06-29'; }
  else { dot.className = 'dot amber'; statusText.textContent = liveCount + '/' + stocks.length + ' live · 2026-06-29'; }
  document.getElementById('updatedText').textContent = 'Uppdaterad: ' + UPDATED_AT;

  // Cards
  const cards = [
    { label: 'Investerat', value: fmtSek(INVESTED_TOTAL) + ' kr', sub: '' },
    { label: 'Portföljvärde', value: fmtSek(totalVarde) + ' kr', sub: '' },
    { label: 'Total P&L', value: '<span class="' + cls(totalPl) + '">' + (totalPl >= 0 ? '+' : '−') + fmtSek(Math.abs(totalPl)) + ' kr</span>', sub: '<span class="' + cls(totalPlPct) + '">' + fmtPct(totalPlPct) + '</span>' },
    { label: 'Bäst / Sämst', value: '<span class="pos">' + best.ticker + ' ' + fmtPct(best.vsNoll) + '</span>', sub: '<span class="' + cls(worst.vsNoll) + '">' + worst.ticker + ' ' + fmtPct(worst.vsNoll) + '</span>' },
  ];
  document.getElementById('cards').innerHTML = cards.map(c =>
    '<div class="card"><div class="label">' + c.label + '</div><div class="value">' + c.value + '</div>' + (c.sub ? '<div class="sub">' + c.sub + '</div>' : '') + '</div>'
  ).join('');

  // Table
  document.getElementById('tbody').innerHTML = stocks.map(s => {
    const badge = s.status === 'LIVE'
      ? '<span class="badge live">LIVE</span>'
      : '<span class="badge fb">2026-06-29</span>';
    const dayCell = (s.day === null || s.day === undefined)
      ? '<span style="color:var(--dim)">–</span>'
      : '<span class="' + cls(s.day) + '">' + fmtPct(s.day) + '</span>';
    const barW = maxAbs > 0 ? (Math.abs(s.plPct) / maxAbs * 100) : 0;
    const barColor = s.plPct >= 0 ? 'var(--pos)' : 'var(--neg)';
    return '<tr>' +
      '<td><span class="tkr">' + s.ticker + '</span>' + badge + '<div class="name">' + s.name + '</div></td>' +
      '<td>' + fmtPrice(s.zero) + '</td>' +
      '<td>' + fmtPrice(s.price) + '</td>' +
      '<td>' + dayCell + '</td>' +
      '<td class="' + cls(s.vsNoll) + '">' + fmtPct(s.vsNoll) + '</td>' +
      '<td class="' + cls(s.pl) + '">' + (s.pl >= 0 ? '+' : '−') + fmtSek(Math.abs(s.pl)) + '</td>' +
      '<td class="barcell"><span class="bar-track"><span class="bar-fill" style="width:' + barW + '%;background:' + barColor + '"></span></span></td>' +
    '</tr>';
  }).join('');

  document.getElementById('tfoot').innerHTML =
    '<tr><td>TOTALT</td><td>' + fmtSek(INVESTED_TOTAL) + '</td><td>' + fmtSek(totalVarde) + '</td><td><span style="color:var(--dim)">–</span></td>' +
    '<td class="' + cls(totalVsNoll) + '">' + fmtPct(totalVsNoll) + '</td>' +
    '<td class="' + cls(totalPl) + '">' + (totalPl >= 0 ? '+' : '−') + fmtSek(Math.abs(totalPl)) + '</td><td class="barcell"></td></tr>';

  // Live clock
  function tick() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
