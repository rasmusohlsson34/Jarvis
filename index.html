<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #c8e6f0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1001;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    line-height: 1;
  }

  .subtitle {
    font-size: 0.75rem;
    color: rgba(0,229,255,0.55);
    letter-spacing: 0.25em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.72rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(200,230,240,0.75);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    flex-shrink: 0;
  }

  .status-right {
    color: rgba(0,229,255,0.6);
    font-size: 0.70rem;
  }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.18);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.62rem;
    color: rgba(0,229,255,0.55);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.35rem;
    color: #00e5ff;
    letter-spacing: 0.05em;
    line-height: 1.1;
  }

  .card-sub {
    font-size: 0.72rem;
    margin-top: 4px;
    opacity: 0.8;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.25);
  }

  th {
    padding: 10px 14px;
    text-align: right;
    font-size: 0.60rem;
    letter-spacing: 0.1em;
    color: rgba(0,229,255,0.6);
    text-transform: uppercase;
    font-weight: normal;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr:last-child {
    border-bottom: none;
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.2);
  }

  td {
    padding: 11px 14px;
    text-align: right;
    white-space: nowrap;
    vertical-align: middle;
  }

  td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    color: #00e5ff;
    letter-spacing: 0.08em;
    display: block;
  }

  .stock-name {
    font-size: 0.60rem;
    color: rgba(200,230,240,0.45);
    margin-top: 2px;
    display: block;
  }

  .badge {
    display: inline-block;
    font-size: 0.52rem;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 0.08em;
    vertical-align: middle;
    margin-left: 5px;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,180,0,0.12);
    color: #ffb300;
    border: 1px solid rgba(255,180,0,0.3);
  }

  .bar-cell {
    width: 100px;
    padding-right: 16px;
  }

  .bar-bg {
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    height: 8px;
    overflow: hidden;
    width: 100%;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  .total-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    color: rgba(0,229,255,0.8);
    letter-spacing: 0.12em;
  }

  /* FOOTER */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.60rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding-top: 16px;
    border-top: 1px solid rgba(0,229,255,0.08);
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText"></span>
    </div>
    <div class="status-right" id="statusTime"></div>
  </div>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub" style="color:rgba(200,230,240,0.4);">Nollpunkt 9 jun 10:30</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer">KÄLLA: Avanza · Uppdateras var 15 min Mån–Fre 09:00–17:30</div>
</div>

<script>
const DATA = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  price: 179.65, dayPct: -0.03, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       noll: 135.15, antal: 740,  inv: 100011.00, price: 139.15, dayPct: +0.43, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       noll: 224.20, antal: 446,  inv: 99993.20,  price: 232.40, dayPct: +0.43, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 noll: 184.00, antal: 543,  inv: 99912.00,  price: 192.80, dayPct: +0.03, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 noll: 188.20, antal: 531,  inv: 99934.20,  price: 198.80, dayPct: +0.40, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             noll: 336.10, antal: 297,  inv: 99821.70,  price: 346.80, dayPct: +0.29, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  inv: 99909.90,  price: 387.40, dayPct: +0.96, status: 'LIVE' },
];

const totalInv = 699474.50;
const refreshTime = '10:22';
const refreshDate = '2026-06-16';

function fmt(n, decimals=0) {
  return n.toLocaleString('sv-SE', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
}

function sign(n) { return n >= 0 ? '+' : ''; }

// Compute
DATA.forEach(d => {
  d.varde = d.price * d.antal;
  d.pl    = d.varde - d.inv;
  d.plPct = (d.pl / d.inv) * 100;
  d.vsNollPct = ((d.price - d.noll) / d.noll) * 100;
});

const totalVarde = DATA.reduce((s, d) => s + d.varde, 0);
const totalPl    = totalVarde - totalInv;
const totalPlPct = (totalPl / totalInv) * 100;
const totalVsNoll = ((totalVarde - totalInv) / totalInv) * 100;

const liveCnt = DATA.filter(d => d.status === 'LIVE').length;

// Sort for best/worst by vsNollPct
const sorted = [...DATA].sort((a,b) => b.vsNollPct - a.vsNollPct);
const best  = sorted[0];
const worst = sorted[sorted.length - 1];

// Status bar
const dot = document.getElementById('statusDot');
dot.style.background = liveCnt === 7 ? '#00ff88' : liveCnt > 0 ? '#ffb300' : '#ff1744';

document.getElementById('statusText').textContent =
  `${liveCnt}/7 live · Stockholmsbörsen`;

// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('statusTime').textContent =
    'Uppdaterad: ' + now.toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);

// Cards
document.getElementById('cardVarde').innerHTML =
  `<span style="color:#00e5ff">${fmt(totalVarde)} kr</span>`;

const plColor = totalPl >= 0 ? '#00ff88' : '#ff1744';
document.getElementById('cardPl').innerHTML =
  `<span style="color:${plColor}">${sign(totalPl)}${fmt(totalPl)} kr</span>`;
document.getElementById('cardPlPct').innerHTML =
  `<span style="color:${plColor}">${sign(totalPlPct)}${fmt(totalPlPct,2)} %</span>`;

const bestColor  = best.vsNollPct  >= 0 ? '#00ff88' : '#ff1744';
const worstColor = worst.vsNollPct >= 0 ? '#00ff88' : '#ff1744';
document.getElementById('cardBest').innerHTML =
  `<span style="color:${bestColor}">${best.ticker} ${sign(best.vsNollPct)}${fmt(best.vsNollPct,2)}%</span>`;
document.getElementById('cardWorst').innerHTML =
  `<span style="color:${worstColor}">${worst.ticker} ${sign(worst.vsNollPct)}${fmt(worst.vsNollPct,2)}%</span>`;

// Table
const maxAbsPlPct = Math.max(...DATA.map(d => Math.abs(d.plPct)));

const tbody = document.getElementById('tableBody');

DATA.forEach(d => {
  const plColor    = d.pl    >= 0 ? '#00ff88' : '#ff1744';
  const vnColor    = d.vsNollPct >= 0 ? '#00ff88' : '#ff1744';
  const dayColor   = d.dayPct >= 0 ? '#00ff88' : '#ff1744';
  const barWidth   = maxAbsPlPct > 0 ? (Math.abs(d.plPct) / maxAbsPlPct * 100) : 0;
  const badge      = d.status === 'LIVE'
    ? '<span class="badge badge-live">LIVE</span>'
    : `<span class="badge badge-fallback">${refreshDate}</span>`;

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <span class="ticker-name">${d.ticker}${badge}</span>
      <span class="stock-name">${d.name}</span>
    </td>
    <td>${fmt(d.noll, 2)}</td>
    <td>${fmt(d.price, 2)}</td>
    <td style="color:${dayColor}">${sign(d.dayPct)}${fmt(d.dayPct,2)}%</td>
    <td style="color:${vnColor}">${sign(d.vsNollPct)}${fmt(d.vsNollPct,2)}%</td>
    <td style="color:${plColor}">${sign(d.pl)}${fmt(Math.round(d.pl))}</td>
    <td class="bar-cell">
      <div class="bar-bg">
        <div class="bar-fill" style="width:${barWidth.toFixed(1)}%;background:${plColor}"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalPlColor = totalPl >= 0 ? '#00ff88' : '#ff1744';
const totalTr = document.createElement('tr');
totalTr.innerHTML = `
  <td><span class="total-label">TOTALT</span></td>
  <td style="color:rgba(0,229,255,0.6)">${fmt(totalInv)} kr</td>
  <td style="color:#00e5ff">${fmt(totalVarde)} kr</td>
  <td>—</td>
  <td style="color:${totalPlColor}">${sign(totalVsNoll)}${fmt(totalVsNoll,2)}%</td>
  <td style="color:${totalPlColor}">${sign(totalPl)}${fmt(Math.round(totalPl))}</td>
  <td class="bar-cell"></td>
`;
tbody.appendChild(totalTr);
</script>
</body>
</html>
