<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050c12;
    --cyan: #00e5ff;
    --green: #00ff88;
    --red: #ff1744;
    --amber: #ffab00;
    --surface: rgba(0,229,255,0.04);
    --border: rgba(0,229,255,0.15);
    --dim: rgba(0,229,255,0.5);
  }

  html, body {
    background: var(--bg);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    color: var(--dim);
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }

  .status-right {
    color: var(--dim);
  }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px 18px;
  }

  .card-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--cyan);
  }

  .card-value.positive { color: var(--green); }
  .card-value.negative { color: var(--red); }

  .card-sub {
    font-size: 0.7rem;
    color: var(--dim);
    margin-top: 4px;
  }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    background: rgba(0,229,255,0.08);
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  tbody td:first-child { text-align: left; }

  .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--cyan);
  }

  .stock-name {
    font-size: 0.65rem;
    color: var(--dim);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    padding: 2px 5px;
    border-radius: 2px;
    vertical-align: middle;
    margin-left: 6px;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: var(--green);
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,171,0,0.15);
    color: var(--amber);
    border: 1px solid rgba(255,171,0,0.3);
  }

  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral { color: var(--dim); }

  /* BAR CELL */
  .bar-cell {
    width: 100px;
    min-width: 80px;
  }

  .bar-track {
    background: rgba(255,255,255,0.05);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  /* TOTALS ROW */
  .totals-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid var(--border) !important;
  }

  .totals-row td {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
  }

  /* FOOTER */
  footer {
    text-align: center;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    color: rgba(0,229,255,0.3);
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </header>

  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right" id="statusRight"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
      <div class="card-sub">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPL"></div>
      <div class="card-sub" id="cardPLpct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest" style="font-size:0.95rem;"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell">Bar</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>

</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  price: 179.85, dayPct: 0.28,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      noll: 135.15, antal: 740,  inv: 100011.00, price: 141.45, dayPct: 0.21,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      noll: 224.20, antal: 446,  inv: 99993.20,  price: 234.60, dayPct: 0.26,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                noll: 184.00, antal: 543,  inv: 99912.00,  price: 190.20, dayPct: -0.03, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                noll: 188.20, antal: 531,  inv: 99934.20,  price: 192.80, dayPct: 0.00,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',           noll: 336.10, antal: 297,  inv: 99821.70,  price: 359.40, dayPct: 0.81,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  noll: 358.10, antal: 279,  inv: 99909.90,  price: 389.30, dayPct: 1.33,  status: 'LIVE' },
];

const TOTAL_INV = 699474.50;
const UPDATE_TIME = new Date();

function fmt(n, decimals = 0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function sign(n) { return n >= 0 ? '+' : ''; }
function colorClass(n) { return n > 0 ? 'positive' : n < 0 ? 'negative' : 'neutral'; }

// Calculate P&L
const rows = STOCKS.map(s => {
  const varde = s.price * s.antal;
  const pl = varde - s.inv;
  const plPct = (pl / s.inv) * 100;
  const vsNoll = ((s.price - s.noll) / s.noll) * 100;
  return { ...s, varde, pl, plPct, vsNoll };
});

const totalVarde = rows.reduce((a, r) => a + r.varde, 0);
const totalPL = totalVarde - TOTAL_INV;
const totalPLpct = (totalPL / TOTAL_INV) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INV) / TOTAL_INV) * 100;

const sorted = [...rows].sort((a, b) => b.vsNoll - a.vsNoll);
const best = sorted[0];
const worst = sorted[sorted.length - 1];

const maxAbsPlPct = Math.max(...rows.map(r => Math.abs(r.plPct)));
const liveCount = rows.filter(r => r.status === 'LIVE').length;

// Status bar
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const statusRight = document.getElementById('statusRight');

if (liveCount === 7) {
  dot.style.background = '#00ff88';
  dot.style.boxShadow = '0 0 8px #00ff88';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.style.background = '#ff1744';
  dot.style.boxShadow = '0 0 8px #ff1744';
  statusText.textContent = `0/7 live · Fallback-kurser`;
} else {
  dot.style.background = '#ffab00';
  dot.style.boxShadow = '0 0 8px #ffab00';
  statusText.textContent = `${liveCount}/7 live · Stockholmsbörsen`;
}

// Live clock
function updateClock() {
  const now = new Date();
  statusRight.textContent = 'Uppdaterad: ' + now.toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);

// Summary cards
document.getElementById('cardVarde').textContent = fmt(totalVarde) + ' kr';
document.getElementById('cardVarde').className = 'card-value';

const plEl = document.getElementById('cardPL');
plEl.textContent = sign(totalPL) + fmt(totalPL) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPL);

document.getElementById('cardPLpct').textContent = sign(totalPLpct) + fmt(totalPLpct, 2) + '%';

const bestEl = document.getElementById('cardBest');
bestEl.textContent = best.ticker + ' ' + sign(best.vsNoll) + fmt(best.vsNoll, 2) + '%';
bestEl.className = 'card-value positive';

const worstEl = document.getElementById('cardWorst');
worstEl.textContent = 'Sämst: ' + worst.ticker + ' ' + sign(worst.vsNoll) + fmt(worst.vsNoll, 2) + '%';
worstEl.className = 'card-sub ' + colorClass(worst.vsNoll);

// Table body
const tbody = document.getElementById('tableBody');

rows.forEach(r => {
  const tr = document.createElement('tr');

  const barWidth = maxAbsPlPct > 0 ? (Math.abs(r.plPct) / maxAbsPlPct) * 100 : 0;
  const barColor = r.pl >= 0 ? '#00ff88' : '#ff1744';
  const badgeClass = r.status === 'LIVE' ? 'badge-live' : 'badge-fallback';
  const badgeText = r.status === 'LIVE' ? 'LIVE' : r.status;

  const dayStr = r.dayPct !== null ? (sign(r.dayPct) + fmt(r.dayPct, 2) + '%') : '–';
  const dayClass = colorClass(r.dayPct);

  tr.innerHTML = `
    <td>
      <div class="ticker">${r.ticker}<span class="badge ${badgeClass}">${badgeText}</span></div>
      <div class="stock-name">${r.name}</div>
    </td>
    <td>${fmt(r.noll, 2)}</td>
    <td>${fmt(r.price, 2)}</td>
    <td class="${dayClass}">${dayStr}</td>
    <td class="${colorClass(r.vsNoll)}">${sign(r.vsNoll)}${fmt(r.vsNoll, 2)}%</td>
    <td class="${colorClass(r.pl)}">${sign(r.pl)}${fmt(r.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill" style="width:${barWidth.toFixed(1)}%;background:${barColor};"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Totals row
const totRow = document.createElement('tr');
totRow.className = 'totals-row';
totRow.innerHTML = `
  <td><span class="ticker">TOTALT</span></td>
  <td>${fmt(TOTAL_INV)}</td>
  <td>${fmt(totalVarde)}</td>
  <td class="neutral">–</td>
  <td class="${colorClass(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll, 2)}%</td>
  <td class="${colorClass(totalPL)}">${sign(totalPL)}${fmt(totalPL)}</td>
  <td></td>
`;
tbody.appendChild(totRow);
</script>
</body>
</html>
