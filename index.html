<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #c8e6f0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 16px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.75rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.2em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 4px;
    padding: 8px 14px;
    margin-bottom: 20px;
    font-size: 0.75rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }

  .status-right {
    color: rgba(200,230,240,0.5);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.7rem;
    color: rgba(200,230,240,0.4);
    margin-top: 2px;
  }

  .positive { color: #00ff88; }
  .negative { color: #ff1744; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody td {
    padding: 10px 10px;
    vertical-align: middle;
    white-space: nowrap;
  }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: #00e5ff;
    display: block;
  }

  .ticker-fullname {
    font-size: 0.65rem;
    color: rgba(200,230,240,0.35);
    display: block;
    margin-top: 2px;
  }

  .badge-live {
    display: inline-block;
    font-size: 0.55rem;
    background: rgba(0,255,136,0.12);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 3px;
    padding: 1px 5px;
    letter-spacing: 0.1em;
    margin-left: 4px;
    vertical-align: middle;
  }

  .badge-fallback {
    display: inline-block;
    font-size: 0.55rem;
    background: rgba(255,179,0,0.12);
    color: #ffb300;
    border: 1px solid rgba(255,179,0,0.3);
    border-radius: 3px;
    padding: 1px 5px;
    letter-spacing: 0.1em;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* Bar column */
  .bar-cell { min-width: 80px; }

  .bar-track {
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    height: 6px;
    width: 100%;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  .bar-pos { background: #00ff88; }
  .bar-neg { background: #ff1744; }

  /* Total row */
  .total-row td {
    border-top: 1px solid rgba(0,229,255,0.25);
    background: rgba(0,229,255,0.04);
    font-weight: 700;
    color: #00e5ff;
    padding-top: 12px;
    padding-bottom: 12px;
  }

  /* Footer */
  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 0.62rem;
    color: rgba(0,229,255,0.25);
    letter-spacing: 0.12em;
    border-top: 1px solid rgba(0,229,255,0.08);
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right" id="statusTime"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPL"></div>
      <div class="card-sub" id="cardPLPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="portfolioTable">
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell">Bar</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>

  <footer>KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN&ndash;FRE 09:00&ndash;17:30</footer>
</div>

<script>
const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',         kurs: 179.70, dagPct: 0.96,  noll: 175.25, antal: 570,  inv: 99892.50,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      kurs: 138.55, dagPct: 0.14,  noll: 135.15, antal: 740,  inv: 100011.00, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      kurs: 231.40, dagPct: 0.61,  noll: 224.20, antal: 446,  inv: 99993.20,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                kurs: 192.75, dagPct: 2.04,  noll: 184.00, antal: 543,  inv: 99912.00,  status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                kurs: 198.00, dagPct: 1.54,  noll: 188.20, antal: 531,  inv: 99934.20,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',            kurs: 345.80, dagPct: -0.60, noll: 336.10, antal: 297,  inv: 99821.70,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   kurs: 383.70, dagPct: 1.19,  noll: 358.10, antal: 279,  inv: 99909.90,  status: 'LIVE' },
];

const TOTAL_INV = 699474.50;

function fmt(n, decimals = 0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtSign(n, decimals = 2) {
  const s = Math.abs(n).toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return (n >= 0 ? '+' : '−') + s;
}

function colorClass(n) {
  return n >= 0 ? 'positive' : 'negative';
}

// Compute per-stock metrics
stocks.forEach(s => {
  s.varde   = s.kurs * s.antal;
  s.pl      = s.varde - s.inv;
  s.plPct   = (s.pl / s.inv) * 100;
  s.vsNoll  = ((s.kurs - s.noll) / s.noll) * 100;
});

const totalVarde = stocks.reduce((a, s) => a + s.varde, 0);
const totalPL    = stocks.reduce((a, s) => a + s.pl,    0);
const totalPlPct = (totalPL / TOTAL_INV) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INV) / TOTAL_INV) * 100;

const liveCount = stocks.filter(s => s.status === 'LIVE').length;

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

// Best/worst by vsNoll%
const sorted = [...stocks].sort((a, b) => b.vsNoll - a.vsNoll);
const best   = sorted[0];
const worst  = sorted[sorted.length - 1];

// --- Render status ---
const dot  = document.getElementById('statusDot');
const stTx = document.getElementById('statusText');
if (liveCount === 7) {
  dot.style.background    = '#00ff88';
  dot.style.boxShadow     = '0 0 6px #00ff88';
  stTx.textContent        = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.style.background    = '#ff1744';
  dot.style.boxShadow     = '0 0 6px #ff1744';
  stTx.textContent        = `0/7 live · ${new Date().toLocaleDateString('sv-SE')}`;
} else {
  dot.style.background    = '#ffb300';
  dot.style.boxShadow     = '0 0 6px #ffb300';
  stTx.textContent        = `${liveCount}/7 live · ${new Date().toLocaleDateString('sv-SE')}`;
}

function updateClock() {
  const t = new Date().toLocaleTimeString('sv-SE');
  document.getElementById('statusTime').textContent = 'Uppdaterad: ' + t;
}
updateClock();
setInterval(updateClock, 1000);

// --- Render cards ---
document.getElementById('cardVarde').textContent = fmt(totalVarde) + ' kr';
document.getElementById('cardVarde').className   = 'card-value positive';

const plEl = document.getElementById('cardPL');
plEl.textContent = (totalPL >= 0 ? '+' : '') + fmt(Math.round(totalPL)) + ' kr';
plEl.className   = 'card-value ' + colorClass(totalPL);

const plPctEl = document.getElementById('cardPLPct');
plPctEl.textContent = fmtSign(totalPlPct) + ' % vs nollpunkt';
plPctEl.className   = colorClass(totalPL);

document.getElementById('cardBest').innerHTML  = `<span class="${colorClass(best.vsNoll)}">${best.ticker} ${fmtSign(best.vsNoll)} %</span>`;
document.getElementById('cardWorst').innerHTML = `<span class="${colorClass(worst.vsNoll)}">${worst.ticker} ${fmtSign(worst.vsNoll)} %</span>`;

// --- Render table ---
const tbody = document.getElementById('tableBody');
stocks.forEach(s => {
  const barWidth = maxAbsPlPct > 0 ? (Math.abs(s.plPct) / maxAbsPlPct) * 100 : 0;
  const barClass = s.plPct >= 0 ? 'bar-pos' : 'bar-neg';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <span class="ticker-name">${s.ticker}<span class="${s.status === 'LIVE' ? 'badge-live' : 'badge-fallback'}">${s.status}</span></span>
      <span class="ticker-fullname">${s.name}</span>
    </td>
    <td>${fmt(s.noll, 2)}</td>
    <td style="color:#00e5ff">${fmt(s.kurs, 2)}</td>
    <td class="${colorClass(s.dagPct)}">${fmtSign(s.dagPct)} %</td>
    <td class="${colorClass(s.vsNoll)}">${fmtSign(s.vsNoll)} %</td>
    <td class="${colorClass(s.pl)}">${s.pl >= 0 ? '+' : ''}${fmt(Math.round(s.pl))}</td>
    <td class="bar-cell">
      <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${barWidth.toFixed(1)}%"></div></div>
    </td>
  `;
  tbody.appendChild(tr);
});

// --- Total row ---
const tfoot = document.getElementById('tableFoot');
const totalVsNollSign = totalVsNoll >= 0 ? '+' : '−';
const totalPLSign = totalPL >= 0 ? '+' : '−';

const tfr = document.createElement('tr');
tfr.className = 'total-row';
tfr.innerHTML = `
  <td><span style="font-family:'Orbitron',sans-serif;font-size:0.75rem">TOTALT</span></td>
  <td>${fmt(TOTAL_INV)} kr</td>
  <td style="color:#00e5ff">${fmt(totalVarde)} kr</td>
  <td>—</td>
  <td class="${colorClass(totalVsNoll)}">${fmtSign(totalVsNoll)} %</td>
  <td class="${colorClass(totalPL)}">${totalPL >= 0 ? '+' : ''}${fmt(Math.round(totalPL))}</td>
  <td></td>
`;
tfoot.appendChild(tfr);
</script>
</body>
</html>
