<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #b0d4e0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 16px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.6rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.25em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.78rem;
    color: rgba(0,229,255,0.55);
    letter-spacing: 0.18em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 7px 14px;
    font-size: 0.72rem;
    margin-bottom: 20px;
    letter-spacing: 0.06em;
  }

  .status-left { display: flex; align-items: center; gap: 8px; }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }
  .dot.amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
  .dot.red   { background: #ff1744; box-shadow: 0 0 6px #ff1744; }

  .status-right { color: rgba(0,229,255,0.6); }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }

  @media (max-width: 800px) { .cards { grid-template-columns: repeat(2, 1fr); } }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.18);
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.25rem;
    color: #00e5ff;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.72rem;
    margin-top: 3px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: #b0d4e0; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }

  thead th {
    background: rgba(0,229,255,0.08);
    color: rgba(0,229,255,0.7);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 10px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody td {
    padding: 10px 10px;
    text-align: right;
    vertical-align: middle;
  }

  tbody td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.82rem;
    color: #00e5ff;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .stock-fullname {
    font-size: 0.62rem;
    color: rgba(176,212,224,0.45);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    margin-left: 5px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.3);
  }

  /* BAR CELL */
  .bar-cell { min-width: 80px; }

  .bar-track {
    width: 80px;
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  .bar-pos { background: #00ff88; }
  .bar-neg { background: #ff1744; }

  /* TOTAL ROW */
  .total-row td {
    border-top: 1px solid rgba(0,229,255,0.3);
    background: rgba(0,229,255,0.04);
    font-weight: bold;
    color: #00e5ff;
    padding: 11px 10px;
  }

  .total-row td:first-child {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
  }

  /* FOOTER */
  .footer {
    margin-top: 22px;
    border-top: 1px solid rgba(0,229,255,0.1);
    padding-top: 12px;
    font-size: 0.63rem;
    color: rgba(176,212,224,0.35);
    letter-spacing: 0.08em;
    text-align: center;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime">08:09:19</span> &nbsp;|&nbsp; <span id="liveClock"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub neu">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardValue">—</div>
      <div class="card-sub neu" id="cardValueSub"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPL">—</div>
      <div class="card-sub" id="cardPLPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest">—</div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          zero: 175.25, antal: 570,  invested: 99892.50,  price: 179.35, dayPct: -0.25, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       zero: 135.15, antal: 740,  invested: 100011.00, price: 140.60, dayPct:  0.29, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       zero: 224.20, antal: 446,  invested: 99993.20,  price: 232.20, dayPct: -0.09, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 zero: 184.00, antal: 543,  invested: 99912.00,  price: 190.90, dayPct:  0.39, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 zero: 188.20, antal: 531,  invested: 99934.20,  price: 194.20, dayPct:  0.31, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             zero: 336.10, antal: 297,  invested: 99821.70,  price: 356.80, dayPct:  1.08, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   zero: 358.10, antal: 279,  invested: 99909.90,  price: 382.50, dayPct:  1.32, status: 'LIVE' },
];

const TOTAL_INVESTED = 699474.50;

function fmt(n, decimals=2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtInt(n) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function signClass(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu'; }
function signStr(v, decimals=2) { return (v >= 0 ? '+' : '') + fmt(v, decimals); }

// Compute derived values
const rows = STOCKS.map(s => {
  const varde    = s.price * s.antal;
  const pl       = varde - s.invested;
  const plPct    = (pl / s.invested) * 100;
  const vsNoll   = ((s.price - s.zero) / s.zero) * 100;
  return { ...s, varde, pl, plPct, vsNoll };
});

const totalVarde = rows.reduce((a, r) => a + r.varde, 0);
const totalPL    = totalVarde - TOTAL_INVESTED;
const totalPLPct = (totalPL / TOTAL_INVESTED) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INVESTED) / TOTAL_INVESTED) * 100;

// Best / worst by vsNoll
const sorted = [...rows].sort((a, b) => b.vsNoll - a.vsNoll);
const best   = sorted[0];
const worst  = sorted[sorted.length - 1];

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...rows.map(r => Math.abs(r.plPct)));

// Summary cards
document.getElementById('cardValue').textContent = fmtInt(totalVarde) + ' kr';
document.getElementById('cardValueSub').textContent = '';

const plEl = document.getElementById('cardPL');
plEl.textContent = signStr(totalPL, 0) + ' kr';
plEl.className = 'card-value ' + signClass(totalPL);

const plPctEl = document.getElementById('cardPLPct');
plPctEl.textContent = signStr(totalPLPct) + ' %';
plPctEl.className = 'card-sub ' + signClass(totalPLPct);

const bestEl = document.getElementById('cardBest');
bestEl.textContent = best.ticker + ' ' + signStr(best.vsNoll) + ' %';
bestEl.className = 'card-value ' + signClass(best.vsNoll);

const worstEl = document.getElementById('cardWorst');
worstEl.textContent = worst.ticker + ' ' + signStr(worst.vsNoll) + ' %';
worstEl.className = 'card-sub ' + signClass(worst.vsNoll);

// Status dot
const liveCount = rows.filter(r => r.status === 'LIVE').length;
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

if (liveCount === 7) {
  dot.className = 'dot';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.className = 'dot red';
  statusText.textContent = '0/7 live · Fallback data';
} else {
  dot.className = 'dot amber';
  statusText.textContent = liveCount + '/7 live · Delvis fallback';
}

// Table
const tbody = document.getElementById('tableBody');

rows.forEach(r => {
  const barPct = maxAbsPlPct > 0 ? (Math.abs(r.plPct) / maxAbsPlPct) * 100 : 0;
  const barClass = r.pl >= 0 ? 'bar-pos' : 'bar-neg';
  const badge = r.status === 'LIVE'
    ? '<span class="badge badge-live">LIVE</span>'
    : '<span class="badge badge-fallback">25 JUN</span>';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-name">${r.ticker}${badge}</div>
      <div class="stock-fullname">${r.name}</div>
    </td>
    <td>${fmt(r.zero)}</td>
    <td><strong style="color:#e8f4f8">${fmt(r.price)}</strong></td>
    <td class="${signClass(r.dayPct)}">${r.dayPct != null ? signStr(r.dayPct) + ' %' : '–'}</td>
    <td class="${signClass(r.vsNoll)}">${signStr(r.vsNoll)} %</td>
    <td class="${signClass(r.pl)}">${signStr(r.pl, 0)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill ${barClass}" style="width:${barPct.toFixed(1)}%"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td>TOTALT</td>
  <td>${fmtInt(TOTAL_INVESTED)} kr</td>
  <td>${fmtInt(totalVarde)} kr</td>
  <td>–</td>
  <td class="${signClass(totalVsNoll)}">${signStr(totalVsNoll)} %</td>
  <td class="${signClass(totalPL)}">${signStr(totalPL, 0)}</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Live clock
function updateClock() {
  document.getElementById('liveClock').textContent =
    new Date().toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
