<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. · Bankterminalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050c12; --accent:#00e5ff; --pos:#00ff88; --neg:#ff1744;
    --panel:rgba(0,229,255,0.04); --border:rgba(0,229,255,0.18);
    --muted:#5b7a86; --text:#cfeef5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace}
  body{min-height:100vh;padding:28px 20px 60px;position:relative;overflow-x:hidden}
  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:9998;
    background:repeating-linear-gradient(0deg,transparent 2px,rgba(0,229,255,0.015) 2px 4px)}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:9997;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.6) 100%)}
  .wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}
  header{text-align:center;margin-bottom:22px}
  .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:46px;letter-spacing:8px;
    color:var(--accent);text-shadow:0 0 20px rgba(0,229,255,0.5)}
  .subtitle{font-size:13px;color:var(--muted);letter-spacing:3px;margin-top:6px;text-transform:uppercase}
  .clock{font-family:'Orbitron',sans-serif;font-size:18px;color:var(--text);margin-top:10px;letter-spacing:2px}
  .statusrow{display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--border);background:var(--panel);border-radius:6px;
    padding:10px 16px;margin-bottom:22px;font-size:13px;letter-spacing:1px}
  .status-left{display:flex;align-items:center;gap:10px}
  .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .dot.green{background:var(--pos);color:var(--pos)}
  .dot.amber{background:#ffb300;color:#ffb300}
  .dot.red{background:var(--neg);color:var(--neg)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .card{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:16px}
  .card .label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .card .value{font-family:'Orbitron',sans-serif;font-size:24px;margin-top:8px;color:var(--text)}
  .card .sub{font-size:14px;margin-top:4px}
  table{width:100%;border-collapse:collapse;border:1px solid var(--border);background:var(--panel);border-radius:8px;overflow:hidden}
  th,td{padding:11px 12px;text-align:right;font-size:14px;border-bottom:1px solid rgba(0,229,255,0.08)}
  th{color:var(--accent);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;text-align:right;background:rgba(0,229,255,0.05)}
  th:first-child,td:first-child{text-align:left}
  .tk{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--text);letter-spacing:1px}
  .name{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:3px;letter-spacing:1px;vertical-align:middle;margin-left:8px}
  .badge.live{background:rgba(0,255,136,0.12);color:var(--pos);border:1px solid rgba(0,255,136,0.4)}
  .badge.fb{background:rgba(255,179,0,0.12);color:#ffb300;border:1px solid rgba(255,179,0,0.4)}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .barcell{width:120px}
  .bar{height:10px;border-radius:3px;display:inline-block;vertical-align:middle}
  .total td{font-family:'Orbitron',sans-serif;font-weight:700;border-top:2px solid var(--border);border-bottom:none;background:rgba(0,229,255,0.06)}
  footer{text-align:center;margin-top:26px;font-size:11px;color:var(--muted);letter-spacing:2px}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.logo{font-size:32px;letter-spacing:5px}
    th,td{padding:8px 6px;font-size:12px}.barcell{display:none}}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="wrap">
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="statusrow">
    <div class="status-left"><span class="dot green" id="statusdot"></span><span id="statustext">7/7 live · Stockholmsbörsen</span></div>
    <div id="updated">Uppdaterad: 13:08:43</div>
  </div>

  <div class="cards" id="cards"></div>

  <table>
    <thead>
      <tr><th>Aktie</th><th>Nollkurs</th><th>Kurs</th><th>Dag%</th><th>Vs noll%</th><th>P&amp;L (SEK)</th><th class="barcell"></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>
</div>

<script>
  var INVESTERAT_TOTAL = 699474.50;
  var UPDATED_TIME = "13:08:43";
  // status: "LIVE" eller "FALLBACK"; vid FALLBACK visas datum-badge istället för LIVE
  var FALLBACK_DATE = "2026-06-29";
  var data = [
    {ticker:"NDA-SE", namn:"Nordea Bank",          noll:175.25, antal:570, inv:99892.50, kurs:181.00, dag:0.25,  status:"LIVE"},
    {ticker:"SHB-A",  namn:"Handelsbanken A",       noll:135.15, antal:740, inv:100011.00, kurs:141.40, dag:-0.14, status:"LIVE"},
    {ticker:"SHB-B",  namn:"Handelsbanken B",       noll:224.20, antal:446, inv:99993.20, kurs:233.60, dag:-0.09, status:"LIVE"},
    {ticker:"SEB-A",  namn:"SEB A",                 noll:184.00, antal:543, inv:99912.00, kurs:190.65, dag:-0.16, status:"LIVE"},
    {ticker:"SEB-C",  namn:"SEB C",                 noll:188.20, antal:531, inv:99934.20, kurs:193.00, dag:-0.31, status:"LIVE"},
    {ticker:"SWED-A", namn:"Swedbank A",            noll:336.10, antal:297, inv:99821.70, kurs:358.50, dag:-0.11, status:"LIVE"},
    {ticker:"AZA",    namn:"Avanza Bank Holding",   noll:358.10, antal:279, inv:99909.90, kurs:393.20, dag:1.50,  status:"LIVE"}
  ];

  function nf(n,dec){return Number(n).toLocaleString('sv-SE',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
  function sgn(n,dec){var s=n>=0?'+':'';return s+nf(n,dec);}
  function cls(n){return n>=0?'pos':'neg';}

  // beräkningar
  var totVarde=0, totInv=0;
  data.forEach(function(d){
    d.varde = d.kurs * d.antal;
    d.pl = d.varde - d.inv;
    d.plPct = (d.pl / d.inv) * 100;
    d.vsNoll = (d.kurs - d.noll) / d.noll * 100;
    totVarde += d.varde;
    totInv += d.inv;
  });
  var totPl = totVarde - totInv;
  var totPlPct = (totPl / totInv) * 100;
  var totVsNoll = totPlPct; // vs noll på portföljnivå = total avkastning

  var maxAbs = Math.max.apply(null, data.map(function(d){return Math.abs(d.plPct);}));

  // bäst/sämst (vs nollkurs)
  var best = data.reduce(function(a,b){return b.vsNoll>a.vsNoll?b:a;});
  var worst = data.reduce(function(a,b){return b.vsNoll<a.vsNoll?b:a;});

  // status
  var liveCount = data.filter(function(d){return d.status==="LIVE";}).length;
  var n = data.length;
  var dotCls = liveCount===n ? "green" : (liveCount===0 ? "red" : "amber");
  var statusText = liveCount===n ? (n+"/"+n+" live · Stockholmsbörsen")
                                 : (liveCount+"/"+n+" live · "+FALLBACK_DATE);
  document.getElementById('statusdot').className = "dot "+dotCls;
  document.getElementById('statustext').textContent = statusText;
  document.getElementById('updated').textContent = "Uppdaterad: "+UPDATED_TIME;

  // kort
  var cards = [
    {label:"Investerat", value:nf(INVESTERAT_TOTAL,0)+" kr", sub:"", subcls:""},
    {label:"Portföljvärde", value:nf(totVarde,0)+" kr", sub:"", subcls:""},
    {label:"Total P&L", value:sgn(totPl,0)+" kr", sub:sgn(totPlPct,2)+" %", subcls:cls(totPl)},
    {label:"Bäst / Sämst", value:best.ticker+" "+sgn(best.vsNoll,2)+" %", sub:worst.ticker+" "+sgn(worst.vsNoll,2)+" %", subcls:cls(worst.vsNoll), valcls:cls(best.vsNoll)}
  ];
  var ch='';
  cards.forEach(function(c){
    ch += '<div class="card"><div class="label">'+c.label+'</div>'+
          '<div class="value '+(c.valcls||'')+'">'+c.value+'</div>'+
          (c.sub?'<div class="sub '+(c.subcls||'')+'">'+c.sub+'</div>':'')+'</div>';
  });
  document.getElementById('cards').innerHTML = ch;

  // tabell
  var rows='';
  data.forEach(function(d){
    var badge = d.status==="LIVE"
      ? '<span class="badge live">LIVE</span>'
      : '<span class="badge fb">'+FALLBACK_DATE+'</span>';
    var dagTxt = (d.dag===null||d.dag===undefined) ? '–' : '<span class="'+cls(d.dag)+'">'+sgn(d.dag,2)+'%</span>';
    var barW = maxAbs>0 ? Math.round(Math.abs(d.plPct)/maxAbs*110) : 0;
    var barColor = d.plPct>=0 ? 'var(--pos)' : 'var(--neg)';
    rows += '<tr>'+
      '<td><span class="tk">'+d.ticker+'</span>'+badge+'<span class="name">'+d.namn+'</span></td>'+
      '<td>'+nf(d.noll,2)+'</td>'+
      '<td>'+nf(d.kurs,2)+'</td>'+
      '<td>'+dagTxt+'</td>'+
      '<td class="'+cls(d.vsNoll)+'">'+sgn(d.vsNoll,2)+'%</td>'+
      '<td class="'+cls(d.pl)+'">'+sgn(d.pl,0)+'</td>'+
      '<td class="barcell"><span class="bar" style="width:'+barW+'px;background:'+barColor+'"></span></td>'+
    '</tr>';
  });
  rows += '<tr class="total">'+
    '<td>TOTALT</td>'+
    '<td>'+nf(INVESTERAT_TOTAL,0)+'</td>'+
    '<td>'+nf(totVarde,0)+'</td>'+
    '<td>–</td>'+
    '<td class="'+cls(totVsNoll)+'">'+sgn(totVsNoll,2)+'%</td>'+
    '<td class="'+cls(totPl)+'">'+sgn(totPl,0)+'</td>'+
    '<td class="barcell"></td>'+
  '</tr>';
  document.getElementById('tbody').innerHTML = rows;

  // live-klocka
  function tick(){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
  }
  tick();
  setInterval(tick,1000);
</script>
</body>
</html>
