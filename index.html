<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 2px,
      rgba(0,229,255,0.015) 2px 4px
    );
    pointer-events: none;
    z-index: 9998;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 9999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.85rem;
    color: #4a7a8a;
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.8rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px rgba(0,255,136,0.8);
    flex-shrink: 0;
  }

  .status-dot.amber { background: #ffb300; box-shadow: 0 0 8px rgba(255,179,0,0.8); }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 8px rgba(255,23,68,0.8); }

  .status-text { color: #00ff88; }
  .status-right { color: #4a7a8a; font-size: 0.78rem; }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 14px 16px;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, transparent);
    opacity: 0.4;
  }

  .card-label {
    font-size: 0.7rem;
    color: #4a7a8a;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.4rem;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    line-height: 1.2;
  }

  .card-sub {
    font-size: 0.78rem;
    margin-top: 4px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neutral { color: #a0c8d8; }

  /* Table */
  .table-wrapper {
    background: rgba(0,229,255,0.02);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  thead th {
    background: rgba(0,229,255,0.08);
    color: #4a7a8a;
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.15);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:last-child { border-bottom: none; }

  tbody tr:hover { background: rgba(0,229,255,0.04); }

  tbody td {
    padding: 10px 12px;
    text-align: right;
    vertical-align: middle;
  }

  tbody td:first-child { text-align: left; }

  .ticker-cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #00e5ff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,179,0,0.15);
    color: #ffb300;
    border: 1px solid rgba(255,179,0,0.3);
  }

  .ticker-fullname {
    font-size: 0.7rem;
    color: #4a7a8a;
  }

  /* Bar cell */
  .bar-cell { width: 100px; }

  .bar-track {
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
    width: 100%;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  /* Totals row */
  .totals-row td {
    background: rgba(0,229,255,0.07);
    border-top: 1px solid rgba(0,229,255,0.2);
    font-weight: bold;
    color: #00e5ff;
    font-size: 0.9rem;
  }

  .totals-row td:first-child {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: #4a7a8a;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.68rem;
    color: #2a4a5a;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText"></span>
    </div>
    <div class="status-right" id="statusRight"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub neutral">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub neutral" id="cardVardeDate"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest" style="font-size:1.1rem;"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs Noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">KÄLLA: Avanza &nbsp;&middot;&nbsp; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>

</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          nollkurs: 175.25, antal: 570,  investerat: 99892.50,  kurs: 180.20, dayPct: -0.93, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       nollkurs: 135.15, antal: 740,  investerat: 100011.00, kurs: 140.50, dayPct: -0.57, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       nollkurs: 224.20, antal: 446,  investerat: 99993.20,  kurs: 232.40, dayPct: -1.11, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 nollkurs: 184.00, antal: 543,  investerat: 99912.00,  kurs: 192.25, dayPct: -0.36, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 nollkurs: 188.20, antal: 531,  investerat: 99934.20,  kurs: 195.00, dayPct: -0.91, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             nollkurs: 336.10, antal: 297,  investerat: 99821.70,  kurs: 354.70, dayPct: -0.50, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   nollkurs: 358.10, antal: 279,  investerat: 99909.90,  kurs: 381.00, dayPct: -0.86, status: 'LIVE' },
];

const FETCH_TIME = new Date();

function fmt(n, decimals=2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtInt(n) {
  return Math.round(n).toLocaleString('sv-SE');
}
function sign(n) { return n >= 0 ? '+' : ''; }
function cls(n) { return n >= 0 ? 'pos' : 'neg'; }

// Compute P&L
STOCKS.forEach(s => {
  s.varde = s.kurs * s.antal;
  s.pl = s.varde - s.investerat;
  s.plPct = (s.pl / s.investerat) * 100;
  s.vsNollPct = ((s.kurs - s.nollkurs) / s.nollkurs) * 100;
});

const totalInvesterat = 699474.50;
const totalVarde = STOCKS.reduce((a,s) => a + s.varde, 0);
const totalPl = totalVarde - totalInvesterat;
const totalPlPct = (totalPl / totalInvesterat) * 100;
const totalVsNollPct = ((totalVarde - totalInvesterat) / totalInvesterat) * 100;

const liveCount = STOCKS.filter(s => s.status === 'LIVE').length;

// Max plPct for bar scaling
const maxAbsPlPct = Math.max(...STOCKS.map(s => Math.abs(s.plPct)));

// Best / worst by vsNollPct
const best = STOCKS.reduce((a,s) => s.vsNollPct > a.vsNollPct ? s : a, STOCKS[0]);
const worst = STOCKS.reduce((a,s) => s.vsNollPct < a.vsNollPct ? s : a, STOCKS[0]);

// Status dot
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  dot.className = 'status-dot';
  statusText.className = 'status-text pos';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.className = 'status-dot red';
  statusText.className = 'status-text neg';
  statusText.textContent = `0/7 live · ${FETCH_TIME.toLocaleDateString('sv-SE')}`;
} else {
  dot.className = 'status-dot amber';
  statusText.className = 'status-text';
  statusText.style.color = '#ffb300';
  statusText.textContent = `${liveCount}/7 live · ${FETCH_TIME.toLocaleDateString('sv-SE')}`;
}

// Status right - live clock
function updateClock() {
  const now = new Date();
  document.getElementById('statusRight').textContent =
    'Uppdaterad: ' + now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

// Summary cards
document.getElementById('cardVarde').textContent = fmtInt(totalVarde) + ' kr';
document.getElementById('cardVardeDate').textContent = FETCH_TIME.toLocaleDateString('sv-SE', { day:'numeric', month:'short', year:'numeric' });

const plEl = document.getElementById('cardPl');
plEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
plEl.className = 'card-value ' + cls(totalPl);

const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + '%';
plPctEl.className = 'card-sub ' + cls(totalPlPct);

const bestEl = document.getElementById('cardBest');
bestEl.innerHTML = `<span class="pos">${best.ticker} ${sign(best.vsNollPct)}${fmt(best.vsNollPct)}%</span>`;

const worstEl = document.getElementById('cardWorst');
worstEl.innerHTML = `<span class="${cls(worst.vsNollPct)}">${worst.ticker} ${sign(worst.vsNollPct)}${fmt(worst.vsNollPct)}%</span>`;

// Table rows
const tbody = document.getElementById('tableBody');
STOCKS.forEach(s => {
  const barWidth = Math.min(100, (Math.abs(s.plPct) / maxAbsPlPct) * 100);
  const barColor = s.pl >= 0 ? '#00ff88' : '#ff1744';
  const dayStr = s.dayPct !== null ? `<span class="${cls(s.dayPct)}">${sign(s.dayPct)}${fmt(s.dayPct)}%</span>` : '–';
  const badgeCls = s.status === 'LIVE' ? 'badge-live' : 'badge-fallback';
  const badgeTxt = s.status === 'LIVE' ? 'LIVE' : 'FB';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-cell">
        <div class="ticker-name">
          ${s.ticker}
          <span class="badge ${badgeCls}">${badgeTxt}</span>
        </div>
        <div class="ticker-fullname">${s.name}</div>
      </div>
    </td>
    <td class="neutral">${fmt(s.nollkurs)}</td>
    <td class="${cls(s.vsNollPct)}">${fmt(s.kurs)}</td>
    <td>${dayStr}</td>
    <td class="${cls(s.vsNollPct)}">${sign(s.vsNollPct)}${fmt(s.vsNollPct)}%</td>
    <td class="${cls(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill" style="width:${barWidth}%; background:${barColor};"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Totals row
const totalTr = document.createElement('tr');
totalTr.className = 'totals-row';
totalTr.innerHTML = `
  <td>TOTALT</td>
  <td class="neutral">${fmtInt(totalInvesterat)} kr</td>
  <td class="${cls(totalVsNollPct)}">${fmtInt(totalVarde)} kr</td>
  <td>—</td>
  <td class="${cls(totalVsNollPct)}">${sign(totalVsNollPct)}${fmt(totalVsNollPct)}%</td>
  <td class="${cls(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)}</td>
  <td></td>
`;
tbody.appendChild(totalTr);
</script>
</body>
</html>
