<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #050c12;
  color: #b0c4cc;
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
  pointer-events: none;
  z-index: 1000;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  pointer-events: none;
  z-index: 1001;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px;
  position: relative;
  z-index: 1;
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 28px;
  border-bottom: 1px solid rgba(0,229,255,0.2);
  padding-bottom: 20px;
}

.logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.8rem;
  font-weight: 900;
  color: #00e5ff;
  letter-spacing: 0.3em;
  text-shadow: 0 0 20px rgba(0,229,255,0.5);
}

.subtitle {
  font-size: 0.85rem;
  color: rgba(0,229,255,0.5);
  letter-spacing: 0.2em;
  margin-top: 4px;
  text-transform: uppercase;
}

/* STATUS BAR */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,229,255,0.04);
  border: 1px solid rgba(0,229,255,0.15);
  padding: 8px 16px;
  margin-bottom: 24px;
  font-size: 0.78rem;
}

.status-left { display: flex; align-items: center; gap: 10px; }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #00ff88;
  box-shadow: 0 0 8px #00ff88;
}
.status-dot.amber { background: #ffb300; box-shadow: 0 0 8px #ffb300; }
.status-dot.red { background: #ff1744; box-shadow: 0 0 8px #ff1744; }
.status-text { color: rgba(0,229,255,0.7); }
.status-right { color: rgba(0,229,255,0.5); }

/* SUMMARY CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.card {
  background: rgba(0,229,255,0.04);
  border: 1px solid rgba(0,229,255,0.15);
  padding: 16px;
  text-align: center;
}

.card-label {
  font-size: 0.7rem;
  color: rgba(0,229,255,0.5);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 8px;
}

.card-value {
  font-family: 'Share Tech Mono', monospace;
  font-size: 1.2rem;
  color: #00e5ff;
}

.card-value.pos { color: #00ff88; }
.card-value.neg { color: #ff1744; }
.card-sub {
  font-size: 0.75rem;
  margin-top: 4px;
  opacity: 0.7;
}

/* TABLE */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}

thead th {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(0,229,255,0.5);
  padding: 10px 12px;
  text-align: right;
  border-bottom: 1px solid rgba(0,229,255,0.2);
}

thead th:first-child { text-align: left; }

tbody tr {
  border-bottom: 1px solid rgba(0,229,255,0.07);
}

tbody tr:last-child {
  border-top: 1px solid rgba(0,229,255,0.3);
  border-bottom: none;
  background: rgba(0,229,255,0.04);
}

tbody td {
  padding: 11px 12px;
  text-align: right;
  vertical-align: middle;
}

tbody td:first-child { text-align: left; }

.ticker-cell .ticker-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.8rem;
  color: #00e5ff;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.ticker-cell .ticker-full {
  font-size: 0.68rem;
  color: rgba(176,196,204,0.5);
  margin-top: 2px;
}

.badge {
  display: inline-block;
  font-size: 0.55rem;
  padding: 1px 5px;
  border-radius: 2px;
  letter-spacing: 0.1em;
  vertical-align: middle;
  margin-left: 6px;
}

.badge-live {
  background: rgba(0,255,136,0.15);
  color: #00ff88;
  border: 1px solid rgba(0,255,136,0.4);
}

.badge-fallback {
  background: rgba(255,179,0,0.15);
  color: #ffb300;
  border: 1px solid rgba(255,179,0,0.4);
}

.pos { color: #00ff88; }
.neg { color: #ff1744; }
.neu { color: rgba(176,196,204,0.5); }

/* BAR */
.bar-cell { width: 100px; }
.bar-track {
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
  width: 80px;
  margin-left: auto;
}
.bar-fill {
  height: 100%;
  border-radius: 2px;
}
.bar-pos { background: #00ff88; }
.bar-neg { background: #ff1744; }

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid rgba(0,229,255,0.1);
  font-size: 0.65rem;
  color: rgba(0,229,255,0.3);
  letter-spacing: 0.15em;
}

/* CLOCK */
#clock {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.78rem;
  color: rgba(0,229,255,0.5);
}
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>
</div>

<script>
const INVESTED_TOTAL = 699474.50;

const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          zero: 175.25, units: 570,  invested: 99892.50,  price: 179.6,  dayPct: -0.06, live: true },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      zero: 135.15, units: 740,  invested: 100011.00, price: 139.3,  dayPct:  0.54, live: true },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      zero: 224.20, units: 446,  invested: 99993.20,  price: 232.2,  dayPct:  0.35, live: true },
  { ticker: 'SEB-A',  name: 'SEB A',                 zero: 184.00, units: 543,  invested: 99912.00,  price: 193.15, dayPct:  0.21, live: true },
  { ticker: 'SEB-C',  name: 'SEB C',                 zero: 188.20, units: 531,  invested: 99934.20,  price: 199.2,  dayPct:  0.61, live: true },
  { ticker: 'SWED-A', name: 'Swedbank A',             zero: 336.10, units: 297,  invested: 99821.70,  price: 346.8,  dayPct:  0.29, live: true },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  zero: 358.10, units: 279,  invested: 99909.90,  price: 388.9,  dayPct:  1.36, live: true },
];

function fmt(n, decimals = 0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function colorClass(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu'; }

// Compute per-stock
stocks.forEach(s => {
  s.varde = s.price * s.units;
  s.pl = s.varde - s.invested;
  s.plPct = (s.pl / s.invested) * 100;
  s.vsNollPct = ((s.price - s.zero) / s.zero) * 100;
});

const totalVarde = stocks.reduce((a, s) => a + s.varde, 0);
const totalPl = totalVarde - INVESTED_TOTAL;
const totalPlPct = (totalPl / INVESTED_TOTAL) * 100;
const liveCount = stocks.filter(s => s.live).length;

// Best/Worst by vsNollPct
const sorted = [...stocks].sort((a, b) => b.vsNollPct - a.vsNollPct);
const best = sorted[0];
const worst = sorted[sorted.length - 1];

// Max |plPct| for bar scale
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

// Status dot
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  dot.className = 'status-dot';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.className = 'status-dot red';
  statusText.textContent = '0/7 live · Fallback-kurser';
} else {
  dot.className = 'status-dot amber';
  statusText.textContent = liveCount + '/7 live · 16 juni 2026';
}

// Summary cards
document.getElementById('cardVarde').textContent = fmt(totalVarde) + ' kr';
const plEl = document.getElementById('cardPl');
plEl.textContent = sign(totalPl) + fmt(totalPl) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);

const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct, 2) + '%';
plPctEl.className = 'card-sub ' + colorClass(totalPl);

const bestEl = document.getElementById('cardBest');
bestEl.innerHTML = '<span class="pos">' + best.ticker + ' ' + sign(best.vsNollPct) + fmt(best.vsNollPct, 2) + '%</span>';

const worstEl = document.getElementById('cardWorst');
worstEl.innerHTML = '<span class="' + colorClass(worst.vsNollPct) + '">' + worst.ticker + ' ' + sign(worst.vsNollPct) + fmt(worst.vsNollPct, 2) + '%</span>';

// Table rows
const tbody = document.getElementById('tableBody');

stocks.forEach(s => {
  const tr = document.createElement('tr');
  const barPct = maxAbsPlPct > 0 ? (Math.abs(s.plPct) / maxAbsPlPct * 100) : 0;
  const barClass = s.pl >= 0 ? 'bar-pos' : 'bar-neg';

  tr.innerHTML = `
    <td class="ticker-cell">
      <div class="ticker-name">${s.ticker} <span class="badge ${s.live ? 'badge-live' : 'badge-fallback'}">${s.live ? 'LIVE' : 'FALLBACK'}</span></div>
      <div class="ticker-full">${s.name}</div>
    </td>
    <td>${fmt(s.zero, 2)}</td>
    <td>${fmt(s.price, 2)}</td>
    <td class="${colorClass(s.dayPct)}">${s.dayPct !== null ? sign(s.dayPct) + fmt(s.dayPct, 2) + '%' : '–'}</td>
    <td class="${colorClass(s.vsNollPct)}">${sign(s.vsNollPct)}${fmt(s.vsNollPct, 2)}%</td>
    <td class="${colorClass(s.pl)}">${sign(s.pl)}${fmt(Math.round(s.pl))}</td>
    <td class="bar-cell"><div class="bar-track"><div class="bar-fill ${barClass}" style="width:${barPct}%"></div></div></td>
  `;
  tbody.appendChild(tr);
});

// Totals row
const totalTr = document.createElement('tr');
const totalVsNollPct = ((totalVarde - INVESTED_TOTAL) / INVESTED_TOTAL) * 100;
totalTr.innerHTML = `
  <td class="ticker-cell"><div class="ticker-name" style="color:#00e5ff">TOTALT</div></td>
  <td>${fmt(INVESTED_TOTAL)} kr</td>
  <td>${fmt(totalVarde)} kr</td>
  <td class="neu">–</td>
  <td class="${colorClass(totalPlPct)}">${sign(totalVsNollPct)}${fmt(totalVsNollPct, 2)}%</td>
  <td class="${colorClass(totalPl)}">${sign(totalPl)}${fmt(Math.round(totalPl))}</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Live clock
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
