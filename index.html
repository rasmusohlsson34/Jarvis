<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0d4e0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .wrapper {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.25em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.75rem;
    color: #4a8fa0;
    letter-spacing: 0.15em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid rgba(0,229,255,0.15);
    background: rgba(0,229,255,0.04);
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px rgba(0,255,136,0.8);
    flex-shrink: 0;
  }

  .dot.amber { background: #ffaa00; box-shadow: 0 0 6px rgba(255,170,0,0.8); }
  .dot.red { background: #ff1744; box-shadow: 0 0 6pr rgba(255,23,68,0.8); }

  .status-right { color: #4a8fa0; }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (max-width: 800px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    border: 1px solid rgba(0,229,255,0.2);
    background: rgba(0,229,255,0.04);
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: #4a8fa0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.1rem;
    color: #00e5ff;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.7rem;
    margin-top: 3px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    min-width: 700px;
  }

  thead tr {
    border-bottom: 1px solid rgba(0,229,255,0.25);
    background: rgba(0,229,255,0.06);
  }

  th {
    padding: 10px 12px;
    text-align: right;
    font-size: 0.65rem;
    color: #4a8fa0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: normal;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover { background: rgba(0,229,255,0.04); }

  td {
    padding: 11px 12px;
    text-align: right;
    vertical-align: middle;
  }

  td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    color: #00e5ff;
    font-weight: 700;
  }

  .ticker-full {
    font-size: 0.65rem;
    color: #4a8fa0;
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 2px 5px;
    border-radius: 2px;
    margin-left: 5px;
    vertical-align: middle;
    letter-spacing: 0.05em;
    font-family: 'Share Tech Mono', monospace;
  }

  .badge-live {
    background: rgba(0,255,136,0.12);
    border: 1px solid rgba(0,255,136,0.4);
    color: #00ff88;
  }

  .badge-fallback {
    background: rgba(255,170,0,0.12);
    border: 1px solid rgba(255,170,0,0.4);
    color: #ffaa00;
  }

  .bar-cell {
    width: 80px;
    padding-right: 16px;
  }

  .bar-track {
    width: 70px;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  .bar-pos { background: #00ff88; box-shadow: 0 0 4px rgba(0,255,136,0.6); }
  .bar-neg { background: #ff1744; box-shadow: 0 0 4px rgba(255,23,68,0.6); }

  /* TOTAL ROW */
  .total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.25) !important;
    font-weight: bold;
  }

  .total-row td { color: #00e5ff; }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.6rem;
    color: #2a5060;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right" id="updatedText"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475&nbsp;kr</div>
      <div class="card-sub" style="color:#4a8fa0">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde">—</div>
      <div class="card-sub" style="color:#4a8fa0">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl">—</div>
      <div class="card-sub" id="cardPlPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest">—</div>
      <div class="card-sub" id="cardWorst">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="stockBody"></tbody>
    </table>
  </div>

  <div class="footer">Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
const INVESTED_TOTAL = 699474.50;

const stocks = [
  { ticker: 'NDA-SE',  name: 'Nordea Bank',          noll: 175.25, antal: 570,  invested: 99892.50,  price: 180.5,  dayPct: -0.77, status: 'LIVE' },
  { ticker: 'SHB-A',   name: 'Handelsbanken A',       noll: 135.15, antal: 740,  invested: 100011.00, price: 140.4,  dayPct: -0.64, status: 'LIVE' },
  { ticker: 'SHB-B',   name: 'Handelsbanken B',       noll: 224.20, antal: 446,  invested: 99993.20,  price: 233.00, dayPct: -0.85, status: 'LIVE' },
  { ticker: 'SEB-A',   name: 'SEB A',                 noll: 184.00, antal: 543,  invested: 99912.00,  price: 191.95, dayPct: -0.52, status: 'LIVE' },
  { ticker: 'SEB-C',   name: 'SEB C',                 noll: 188.20, antal: 531,  invested: 99934.20,  price: 194.6,  dayPct: -1.12, status: 'LIVE' },
  { ticker: 'SWED-A',  name: 'Swedbank A',            noll: 336.10, antal: 297,  invested: 99821.70,  price: 355.00, dayPct: -0.42, status: 'LIVE' },
  { ticker: 'AZA',     name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  invested: 99909.90,  price: 380.4,  dayPct: -1.01, status: 'LIVE' },
];

function fmt(n, decimals=0) {
  if (n == null) return '—';
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function render() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('sv-SE');
  const dateStr = now.toLocaleDateString('sv-SE');

  // Compute per-stock P&L
  let totalVarde = 0, totalPl = 0;
  let liveCount = 0;
  const computed = stocks.map(s => {
    const varde = s.price * s.antal;
    const pl = varde - s.invested;
    const plPct = (pl / s.invested) * 100;
    const vsNollPct = ((s.price - s.noll) / s.noll) * 100;
    totalVarde += varde;
    totalPl += pl;
    if (s.status === 'LIVE') liveCount++;
    return { ...s, varde, pl, plPct, vsNollPct };
  });

  const totalPlPct = (totalPl / INVESTED_TOTAL) * 100;
  const totalVsNoll = ((totalVarde - INVESTED_TOTAL) / INVESTED_TOTAL) * 100;

  // Best/worst by vsNollPct
  const sorted = [...computed].sort((a, b) => b.vsNollPct - a.vsNollPct);
  const best = sorted[0];
  const worst = sorted[sorted.length - 1];
  const maxAbsPlPct = Math.max(...computed.map(s => Math.abs(s.plPct)));

  // Update status
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  if (liveCount === 7) {
    dot.className = 'dot';
    statusText.textContent = '7/7 live · Stockholmsbörsen';
  } else if (liveCount > 0) {
    dot.className = 'dot amber';
    statusText.textContent = liveCount + '/7 live · ' + dateStr;
  } else {
    dot.className = 'dot red';
    statusText.textContent = '0/7 live · FALLBACK · ' + dateStr;
  }
  document.getElementById('updatedText').textContent = 'Uppdaterad: ' + timeStr;

  // Cards
  document.getElementById('cardVarde').textContent = fmt(totalVarde) + ' kr';
  const plEl = document.getElementById('cardPl');
  plEl.textContent = sign(totalPl) + fmt(totalPl) + ' kr';
  plEl.className = 'card-value ' + (totalPl >= 0 ? 'pos' : 'neg');
  const plPctEl = document.getElementById('cardPlPct');
  plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct, 2) + '%';
  plPctEl.className = 'card-sub ' + (totalPlPct >= 0 ? 'pos' : 'neg');

  document.getElementById('cardBest').textContent = best.ticker + ' ' + sign(best.vsNollPct) + fmt(best.vsNollPct, 2) + '%';
  document.getElementById('cardBest').className = 'card-value ' + (best.vsNollPct >= 0 ? 'pos' : 'neg');
  document.getElementById('cardWorst').textContent = worst.ticker + ' ' + sign(worst.vsNollPct) + fmt(worst.vsNollPct, 2) + '%';
  document.getElementById('cardWorst').className = 'card-sub ' + (worst.vsNollPct >= 0 ? 'pos' : 'neg');

  // Table rows
  const tbody = document.getElementById('stockBody');
  tbody.innerHTML = '';

  computed.forEach(s => {
    const barWidth = maxAbsPlPct > 0 ? Math.round((Math.abs(s.plPct) / maxAbsPlPct) * 100) : 0;
    const isPos = s.pl >= 0;
    const isDayPos = s.dayPct == null ? null : s.dayPct >= 0;
    const isVsPos = s.vsNollPct >= 0;
    const badgeHtml = s.status === 'LIVE'
      ? '<span class="badge badge-live">LIVE</span>'
      : '<span class="badge badge-fallback">FALLBACK</span>';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="ticker-name">${s.ticker}${badgeHtml}</div>
        <div class="ticker-full">${s.name}</div>
      </td>
      <td>${fmt(s.noll, 2)}</td>
      <td style="color:#e0f4ff">${fmt(s.price, 2)}</td>
      <td class="${s.dayPct == null ? '' : (isDayPos ? 'pos' : 'neg')}">${s.dayPct == null ? '—' : (sign(s.dayPct) + fmt(s.dayPct, 2) + '%')}</td>
      <td class="${isVsPos ? 'pos' : 'neg'}">${sign(s.vsNollPct)}${fmt(s.vsNollPct, 2)}%</td>
      <td class="${isPos ? 'pos' : 'neg'}">${sign(s.pl)}${fmt(s.pl)}</td>
      <td class="bar-cell">
        <div class="bar-track">
          <div class="bar-fill ${isPos ? 'bar-pos' : 'bar-neg'}" style="width:${barWidth}%"></div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // Total row
  const totalRow = document.createElement('tr');
  totalRow.className = 'total-row';
  totalRow.innerHTML = `
    <td><div class="ticker-name">TOTALT</div></td>
    <td>${fmt(INVESTED_TOTAL)}</td>
    <td>${fmt(totalVarde)}</td>
    <td>—</td>
    <td class="${totalVsNoll >= 0 ? 'pos' : 'neg'}">${sign(totalVsNoll)}${fmt(totalVsNoll, 2)}%</td>
    <td class="${totalPl >= 0 ? 'pos' : 'neg'}">${sign(totalPl)}${fmt(totalPl)}</td>
    <td></td>
  `;
  tbody.appendChild(totalRow);
}

// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('updatedText').textContent = 'Uppdaterad: ' + now.toLocaleTimeString('sv-SE');
}

render();
setInterval(updateClock, 1000);
</script>
</body>
</html>
