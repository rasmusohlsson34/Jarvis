<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #b0c4cc;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 100;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 101;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.2em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.75rem;
    color: #4a7a8a;
    letter-spacing: 0.15em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
  }

  .status-left { display: flex; align-items: center; gap: 8px; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }
  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 6px #ff1744; }
  .status-text { color: #00ff88; }
  .status-time { color: #4a7a8a; font-size: 0.7rem; }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: #4a7a8a;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.1rem;
    color: #00e5ff;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.7rem;
    color: #4a7a8a;
    margin-top: 2px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
    background: rgba(0,5,10,0.6);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  th {
    padding: 10px 12px;
    text-align: right;
    color: #4a7a8a;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }
  tbody tr:hover { background: rgba(0,229,255,0.04); }
  tbody tr.total-row {
    border-top: 1px solid rgba(0,229,255,0.25);
    background: rgba(0,229,255,0.06);
  }

  td {
    padding: 10px 12px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }
  td:first-child { text-align: left; }

  .ticker-cell .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    color: #00e5ff;
    font-weight: 700;
  }
  .ticker-cell .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 6px;
    letter-spacing: 0.05em;
    vertical-align: middle;
  }
  .badge-live { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
  .badge-fallback { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
  .ticker-cell .name {
    font-size: 0.65rem;
    color: #4a7a8a;
    margin-top: 2px;
  }

  /* Bar */
  .bar-cell { width: 80px; }
  .bar-track {
    background: rgba(255,255,255,0.06);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    width: 70px;
    display: inline-block;
    vertical-align: middle;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }
  .bar-pos { background: #00ff88; }
  .bar-neg { background: #ff1744; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.6rem;
    color: #2a4a5a;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-top: 14px;
    border-top: 1px solid rgba(0,229,255,0.08);
  }

  @media (max-width: 800px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText"></span>
    </div>
    <div class="status-time">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
      <div class="card-sub">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPL"></div>
      <div class="card-sub" id="cardPLPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th style="text-align:center">▓</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">Källa: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
const DATA = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',         noll: 175.25, antal: 570,  inv: 99892.50,  kurs: 183.5,  dag: 1.58,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',     noll: 135.15, antal: 740,  inv: 100011.00, kurs: 141.6,  dag: 0.39,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',     noll: 224.20, antal: 446,  inv: 99993.20,  kurs: 235.4,  dag: 1.03,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',               noll: 184.00, antal: 543,  inv: 99912.00,  kurs: 194.2,  dag: -0.18, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',               noll: 188.20, antal: 531,  inv: 99934.20,  kurs: 197.4,  dag: 0.82,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',           noll: 336.10, antal: 297,  inv: 99821.70,  kurs: 356.9,  dag: 0.37,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding', noll: 358.10, antal: 279,  inv: 99909.90,  kurs: 385.0,  dag: 1.34,  status: 'LIVE' },
];

const TOTAL_INV = 699474.50;

// Compute per-stock values
DATA.forEach(d => {
  d.varde = d.kurs * d.antal;
  d.pl = d.varde - d.inv;
  d.plPct = (d.pl / d.inv) * 100;
  d.vsNollPct = ((d.kurs - d.noll) / d.noll) * 100;
});

const totalVarde = DATA.reduce((s, d) => s + d.varde, 0);
const totalPL = totalVarde - TOTAL_INV;
const totalPLPct = (totalPL / TOTAL_INV) * 100;
const totalVsNollPct = (totalVarde - TOTAL_INV) / TOTAL_INV * 100;
const liveCount = DATA.filter(d => d.status === 'LIVE').length;

// Max |plPct| for bar scaling
const maxPlPct = Math.max(...DATA.map(d => Math.abs(d.plPct)));

function fmt(n, decimals=0) {
  return Math.round(n).toLocaleString('sv-SE');
}
function fmtSign(n, decimals=2) {
  const s = Math.abs(n).toFixed(decimals).replace('.', ',');
  return (n >= 0 ? '+' : '−') + s;
}
function cls(n) { return n >= 0 ? 'pos' : 'neg'; }

// Status dot
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  dot.className = 'status-dot';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
  statusText.style.color = '#00ff88';
} else if (liveCount === 0) {
  dot.className = 'status-dot red';
  statusText.textContent = '0/7 live · Fallback-data';
  statusText.style.color = '#ff1744';
} else {
  dot.className = 'status-dot amber';
  statusText.textContent = liveCount + '/7 live · Delvis live';
  statusText.style.color = '#ffaa00';
}

// Update time
const now = new Date();
document.getElementById('updateTime').textContent = now.toLocaleTimeString('sv-SE');

// Cards
document.getElementById('cardVarde').innerHTML = '<span>' + fmt(totalVarde) + ' kr</span>';
document.getElementById('cardPL').innerHTML = '<span class="' + cls(totalPL) + '">' + fmtSign(totalPL, 0).replace(',','') + ' kr</span>';
document.getElementById('cardPLPct').innerHTML = '<span class="' + cls(totalPLPct) + '">' + fmtSign(totalPLPct) + '%</span> vs nollpunkt';

// Best/worst
const sorted = [...DATA].sort((a, b) => b.vsNollPct - a.vsNollPct);
const best = sorted[0];
const worst = sorted[sorted.length - 1];
document.getElementById('cardBest').innerHTML = '<span class="pos">' + best.ticker + ' ' + fmtSign(best.vsNollPct) + '%</span>';
document.getElementById('cardWorst').innerHTML = '<span class="' + cls(worst.vsNollPct) + '">' + worst.ticker + ' ' + fmtSign(worst.vsNollPct) + '%</span>';

// Table rows
const tbody = document.getElementById('tableBody');
DATA.forEach(d => {
  const tr = document.createElement('tr');
  const dagStr = d.dag !== null ? '<span class="' + cls(d.dag) + '">' + fmtSign(d.dag) + '%</span>' : '–';
  const barWidth = Math.round((Math.abs(d.plPct) / maxPlPct) * 70);
  const barClass = d.pl >= 0 ? 'bar-pos' : 'bar-neg';
  const badgeCls = d.status === 'LIVE' ? 'badge-live' : 'badge-fallback';
  tr.innerHTML = `
    <td class="ticker-cell">
      <div>
        <span class="ticker">${d.ticker}</span>
        <span class="badge ${badgeCls}">${d.status}</span>
      </div>
      <div class="name">${d.name}</div>
    </td>
    <td>${d.noll.toFixed(2).replace('.', ',')} kr</td>
    <td><strong>${d.kurs.toFixed(1).replace('.', ',')} kr</strong></td>
    <td>${dagStr}</td>
    <td><span class="${cls(d.vsNollPct)}">${fmtSign(d.vsNollPct)}%</span></td>
    <td><span class="${cls(d.pl)}">${d.pl >= 0 ? '+' : '−'}${Math.abs(Math.round(d.pl)).toLocaleString('sv-SE')}</span></td>
    <td class="bar-cell" style="text-align:center">
      <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${barWidth}px"></div></div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td class="ticker-cell"><div class="ticker" style="font-size:0.7rem">TOTALT</div></td>
  <td style="color:#4a7a8a">699 475 kr</td>
  <td><strong>${fmt(totalVarde)} kr</strong></td>
  <td>–</td>
  <td><span class="${cls(totalVsNollPct)}">${fmtSign(totalVsNollPct)}%</span></td>
  <td><span class="${cls(totalPL)}">${totalPL >= 0 ? '+' : '−'}${Math.abs(Math.round(totalPL)).toLocaleString('sv-SE')}</span></td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Live clock
setInterval(() => {
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('sv-SE');
}, 1000);
</script>
</body>
</html>
