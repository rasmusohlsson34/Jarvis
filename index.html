<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 10;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 11;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.8rem;
    color: #4a8a9a;
    letter-spacing: 0.15em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.78rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    flex-shrink: 0;
  }

  .status-right {
    color: #4a8a9a;
    font-size: 0.75rem;
  }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: #4a8a9a;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.35rem;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.72rem;
    margin-top: 3px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: #a0c8d8; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    color: #4a8a9a;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.15);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.03);
  }

  tbody td {
    padding: 10px 12px;
    text-align: right;
    white-space: nowrap;
    vertical-align: middle;
  }

  tbody td:first-child { text-align: left; }

  .ticker-cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: #00e5ff;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,179,0,0.15);
    color: #ffb300;
    border: 1px solid rgba(255,179,0,0.3);
  }

  .ticker-fullname {
    font-size: 0.65rem;
    color: #4a8a9a;
  }

  /* BAR */
  .bar-cell {
    width: 90px;
  }

  .bar-track {
    background: rgba(255,255,255,0.05);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  /* TOTAL ROW */
  .total-row td {
    border-top: 1px solid rgba(0,229,255,0.25);
    padding-top: 12px;
    font-size: 0.85rem;
    color: #00e5ff;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.65rem;
    color: #2a4a5a;
    letter-spacing: 0.1em;
    border-top: 1px solid rgba(0,229,255,0.1);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock">--:--:--</span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
      <div class="card-sub neu">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="totalVarde">—</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPl">—</div>
      <div class="card-sub" id="totalPlPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="bestWorst" style="font-size:1rem">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>
</div>

<script>
const NOLLPUNKT = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',        noll: 175.25, antal: 570, inv: 99892.50,  price: 181.9,  dayPct: 0.00, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',    noll: 135.15, antal: 740, inv: 100011.00, price: 141.3,  dayPct: 0.00, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',    noll: 224.20, antal: 446, inv: 99993.20,  price: 235.0,  dayPct: 0.00, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',              noll: 184.00, antal: 543, inv: 99912.00,  price: 192.95, dayPct: 0.00, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',              noll: 188.20, antal: 531, inv: 99934.20,  price: 196.8,  dayPct: 0.00, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',         noll: 336.10, antal: 297, inv: 99821.70,  price: 356.5,  dayPct: 0.00, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',noll: 358.10, antal: 279, inv: 99909.90,  price: 384.3,  dayPct: 0.00, status: 'LIVE' },
];

const TOTAL_INV = 699474.50;

function fmt(n, decimals=2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtInt(n) {
  return Math.round(n).toLocaleString('sv-SE');
}

function sign(n) { return n >= 0 ? '+' : ''; }
function cls(n)  { return n >= 0 ? 'pos' : 'neg'; }

function render() {
  const rows = NOLLPUNKT.map(s => {
    const varde  = s.price * s.antal;
    const pl     = varde - s.inv;
    const plPct  = (pl / s.inv) * 100;
    const vsNoll = ((s.price - s.noll) / s.noll) * 100;
    return { ...s, varde, pl, plPct, vsNoll };
  });

  const totalVarde = rows.reduce((a, r) => a + r.varde, 0);
  const totalPl    = totalVarde - TOTAL_INV;
  const totalPlPct = (totalPl / TOTAL_INV) * 100;

  const maxAbsPlPct = Math.max(...rows.map(r => Math.abs(r.plPct)));

  // Cards
  document.getElementById('totalVarde').textContent = fmtInt(totalVarde) + ' kr';
  document.getElementById('totalVarde').className   = 'card-value pos';

  const plEl = document.getElementById('totalPl');
  plEl.textContent  = sign(totalPl) + fmtInt(totalPl) + ' kr';
  plEl.className    = 'card-value ' + cls(totalPl);

  const plPctEl = document.getElementById('totalPlPct');
  plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + ' %';
  plPctEl.className   = 'card-sub ' + cls(totalPlPct);

  const best  = rows.reduce((a, b) => b.vsNoll > a.vsNoll ? b : a);
  const worst = rows.reduce((a, b) => b.vsNoll < a.vsNoll ? b : a);
  document.getElementById('bestWorst').innerHTML =
    `<span class="pos">${best.ticker} ${sign(best.vsNoll)}${fmt(best.vsNoll)}%</span>` +
    `<br><span class="neg" style="font-size:0.85rem">${worst.ticker} ${sign(worst.vsNoll)}${fmt(worst.vsNoll)}%</span>`;

  // Status
  const liveCount = rows.filter(r => r.status === 'LIVE').length;
  const dot = document.getElementById('statusDot');
  if (liveCount === 7) {
    dot.style.background = '#00ff88';
    dot.style.boxShadow  = '0 0 6px #00ff88';
  } else if (liveCount === 0) {
    dot.style.background = '#ff1744';
    dot.style.boxShadow  = '0 0 6px #ff1744';
  } else {
    dot.style.background = '#ffb300';
    dot.style.boxShadow  = '0 0 6px #ffb300';
  }
  document.getElementById('statusText').textContent =
    `${liveCount}/7 live · Stockholmsbörsen`;

  // Table
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  rows.forEach(r => {
    const barW   = maxAbsPlPct > 0 ? Math.abs(r.plPct) / maxAbsPlPct * 100 : 0;
    const barCol = r.pl >= 0 ? '#00ff88' : '#ff1744';
    const badgeCls = r.status === 'LIVE' ? 'badge-live' : 'badge-fallback';
    const badgeTxt = r.status === 'LIVE' ? 'LIVE' : 'FALLBACK';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="ticker-cell">
          <div class="ticker-name">
            <span>${r.ticker}</span>
            <span class="badge ${badgeCls}">${badgeTxt}</span>
          </div>
          <div class="ticker-fullname">${r.name}</div>
        </div>
      </td>
      <td class="neu">${fmt(r.noll)} SEK</td>
      <td class="neu">${fmt(r.price)} SEK</td>
      <td class="${cls(r.dayPct)}">${r.dayPct !== null ? sign(r.dayPct) + fmt(r.dayPct) + ' %' : '–'}</td>
      <td class="${clr(r.vsNoll)}">${sign(r.vsNoll)}${fmt(r.vsNoll)} %</td>
      <td class="${cls(r.pl)}">${sign(r.pl)}${fmtInt(r.pl)}</td>
      <td class="bar-cell">
        <div class="bar-track">
          <div class="bar-fill" style="width:${barW}%;background:${barCol}"></div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // Total row
  const totalVsNoll = ((totalVarde - TOTAL_INV) / TOTAL_INV) * 100;
  const ttr = document.createElement('tr');
  ttr.className = 'total-row';
  ttr.innerHTML = `
    <td><span style="font-family:'Orbitron',sans-serif;font-size:0.7rem;letter-spacing:0.1em">TOTALT</span></td>
    <td class="neu">${fmtInt(TOTAL_INV)} kr</td>
    <td class="pos">${fmtInt(totalVarde)} kr</td>
    <td>–</td>
    <td class="${cls(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)} %</td>
    <td class="${cls(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)}</td>
    <td></td>
  `;
  tbody.appendChild(ttr);
}

// Live clock
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('sv-SE');
}
tick();
setInterval(tick, 1000);

render();
</script>
</body>
</html>
