<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #c0e8f0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.2);
  }

  .subtitle {
    font-size: 0.8rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.75rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
  }

  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 8px #ff1744; }

  .status-right { color: rgba(0,229,255,0.5); }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
    color: rgba(0,229,255,0.6);
  }

  .positive { color: #00ff88 !important; }
  .negative { color: #ff1744 !important; }
  .neutral { color: #00e5ff !important; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  th {
    padding: 10px 14px;
    text-align: right;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: rgba(0,229,255,0.5);
    text-transform: uppercase;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:last-child {
    border-bottom: none;
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.2);
  }

  tbody tr:hover:not(:last-child) {
    background: rgba(0,229,255,0.04);
  }

  td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker-cell .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .ticker-cell .ticker-full {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.4);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 2px 5px;
    border-radius: 3px;
    letter-spacing: 0.1em;
    margin-left: 6px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    border: 1px solid rgba(0,255,136,0.4);
    color: #00ff88;
  }

  .bar-cell { width: 100px; }

  .bar-wrap {
    width: 80px;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
    margin-left: auto;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  .bar-pos { background: #00ff88; }
  .bar-neg { background: #ff1744; }

  .total-row td {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: #00e5ff;
  }

  /* Clock */
  #clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.6rem;
    color: rgba(0,229,255,0.25);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  @media (max-width: 768px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub" id="cardVardeSub"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs Noll%</th>
          <th>P&L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">Källa: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
const INVESTED_TOTAL = 699474.50;

const stocks = [
  { ticker:'NDA-SE', name:'Nordea Bank',          zero:175.25, antal:570,  invested:99892.50,  price:179.80, dayPct:0.25,  live:true },
  { ticker:'SHB-A',  name:'Handelsbanken A',       zero:135.15, antal:740,  invested:100011.00, price:141.35, dayPct:0.14,  live:true },
  { ticker:'SHB-B',  name:'Handelsbanken B',       zero:224.20, antal:446,  invested:99993.20,  price:233.80, dayPct:-0.09, live:true },
  { ticker:'SEB-A',  name:'SEB A',                 zero:184.00, antal:543,  invested:99912.00,  price:190.00, dayPct:-0.13, live:true },
  { ticker:'SEB-C',  name:'SEB C',                 zero:188.20, antal:531,  invested:99934.20,  price:192.80, dayPct:0.00,  live:true },
  { ticker:'SWED-A', name:'Swedbank A',             zero:336.10, antal:297,  invested:99821.70,  price:358.70, dayPct:0.62,  live:true },
  { ticker:'AZA',    name:'Avanza Bank Holding',   zero:358.10, antal:279,  invested:99909.90,  price:385.40, dayPct:0.31,  live:true },
];

const UPDATE_TIME = '09:37';
const UPDATE_DATE = '2026-06-26';

function fmt(n, decimals=2) {
  return n.toLocaleString('sv-SE', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function fmtInt(n) {
  return n.toLocaleString('sv-SE', {minimumFractionDigits:0, maximumFractionDigits:0});
}
function sign(n) { return n >= 0 ? '+' : ''; }
function colorClass(n) { return n > 0 ? 'positive' : n < 0 ? 'negative' : 'neutral'; }

// Calculate P&L for each stock
let totalVarde = 0;
let maxAbsPlPct = 0;
stocks.forEach(s => {
  s.varde = s.price * s.antal;
  s.pl = s.varde - s.invested;
  s.plPct = (s.pl / s.invested) * 100;
  s.vsNollPct = ((s.price - s.zero) / s.zero) * 100;
  totalVarde += s.varde;
  if(Math.abs(s.plPct) > maxAbsPlPct) maxAbsPlPct = Math.abs(s.plPct);
});

const totalPl = totalVarde - INVESTED_TOTAL;
const totalPlPct = (totalPl / INVESTED_TOTAL) * 100;
const totalVsNoll = ((totalVarde - INVESTED_TOTAL) / INVESTED_TOTAL) * 100;

// Best/Worst by vsNollPct
const sorted = [...stocks].sort((a,b) => b.vsNollPct - a.vsNollPct);
const best = sorted[0];
const worst = sorted[sorted.length-1];

// Status
const liveCount = stocks.filter(s=>s.live).length;

// Render status
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if(liveCount === 7) {
  dot.className = 'status-dot';
  statusText.textContent = `7/7 live · Stockholmsbörsen`;
} else if(liveCount === 0) {
  dot.className = 'status-dot red';
  statusText.textContent = `0/7 live · ${UPDATE_DATE} — Fallback-data`;
} else {
  dot.className = 'status-dot amber';
  statusText.textContent = `${liveCount}/7 live · ${UPDATE_DATE}`;
}

// Render cards
document.getElementById('cardVarde').textContent = fmtInt(totalVarde) + ' kr';
document.getElementById('cardVardeSub').textContent = `${sign(totalPl)}${fmtInt(totalPl)} kr vs nollpunkt`;
const plEl = document.getElementById('cardPl');
plEl.textContent = `${sign(totalPl)}${fmtInt(totalPl)} kr`;
plEl.className = 'card-value ' + colorClass(totalPl);
const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = `${sign(totalPlPct)}${fmt(totalPlPct)} % vs nollpunkt`;
plPctEl.className = 'card-sub ' + colorClass(totalPlPct);

const bestEl = document.getElementById('cardBest');
bestEl.innerHTML = `<span class="positive">${best.ticker} ${sign(best.vsNollPct)}${fmt(best.vsNollPct)}%</span>`;
const worstEl = document.getElementById('cardWorst');
worstEl.innerHTML = `<span class="${colorClass(worst.vsNollPct)}">${worst.ticker} ${sign(worst.vsNollPct)}${fmt(worst.vsNollPct)}%</span>`;

// Render table
const tbody = document.getElementById('tableBody');
stocks.forEach(s => {
  const tr = document.createElement('tr');
  const barPct = maxAbsPlPct > 0 ? Math.abs(s.plPct) / maxAbsPlPct * 100 : 0;
  const dayStr = s.dayPct !== null ? `<span class="${colorClass(s.dayPct)}">${sign(s.dayPct)}${fmt(s.dayPct)}%</span>` : '–';
  tr.innerHTML = `
    <td class="ticker-cell">
      <div class="ticker-name">${s.ticker}<span class="badge badge-live">LIVE</span></div>
      <div class="ticker-full">${s.name}</div>
    </td>
    <td>${fmt(s.zero)} kr</td>
    <td><strong>${fmt(s.price)} kr</strong></td>
    <td>${dayStr}</td>
    <td class="${colorClass(s.vsNollPct)}">${sign(s.vsNollPct)}${fmt(s.vsNollPct)}%</td>
    <td class="${colorClass(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)} kr</td>
    <td class="bar-cell">
      <div class="bar-wrap">
        <div class="bar-fill ${s.pl>=0?'bar-pos':'bar-neg'}" style="width:${barPct.toFixed(1)}%"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td>TOTALT</td>
  <td>${fmtInt(INVESTED_TOTAL)} kr</td>
  <td>${fmtInt(totalVarde)} kr</td>
  <td>–</td>
  <td class="${colorClass(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)}%</td>
  <td class="${colorClass(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)} kr</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Clock
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
