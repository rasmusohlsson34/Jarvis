<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 100;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 101;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.2em;
    margin-top: 4px;
  }

  /* STATUS BAR */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    border: 1px solid rgba(0,229,255,0.2);
    background: rgba(0,229,255,0.03);
    margin-bottom: 20px;
    font-size: 0.8rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
  }

  .status-right {
    color: rgba(0,229,255,0.7);
  }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    border: 1px solid rgba(0,229,255,0.25);
    background: rgba(0,229,255,0.03);
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.3rem;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 2px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    border-bottom: 1px solid rgba(0,229,255,0.3);
  }

  th {
    padding: 10px 12px;
    text-align: right;
    color: rgba(0,229,255,0.5);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
    font-weight: normal;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.08);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr.total-row {
    border-top: 1px solid rgba(0,229,255,0.3);
    border-bottom: none;
    background: rgba(0,229,255,0.05);
  }

  td {
    padding: 10px 12px;
    text-align: right;
    color: rgba(0,229,255,0.85);
  }

  td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .ticker-full {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.4);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.4);
  }

  .badge-fallback {
    background: rgba(255,152,0,0.15);
    color: #ff9800;
    border: 1px solid rgba(255,152,0,0.4);
  }

  /* BAR */
  .bar-cell {
    width: 80px;
    padding-right: 8px;
  }

  .bar-track {
    background: rgba(0,229,255,0.08);
    height: 6px;
    width: 70px;
    display: inline-block;
    vertical-align: middle;
    position: relative;
  }

  .bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
  }

  /* FOOTER */
  .footer {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid rgba(0,229,255,0.1);
    font-size: 0.68rem;
    color: rgba(0,229,255,0.3);
    text-align: center;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <!-- STATUS BAR -->
  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">7/7 live &middot; Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475&nbsp;kr</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer">KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN&ndash;FRE 09:00&ndash;17:30</div>

</div>

<script>
const INVESTED_TOTAL = 699474.50;

const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  investerat: 99892.50,  kurs: 184.35, dagPct: 2.05,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      noll: 135.15, antal: 740,  investerat: 100011.00, kurs: 141.85, dagPct: 0.57,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      noll: 224.20, antal: 446,  investerat: 99993.20,  kurs: 236.00, dagPct: 1.29,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                noll: 184.00, antal: 543,  investerat: 99912.00,  kurs: 194.85, dagPct: 0.15,  status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                noll: 188.20, antal: 531,  investerat: 99934.20,  kurs: 199.60, dagPct: 1.94,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',           noll: 336.10, antal: 297,  investerat: 99821.70,  kurs: 359.10, dagPct: 0.98,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  noll: 358.10, antal: 279,  investerat: 99909.90,  kurs: 387.50, dagPct: 2.00,  status: 'LIVE' },
];

function fmt(n, decimals = 0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function sign(n) { return n >= 0 ? '+' : ''; }
function cls(n)  { return n >= 0 ? 'pos' : 'neg'; }

// Calculate
stocks.forEach(s => {
  s.varde   = s.kurs * s.antal;
  s.pl      = s.varde - s.investerat;
  s.plPct   = (s.pl / s.investerat) * 100;
  s.vsNoll  = ((s.kurs - s.noll) / s.noll) * 100;
});

const totalVarde = stocks.reduce((a, s) => a + s.varde, 0);
const totalPl    = totalVarde - INVESTED_TOTAL;
const totalPlPct = (totalPl / INVESTED_TOTAL) * 100;

const sorted = [...stocks].sort((a, b) => b.vsNoll - a.vsNoll);
const best   = sorted[0];
const worst  = sorted[sorted.length - 1];

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

// Live count
const liveCount = stocks.filter(s => s.status === 'LIVE').length;

// Status dot color
const dot = document.getElementById('statusDot');
if (liveCount === 7)      dot.style.background = '#00ff88', dot.style.boxShadow = '0 0 8px #00ff88';
else if (liveCount === 0) dot.style.background = '#ff1744', dot.style.boxShadow = '0 0 8px #ff1744';
else                       dot.style.background = '#ff9800', dot.style.boxShadow = '0 0 8px #ff9800';

document.getElementById('statusText').textContent =
  liveCount + '/7 live · Stockholmsbörsen · 2026-06-22';

// Update time (now)
const now = new Date();
document.getElementById('updateTime').textContent =
  now.toLocaleTimeString('sv-SE');

// Cards
document.getElementById('cardVarde').textContent = fmt(totalVarde) + ' kr';
document.getElementById('cardVarde').className = 'card-value';

const cardPl = document.getElementById('cardPl');
cardPl.textContent = sign(totalPl) + fmt(totalPl) + ' kr';
cardPl.className = 'card-value ' + cls(totalPl);

const cardPlPct = document.getElementById('cardPlPct');
cardPlPct.textContent = sign(totalPlPct) + fmt(totalPlPct, 2) + '%';
cardPlPct.className = 'card-sub ' + cls(totalPlPct);

const cardBest = document.getElementById('cardBest');
cardBest.textContent = best.ticker + ' ' + sign(best.vsNoll) + fmt(best.vsNoll, 2) + '%';
cardBest.className = 'card-value pos';

const cardWorst = document.getElementById('cardWorst');
cardWorst.textContent = worst.ticker + ' ' + sign(worst.vsNoll) + fmt(worst.vsNoll, 2) + '%';
cardWorst.className = 'card-sub neg';

// Table body
const tbody = document.getElementById('tableBody');

stocks.forEach(s => {
  const tr = document.createElement('tr');
  const barWidth = Math.round((Math.abs(s.plPct) / maxAbsPlPct) * 70);
  const barColor = s.plPct >= 0 ? '#00ff88' : '#ff1744';

  tr.innerHTML = `
    <td>
      <div class="ticker-name">${s.ticker}<span class="badge ${s.status === 'LIVE' ? 'badge-live' : 'badge-fallback'}">${s.status}</span></div>
      <div class="ticker-full">${s.name}</div>
    </td>
    <td>${fmt(s.noll, 2)}</td>
    <td>${fmt(s.kurs, 2)}</td>
    <td class="${cls(s.dagPct)}">${sign(s.dagPct)}${fmt(s.dagPct, 2)}%</td>
    <td class="${cls(s.vsNoll)}">${sign(s.vsNoll)}${fmt(s.vsNoll, 2)}%</td>
    <td class="${cls(s.pl)}">${sign(s.pl)}${fmt(Math.round(s.pl))}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill" style="width:${barWidth}px;background:${barColor};"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totTr = document.createElement('tr');
totTr.className = 'total-row';
totTr.innerHTML = `
  <td><div class="ticker-name">TOTALT</div></td>
  <td>${fmt(INVESTED_TOTAL, 0)} kr</td>
  <td>${fmt(totalVarde, 0)} kr</td>
  <td>–</td>
  <td class="${cls(totalPlPct)}">${sign(totalPlPct)}${fmt(totalPlPct, 2)}%</td>
  <td class="${cls(totalPl)}">${sign(totalPl)}${fmt(Math.round(totalPl))}</td>
  <td class="bar-cell"></td>
`;
tbody.appendChild(totTr);

// Live clock
setInterval(() => {
  document.getElementById('updateTime').textContent =
    new Date().toLocaleTimeString('sv-SE');
}, 1000);
</script>
</body>
</html>
