<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. · Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 9998;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 9999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.2);
  }

  .subtitle {
    font-size: 0.8rem;
    color: #4a7a8a;
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.78rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }

  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 6px #ff1744; }

  .status-right { color: #4a7a8a; }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.68rem;
    color: #4a7a8a;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.4rem;
    color: #00e5ff;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.8rem;
    color: #4a7a8a;
    margin-top: 4px;
  }

  .positive { color: #00ff88; }
  .negative { color: #ff1744; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  th {
    padding: 10px 14px;
    text-align: right;
    font-size: 0.68rem;
    color: #4a7a8a;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: normal;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr:last-child {
    border-bottom: none;
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.2);
  }

  td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
  }

  td:first-child { text-align: left; }

  .ticker-cell {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    color: #00e5ff;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: normal;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.3);
  }

  .company-name {
    font-size: 0.7rem;
    color: #4a7a8a;
  }

  /* Bar column */
  .bar-cell {
    width: 100px;
    padding-right: 16px;
  }

  .bar-track {
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  .bar-pos { background: #00ff88; box-shadow: 0 0 4px rgba(0,255,136,0.4); }
  .bar-neg { background: #ff1744; box-shadow: 0 0 4px rgba(255,23,68,0.4); }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,229,255,0.1);
    font-size: 0.68rem;
    color: #2a4a5a;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock"></span></div>
  </div>

  <!-- Summary cards -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub" id="cardVardeSub"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPL"></div>
      <div class="card-sub" id="cardPLPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs Noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer">KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>

</div>

<script>
const INVESTERAT = 699474.50;

const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          nollkurs: 175.25, antal: 570,  investerat: 99892.50,  kurs: 180.9,  dagPct: -0.11, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      nollkurs: 135.15, antal: 740,  investerat: 100011.00, kurs: 140.95, dagPct: 0.39,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      nollkurs: 224.20, antal: 446,  investerat: 99993.20,  kurs: 233.6,  dagPct: 0.43,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                nollkurs: 184.00, antal: 543,  investerat: 99912.00,  kurs: 194.0,  dagPct: 0.41,  status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                nollkurs: 188.20, antal: 531,  investerat: 99934.20,  kurs: 199.6,  dagPct: 0.50,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',           nollkurs: 336.10, antal: 297,  investerat: 99821.70,  kurs: 355.9,  dagPct: 0.91,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  nollkurs: 358.10, antal: 279,  investerat: 99909.90,  kurs: 376.2,  dagPct: -1.39, status: 'LIVE' },
];

const UPDATE_TIME = new Date().toLocaleTimeString('sv-SE');

// Compute P&L
stocks.forEach(s => {
  s.varde   = s.kurs * s.antal;
  s.pl      = s.varde - s.investerat;
  s.plPct   = (s.pl / s.investerat) * 100;
  s.vsNoll  = ((s.kurs - s.nollkurs) / s.nollkurs) * 100;
});

const totalVarde  = stocks.reduce((a, s) => a + s.varde, 0);
const totalPL     = totalVarde - INVESTERAT;
const totalPLPct  = (totalPL / INVESTERAT) * 100;
const totalVsNoll = ((totalVarde - INVESTERAT) / INVESTERAT) * 100;

const liveCount   = stocks.filter(s => s.status === 'LIVE').length;

// Sort by vsNoll for best/worst
const sorted   = [...stocks].sort((a, b) => b.vsNoll - a.vsNoll);
const best     = sorted[0];
const worst    = sorted[sorted.length - 1];
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

// Formatters
const fmtSEK   = n => n.toLocaleString('sv-SE', { maximumFractionDigits: 0 });
const fmtPct   = (n, d=2) => (n >= 0 ? '+' : '') + n.toFixed(d) + '%';
const fmtKurs  = n => n.toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const colorCls = n => n >= 0 ? 'positive' : 'negative';

// Status bar
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  statusDot.className = 'status-dot';
  statusText.textContent = '7/7 live · Stockholmsbörsen · 18 jun 2026';
} else if (liveCount === 0) {
  statusDot.className = 'status-dot red';
  statusText.textContent = `0/7 live · FALLBACK · 18 jun 2026`;
} else {
  statusDot.className = 'status-dot amber';
  statusText.textContent = `${liveCount}/7 live · Delvis live · 18 jun 2026`;
}

// Clock
document.getElementById('clock').textContent = UPDATE_TIME;
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
}, 1000);

// Cards
document.getElementById('cardVarde').innerHTML =
  `<span class="positive">${fmtSEK(totalVarde)} kr</span>`;
document.getElementById('cardVardeSub').textContent = `+${fmtSEK(totalVarde - INVESTERAT)} kr vs nollpunkt`;

document.getElementById('cardPL').innerHTML =
  `<span class="${colorCls(totalPL)}">${totalPL >= 0 ? '+' : ''}${fmtSEK(totalPL)} kr</span>`;
document.getElementById('cardPLPct').innerHTML =
  `<span class="${colorCls(totalPLPct)}">${fmtPct(totalPLPct)}</span> vs nollpunkt`;

document.getElementById('cardBest').innerHTML =
  `<span class="positive">${best.ticker} ${fmtPct(best.vsNoll)}</span>`;
document.getElementById('cardWorst').innerHTML =
  `Sämst: <span class="${colorCls(worst.vsNoll)}">${worst.ticker} ${fmtPct(worst.vsNoll)}</span>`;

// Table
const tbody = document.getElementById('tableBody');

stocks.forEach(s => {
  const badgeCls  = s.status === 'LIVE' ? 'badge badge-live' : 'badge badge-fallback';
  const badgeTxt  = s.status === 'LIVE' ? 'LIVE' : 'FALLBACK';
  const barWidth  = maxAbsPlPct > 0 ? Math.abs(s.plPct) / maxAbsPlPct * 100 : 0;
  const barCls    = s.plPct >= 0 ? 'bar-fill bar-pos' : 'bar-fill bar-neg';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-cell">
        <div class="ticker-name">
          ${s.ticker}
          <span class="${badgeCls}">${badgeTxt}</span>
        </div>
        <div class="company-name">${s.name}</div>
      </div>
    </td>
    <td>${fmtKurs(s.nollkurs)}</td>
    <td><strong style="color:#e0f0ff">${fmtKurs(s.kurs)}</strong></td>
    <td class="${colorCls(s.dagPct)}">${s.dagPct !== null ? fmtPct(s.dagPct) : '–'}</td>
    <td class="${colorCls(s.vsNoll)}">${fmtPct(s.vsNoll)}</td>
    <td class="${colorCls(s.pl)}">${s.pl >= 0 ? '+' : ''}${fmtSEK(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="${barCls}" style="width:${barWidth.toFixed(1)}%"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Totals row
const totalVsNollPct = ((totalVarde - INVESTERAT) / INVESTERAT) * 100;
const trTotal = document.createElement('tr');
trTotal.innerHTML = `
  <td><strong style="color:#00e5ff;font-family:'Orbitron',sans-serif;font-size:0.8rem">TOTALT</strong></td>
  <td style="color:#4a7a8a">${fmtSEK(INVESTERAT)} kr</td>
  <td style="color:#e0f0ff"><strong>${fmtSEK(totalVarde)} kr</strong></td>
  <td style="color:#4a7a8a">–</td>
  <td class="${colorCls(totalVsNollPct)}">${fmtPct(totalVsNollPct)}</td>
  <td class="${colorCls(totalPL)}"><strong>${totalPL >= 0 ? '+' : ''}${fmtSEK(totalPL)} kr</strong></td>
  <td class="bar-cell"></td>
`;
tbody.appendChild(trTotal);
</script>
</body>
</html>
