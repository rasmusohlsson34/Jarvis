<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 10;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 11;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.2em;
    margin-top: 6px;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.8rem;
  }

  .status-left { display: flex; align-items: center; gap: 8px; }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }

  .status-text { color: #00ff88; }
  .status-right { color: rgba(160,200,216,0.6); }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(0,229,255,0.03);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 16px;
  }

  .card-label {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.3rem;
    color: #00e5ff;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.8rem;
    margin-top: 4px;
  }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  thead th {
    background: rgba(0,229,255,0.08);
    color: rgba(0,229,255,0.7);
    padding: 10px 14px;
    text-align: right;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover { background: rgba(0,229,255,0.04); }

  td {
    padding: 10px 14px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 6px;
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.4);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.4);
  }

  .stock-fullname {
    font-size: 0.7rem;
    color: rgba(160,200,216,0.5);
    margin-top: 2px;
    font-family: 'Share Tech Mono', monospace;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neutral { color: rgba(160,200,216,0.6); }

  /* BAR */
  .bar-cell { width: 80px; }

  .bar-track {
    background: rgba(255,255,255,0.05);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    min-width: 60px;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  /* TOTAL ROW */
  .total-row td {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.25);
    font-weight: bold;
    color: #00e5ff;
  }

  .total-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: rgba(0,229,255,0.7);
  }

  /* FOOTER */
  footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,229,255,0.1);
    font-size: 0.7rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.1em;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2,1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="dot" id="statusDot"></div>
      <span class="status-text" id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
      <div class="card-sub neutral">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="totalVarde"></div>
      <div class="card-sub neutral" id="totalVardeSub"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPl"></div>
      <div class="card-sub" id="totalPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" style="font-size:1rem;" id="bestWorst"></div>
      <div class="card-sub neutral">vs nollkurs</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>

</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          nollkurs: 175.25, antal: 570,  investerat: 99892.50,  price: 179.8,  day: -1.15, live: true },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      nollkurs: 135.15, antal: 740,  investerat: 100011.00, price: 140.2,  day: -0.78, live: true },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      nollkurs: 224.20, antal: 446,  investerat: 99993.20,  price: 232.4,  day: -1.11, live: true },
  { ticker: 'SEB-A',  name: 'SEB A',                nollkurs: 184.00, antal: 543,  investerat: 99912.00,  price: 190.15, day: -1.45, live: true },
  { ticker: 'SEB-C',  name: 'SEB C',                nollkurs: 188.20, antal: 531,  investerat: 99934.20,  price: 193.6,  day: -1.63, live: true },
  { ticker: 'SWED-A', name: 'Swedbank A',            nollkurs: 336.10, antal: 297,  investerat: 99821.70,  price: 353.0,  day: -0.98, live: true },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  nollkurs: 358.10, antal: 279,  investerat: 99909.90,  price: 377.5,  day: -1.77, live: true },
];

const TOTAL_INVESTERAT = 699474.50;
const LIVE_DATE = '2026-06-25';

function fmt(n, decimals=2) {
  return (n >= 0 ? '+' : '') + n.toFixed(decimals);
}

function fmtSEK(n) {
  return (n >= 0 ? '+' : '') + Math.round(n).toLocaleString('sv-SE') + ' kr';
}

function fmtSEKabs(n) {
  return Math.round(n).toLocaleString('sv-SE') + ' kr';
}

// Compute per stock
const rows = STOCKS.map(s => {
  const varde = s.price * s.antal;
  const pl = varde - s.investerat;
  const plPct = (pl / s.investerat) * 100;
  const vsNoll = (s.price - s.nollkurs) / s.nollkurs * 100;
  return { ...s, varde, pl, plPct, vsNoll };
});

// Totals
const totalVarde = rows.reduce((a,r) => a + r.varde, 0);
const totalPl = totalVarde - TOTAL_INVESTERAT;
const totalPlPct = (totalPl / TOTAL_INVESTERAT) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INVESTERAT) / TOTAL_INVESTERAT) * 100;

// Best/Worst
const sorted = [...rows].sort((a,b) => b.vsNoll - a.vsNoll);
const best = sorted[0];
const worst = sorted[sorted.length-1];

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...rows.map(r => Math.abs(r.plPct)));

// Live count
const liveCount = rows.filter(r => r.live).length;

// Status dot
const dot = document.getElementById('statusDot');
const statusTxt = document.getElementById('statusText');
if (liveCount === 7) {
  dot.style.background = '#00ff88';
  dot.style.boxShadow = '0 0 6px #00ff88';
  statusTxt.style.color = '#00ff88';
  statusTxt.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.style.background = '#ff1744';
  dot.style.boxShadow = '0 0 6px #ff1744';
  statusTxt.style.color = '#ff1744';
  statusTxt.textContent = '0/7 live · ' + LIVE_DATE;
} else {
  dot.style.background = '#ffaa00';
  dot.style.boxShadow = '0 0 6px #ffaa00';
  statusTxt.style.color = '#ffaa00';
  statusTxt.textContent = liveCount + '/7 live · ' + LIVE_DATE;
}

// Update time (static from when page was generated)
const UPDATE_TIME = '2026-06-25T' + new Date().toLocaleTimeString('sv-SE');
document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('sv-SE');

// Cards
const plColor = totalPl >= 0 ? '#00ff88' : '#ff1744';
document.getElementById('totalVarde').textContent = fmtSEKabs(totalVarde);
document.getElementById('totalVardeSub').textContent = rows.filter(r=>r.live).length + '/7 live · ' + LIVE_DATE;
document.getElementById('totalPl').style.color = plColor;
document.getElementById('totalPl').textContent = fmtSEK(totalPl);
document.getElementById('totalPlPct').innerHTML = `<span style="color:${plColor}">${fmt(totalPlPct)} %</span>`;

const bColor = best.vsNoll >= 0 ? '#00ff88' : '#ff1744';
const wColor = worst.vsNoll >= 0 ? '#00ff88' : '#ff1744';
document.getElementById('bestWorst').innerHTML =
  `<span style="color:${bColor}">${best.ticker} ${fmt(best.vsNoll)}%</span><br>` +
  `<span style="color:${wColor}">${worst.ticker} ${fmt(worst.vsNoll)}%</span>`;

// Table rows
const tbody = document.getElementById('tableBody');
rows.forEach(r => {
  const vsNollColor = r.vsNoll >= 0 ? '#00ff88' : '#ff1744';
  const plColor = r.pl >= 0 ? '#00ff88' : '#ff1744';
  const dayColor = r.day === null ? '#a0c8d8' : (r.day >= 0 ? '#00ff88' : '#ff1744');
  const barPct = maxAbsPlPct > 0 ? Math.abs(r.plPct) / maxAbsPlPct * 100 : 0;
  const barColor = r.pl >= 0 ? '#00ff88' : '#ff1744';

  const badge = r.live
    ? `<span class="badge badge-live">LIVE</span>`
    : `<span class="badge badge-fallback">${LIVE_DATE}</span>`;

  const dayStr = r.day === null ? '–' : `<span style="color:${dayColor}">${r.day >= 0 ? '+' : ''}${r.day.toFixed(2)} %</span>`;

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div><span class="ticker-name">${r.ticker}</span>${badge}</div>
      <div class="stock-fullname">${r.name}</div>
    </td>
    <td>${r.nollkurs.toLocaleString('sv-SE', {minimumFractionDigits:2,maximumFractionDigits:2})} kr</td>
    <td style="color:#00e5ff">${r.price.toLocaleString('sv-SE', {minimumFractionDigits:2,maximumFractionDigits:2})} kr</td>
    <td>${dayStr}</td>
    <td style="color:${vsNollColor}">${fmt(r.vsNoll)} %</td>
    <td style="color:${plColor}">${fmtSEK(r.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill" style="width:${barPct.toFixed(1)}%;background:${barColor}"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalRow = document.createElement('tr');
totalRow.className = 'total-row';
const tvColor = totalPl >= 0 ? '#00ff88' : '#ff1744';
const tvNollColor = totalVsNoll >= 0 ? '#00ff88' : '#ff1744';
totalRow.innerHTML = `
  <td><span class="total-label">TOTALT</span></td>
  <td>${Math.round(TOTAL_INVESTERAT).toLocaleString('sv-SE')} kr</td>
  <td style="color:#00e5ff">${Math.round(totalVarde).toLocaleString('sv-SE')} kr</td>
  <td class="neutral">–</td>
  <td style="color:${tvNollColor}">${fmt(totalVsNoll)} %</td>
  <td style="color:${tvColor}">${fmtSEK(totalPl)}</td>
  <td></td>
`;
tbody.appendChild(totalRow);

// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('updateTime').textContent = now.toLocaleTimeString('sv-SE');
}
setInterval(updateClock, 1000);
</script>
</body>
</html>
