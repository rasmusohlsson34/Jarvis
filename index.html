<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0d8ef;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 999;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 998;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    line-height: 1;
  }

  .subtitle {
    font-size: 0.75rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.25em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.75rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    flex-shrink: 0;
  }

  .status-text { color: rgba(0,229,255,0.7); }
  .status-right { color: rgba(0,229,255,0.5); }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.45);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #00e5ff;
    line-height: 1;
  }

  .card-sub {
    font-size: 0.72rem;
    margin-top: 6px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    background: rgba(0,229,255,0.07);
    color: rgba(0,229,255,0.6);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 12px;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody td {
    padding: 12px 12px;
    text-align: right;
    color: #a0d8ef;
    vertical-align: middle;
  }

  tbody td:first-child { text-align: left; }

  .ticker-cell .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #00e5ff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.1em;
  }

  .badge-live {
    background: rgba(0,255,136,0.12);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,165,0,0.12);
    color: #ffaa00;
    border: 1px solid rgba(255,165,0,0.3);
  }

  .ticker-cell .company-name {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.35);
    margin-top: 3px;
  }

  /* Bar */
  .bar-wrap {
    width: 80px;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
  }

  /* Total row */
  .total-row td {
    border-top: 1px solid rgba(0,229,255,0.25);
    font-weight: bold;
    color: #00e5ff;
    padding-top: 14px;
    padding-bottom: 14px;
    background: rgba(0,229,255,0.04);
  }

  .total-row td:first-child {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.62rem;
    color: rgba(0,229,255,0.2);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding-top: 12px;
    border-top: 1px solid rgba(0,229,255,0.08);
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText"></span>
    </div>
    <span class="status-right" id="statusRight"></span>
  </div>

  <!-- Summary cards -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde">—</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Live kurs</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPL" style="color:#00ff88">—</div>
      <div class="card-sub" id="cardPLPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest" style="font-size:0.95rem">—</div>
      <div class="card-sub" id="cardWorst">—</div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs Noll %</th>
          <th>P&amp;L (SEK)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer">KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>

</div>

<script>
const STOCKS = [
  { ticker:'NDA-SE', name:'Nordea Bank',          nollkurs:175.25, antal:570,  investerat:99892.50,  price:179.15, dayPct:0.65,  status:'LIVE' },
  { ticker:'SHB-A',  name:'Handelsbanken A',       nollkurs:135.15, antal:740,  investerat:100011.00, price:139.20, dayPct:0.61,  status:'LIVE' },
  { ticker:'SHB-B',  name:'Handelsbanken B',       nollkurs:224.20, antal:446,  investerat:99993.20,  price:232.80, dayPct:1.22,  status:'LIVE' },
  { ticker:'SEB-A',  name:'SEB A',                 nollkurs:184.00, antal:543,  investerat:99912.00,  price:191.65, dayPct:1.46,  status:'LIVE' },
  { ticker:'SEB-C',  name:'SEB C',                 nollkurs:188.20, antal:531,  investerat:99934.20,  price:197.60, dayPct:1.33,  status:'LIVE' },
  { ticker:'SWED-A', name:'Swedbank A',             nollkurs:336.10, antal:297,  investerat:99821.70,  price:348.60, dayPct:0.20,  status:'LIVE' },
  { ticker:'AZA',    name:'Avanza Bank Holding',   nollkurs:358.10, antal:279,  investerat:99909.90,  price:383.50, dayPct:1.13,  status:'LIVE' },
];

const TOTAL_INVESTERAT = 699474.50;

// Calculate
STOCKS.forEach(s => {
  s.varde    = s.price * s.antal;
  s.pl       = s.varde - s.investerat;
  s.plPct    = (s.pl / s.investerat) * 100;
  s.vsNoll   = ((s.price - s.nollkurs) / s.nollkurs) * 100;
});

const totalVarde = STOCKS.reduce((a,s) => a + s.varde, 0);
const totalPL    = totalVarde - TOTAL_INVESTERAT;
const totalPLPct = (totalPL / TOTAL_INVESTERAT) * 100;
const totalVsNoll= totalPLPct;
const liveCount  = STOCKS.filter(s => s.status === 'LIVE').length;

const sorted = [...STOCKS].sort((a,b) => b.vsNoll - a.vsNoll);
const best  = sorted[0];
const worst = sorted[sorted.length-1];

// Max |plPct| for bar scaling
const maxPlPct = Math.max(...STOCKS.map(s => Math.abs(s.plPct)));

function fmt(n, dec=2) {
  const sign = n > 0 ? '+' : '';
  return sign + n.toFixed(dec).replace('.', ',');
}

function fmtSEK(n) {
  return Math.round(n).toLocaleString('sv-SE') + ' kr';
}

function fmtSEKsigned(n) {
  const sign = n >= 0 ? '+' : '';
  return sign + Math.round(n).toLocaleString('sv-SE') + ' kr';
}

// Status bar
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const statusRight= document.getElementById('statusRight');

if (liveCount === 7) {
  statusDot.style.background = '#00ff88';
  statusDot.style.boxShadow  = '0 0 6px #00ff88';
} else if (liveCount > 0) {
  statusDot.style.background = '#ffaa00';
  statusDot.style.boxShadow  = '0 0 6px #ffaa00';
} else {
  statusDot.style.background = '#ff1744';
  statusDot.style.boxShadow  = '0 0 6px #ff1744';
}

const today = new Date().toLocaleDateString('sv-SE');
statusText.textContent = liveCount === 7
  ? `${liveCount}/7 live · Stockholmsbörsen`
  : `${liveCount}/7 live · ${today}`;

// Clock
function updateClock() {
  const now = new Date();
  const t = now.toLocaleTimeString('sv-SE');
  statusRight.textContent = `Uppdaterad: ${t}`;
}
updateClock();
setInterval(updateClock, 1000);

// Cards
const plColor = totalPL >= 0 ? '#00ff88' : '#ff1744';
document.getElementById('cardVarde').textContent = fmtSEK(totalVarde);
const cardPL = document.getElementById('cardPL');
cardPL.textContent = fmtSEKsigned(totalPL);
cardPL.style.color = plColor;
const cardPLPct = document.getElementById('cardPLPct');
cardPLPct.textContent = fmt(totalPLPct) + '%';
cardPLPct.className = 'card-sub ' + (totalPL >= 0 ? 'pos' : 'neg');

const cardBest  = document.getElementById('cardBest');
const cardWorst = document.getElementById('cardWorst');
cardBest.innerHTML  = `<span style="color:#00ff88">${best.ticker} ${fmt(best.vsNoll)}%</span>`;
cardWorst.innerHTML = `<span style="color:rgba(0,229,255,0.5)">Sämst: ${worst.ticker} ${fmt(worst.vsNoll)}%</span>`;

// Table rows
const tbody = document.getElementById('tableBody');

STOCKS.forEach(s => {
  const tr = document.createElement('tr');
  const vsNollColor = s.vsNoll >= 0 ? '#00ff88' : '#ff1744';
  const plColor2    = s.pl >= 0     ? '#00ff88' : '#ff1744';
  const dayColor    = s.dayPct >= 0 ? '#00ff88' : '#ff1744';
  const barPct      = maxPlPct > 0 ? Math.abs(s.plPct) / maxPlPct * 100 : 0;
  const barColor    = s.pl >= 0 ? '#00ff88' : '#ff1744';

  const badgeHtml = s.status === 'LIVE'
    ? `<span class="badge badge-live">LIVE</span>`
    : `<span class="badge badge-fallback">FALLBACK</span>`;

  tr.innerHTML = `
    <td class="ticker-cell">
      <div class="ticker-name">${s.ticker} ${badgeHtml}</div>
      <div class="company-name">${s.name}</div>
    </td>
    <td>${s.nollkurs.toFixed(2).replace('.', ',')}</td>
    <td style="color:#00e5ff;font-weight:bold">${s.price.toFixed(2).replace('.', ',')}</td>
    <td style="color:${dayColor}">${s.dayPct != null ? fmt(s.dayPct) + '%' : '–'}</td>
    <td style="color:${vsNollColor}">${fmt(s.vsNoll)}%</td>
    <td style="color:${plColor2}">${fmtSEKsigned(s.pl)}</td>
    <td>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${barPct.toFixed(1)}%;background:${barColor}"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalVsNollColor = totalVsNoll >= 0 ? '#00ff88' : '#ff1744';
const totalPLColor     = totalPL >= 0    ? '#00ff88' : '#ff1744';
const trTotal = document.createElement('tr');
trTotal.className = 'total-row';
trTotal.innerHTML = `
  <td>TOTALT</td>
  <td style="color:rgba(0,229,255,0.6)">${fmtSEK(TOTAL_INVESTERAT)}</td>
  <td style="color:#00e5ff;font-weight:bold">${fmtSEK(totalVarde)}</td>
  <td>–</td>
  <td style="color:${totalVsNollColor}">${fmt(totalVsNoll)}%</td>
  <td style="color:${totalPLColor}">${fmtSEKsigned(totalPL)}</td>
  <td></td>
`;
tbody.appendChild(trTotal);
</script>
</body>
</html>
