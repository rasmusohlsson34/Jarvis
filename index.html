<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050c12;
    --cyan: #00e5ff;
    --green: #00ff88;
    --red: #ff1744;
    --amber: #ffab00;
    --dim: rgba(0,229,255,0.12);
    --border: rgba(0,229,255,0.22);
    --text: #b0d8e8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--cyan);
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.2);
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.05);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.8rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  .status-right {
    color: rgba(0,229,255,0.6);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--cyan);
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
  }

  .pos { color: var(--green); }
  .neg { color: var(--red); }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    background: rgba(0,229,255,0.08);
    color: rgba(0,229,255,0.7);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:last-child { border-bottom: none; }

  tbody tr:hover { background: rgba(0,229,255,0.04); }

  td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--cyan);
    display: block;
  }

  .stock-fullname {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.45);
    display: block;
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.05em;
    margin-left: 4px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: var(--green);
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,171,0,0.15);
    color: var(--amber);
    border: 1px solid rgba(255,171,0,0.3);
  }

  .bar-cell { width: 80px; }

  .bar-wrap {
    width: 70px;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  /* Total row */
  .total-row td {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid var(--border);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.68rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Clock */
  #clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: rgba(0,229,255,0.7);
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">
      Uppdaterad: <span id="clock">--:--:--</span>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="card-varde">—</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="card-pl">—</div>
      <div class="card-sub" id="card-plpct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="card-best" style="font-size:1rem">—</div>
      <div class="card-sub" id="card-worst">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
  const INVESTED_TOTAL = 699474.50;

  const stocks = [
    { ticker: 'NDA-SE', name: 'Nordea Bank',          zero: 175.25, qty: 570,  invested: 99892.50,  price: 180.15, dayPct: -0.96, live: true },
    { ticker: 'SHB-A',  name: 'Handelsbanken A',       zero: 135.15, qty: 740,  invested: 100011.00, price: 140.55, dayPct: -0.53, live: true },
    { ticker: 'SHB-B',  name: 'Handelsbanken B',       zero: 224.20, qty: 446,  invested: 99993.20,  price: 232.60, dayPct: -1.02, live: true },
    { ticker: 'SEB-A',  name: 'SEB A',                 zero: 184.00, qty: 543,  invested: 99912.00,  price: 191.85, dayPct: -0.57, live: true },
    { ticker: 'SEB-C',  name: 'SEB C',                 zero: 188.20, qty: 531,  invested: 99934.20,  price: 194.60, dayPct: -1.12, live: true },
    { ticker: 'SWED-A', name: 'Swedbank A',             zero: 336.10, qty: 297,  invested: 99821.70,  price: 355.00, dayPct: -0.42, live: true },
    { ticker: 'AZA',    name: 'Avanza Bank Holding',   zero: 358.10, qty: 279,  invested: 99909.90,  price: 379.30, dayPct: -1.30, live: true },
  ];

  // Compute derived values
  stocks.forEach(s => {
    s.varde    = s.price * s.qty;
    s.pl       = s.varde - s.invested;
    s.plPct    = (s.pl / s.invested) * 100;
    s.vsNollPct = ((s.price - s.zero) / s.zero) * 100;
  });

  const totalVarde = stocks.reduce((a,s) => a + s.varde, 0);
  const totalPl    = stocks.reduce((a,s) => a + s.pl, 0);
  const totalPlPct = (totalPl / INVESTED_TOTAL) * 100;
  const liveCount  = stocks.filter(s => s.live).length;

  // Max |plPct| for bar scaling
  const maxPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

  function fmt(n, decimals=0) {
    return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function sign(n) { return n >= 0 ? '+' : ''; }
  function color(n) { return n >= 0 ? 'var(--green)' : 'var(--red)'; }

  // Build table
  const tbody = document.getElementById('tbody');
  stocks.forEach(s => {
    const barWidth = maxPlPct > 0 ? Math.abs(s.plPct) / maxPlPct * 100 : 0;
    const barColor = s.pl >= 0 ? 'var(--green)' : 'var(--red)';
    const badge = s.live
      ? '<span class="badge badge-live">LIVE</span>'
      : '<span class="badge badge-fallback">FALLBACK</span>';

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <span class="ticker-name">${s.ticker}${badge}</span>
        <span class="stock-fullname">${s.name}</span>
      </td>
      <td>${fmt(s.zero, 2)}</td>
      <td>${fmt(s.price, 2)}</td>
      <td style="color:${color(s.dayPct)}">${sign(s.dayPct)}${fmt(s.dayPct, 2)}%</td>
      <td style="color:${color(s.vsNollPct)}">${sign(s.vsNollPct)}${fmt(s.vsNollPct, 2)}%</td>
      <td style="color:${color(s.pl)}">${sign(s.pl)}${fmt(s.pl)} kr</td>
      <td class="bar-cell">
        <div class="bar-wrap">
          <div class="bar-fill" style="width:${barWidth}%;background:${barColor}"></div>
        </div>
      </td>
    `;
    tbody.appendChild(row);
  });

  // Total row
  const totalRow = document.createElement('tr');
  totalRow.className = 'total-row';
  totalRow.innerHTML = `
    <td><span class="ticker-name">TOTALT</span></td>
    <td style="color:rgba(0,229,255,0.5)">${fmt(INVESTED_TOTAL)} kr</td>
    <td style="color:var(--cyan)">${fmt(totalVarde)} kr</td>
    <td>—</td>
    <td style="color:${color(totalPlPct)}">${sign(totalPlPct)}${fmt(totalPlPct, 2)}%</td>
    <td style="color:${color(totalPl)}">${sign(totalPl)}${fmt(totalPl)} kr</td>
    <td></td>
  `;
  tbody.appendChild(totalRow);

  // Cards
  document.getElementById('card-varde').textContent = fmt(totalVarde) + ' kr';
  document.getElementById('card-varde').style.color = 'var(--cyan)';

  const plEl = document.getElementById('card-pl');
  plEl.textContent = sign(totalPl) + fmt(totalPl) + ' kr';
  plEl.style.color = color(totalPl);

  const plPctEl = document.getElementById('card-plpct');
  plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct, 2) + '%';
  plPctEl.style.color = color(totalPlPct);

  // Best / worst by vsNollPct
  const sorted = [...stocks].sort((a,b) => b.vsNollPct - a.vsNollPct);
  const best = sorted[0], worst = sorted[sorted.length-1];
  const bestEl = document.getElementById('card-best');
  bestEl.innerHTML = `<span style="color:var(--green)">${best.ticker} ${sign(best.vsNollPct)}${fmt(best.vsNollPct,2)}%</span>`;
  const worstEl = document.getElementById('card-worst');
  worstEl.innerHTML = `<span style="color:var(--red)">${worst.ticker} ${sign(worst.vsNollPct)}${fmt(worst.vsNollPct,2)}%</span>`;

  // Status dot
  const dot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  if (liveCount === 7) {
    dot.style.background = 'var(--green)';
    dot.style.boxShadow = '0 0 6px var(--green)';
    statusText.textContent = '7/7 live · Stockholmsbörsen';
  } else if (liveCount === 0) {
    dot.style.background = 'var(--red)';
    dot.style.boxShadow = '0 0 6px var(--red)';
    statusText.textContent = `0/7 live · ${new Date().toLocaleDateString('sv-SE')}`;
  } else {
    dot.style.background = 'var(--amber)';
    dot.style.boxShadow = '0 0 6px var(--amber)';
    statusText.textContent = `${liveCount}/7 live · ${new Date().toLocaleDateString('sv-SE')}`;
  }

  // Clock
  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
