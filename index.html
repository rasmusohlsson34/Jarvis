<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. · Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #050c12; --cyan: #00e5ff; --green: #00ff88; --red: #ff1744; --amber: #ffab00; --surface: rgba(0,229,255,0.04); --border: rgba(0,229,255,0.15); --text: rgba(0,229,255,0.85); --dim: rgba(0,229,255,0.4); }
  body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; min-height: 100vh; padding: 0; overflow-x: hidden; position: relative; }
  body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px); pointer-events: none; z-index: 1000; }
  body::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%); pointer-events: none; z-index: 999; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }
  header { text-align: center; padding: 28px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .logo { font-family: 'Orbitron', monospace; font-size: 2.8rem; font-weight: 900; letter-spacing: 0.3em; color: var(--cyan); text-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.2); margin-bottom: 6px; }
  .subtitle { font-size: 0.8rem; letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 20px; }
  .status-left { display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .status-dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .status-right { color: var(--dim); font-size: 0.72rem; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; }
  .card-label { font-size: 0.68rem; letter-spacing: 0.15em; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  .card-value { font-family: 'Orbitron', monospace; font-size: 1.35rem; font-weight: 700; color: var(--cyan); }
  .card-sub { font-size: 0.75rem; color: var(--dim); margin-top: 4px; }
  .positive { color: var(--green); } .negative { color: var(--red); }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { background: rgba(0,229,255,0.07); color: var(--dim); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child { text-align: left; }
  td { padding: 12px 14px; text-align: right; border-bottom: 1px solid rgba(0,229,255,0.06); vertical-align: middle; }
  td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; } tr:hover td { background: rgba(0,229,255,0.03); }
  .totals-row td { background: rgba(0,229,255,0.07); border-top: 1px solid var(--border); font-family: 'Orbitron', monospace; font-size: 0.78rem; font-weight: 700; }
  .ticker-cell .ticker { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
  .badge { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; padding: 2px 5px; border-radius: 3px; letter-spacing: 0.05em; }
  .badge-live { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
  .badge-fallback { background: rgba(255,171,0,0.15); color: var(--amber); border: 1px solid rgba(255,171,0,0.3); }
  .ticker-name { font-size: 0.68rem; color: var(--dim); margin-top: 3px; letter-spacing: 0.05em; }
  .bar-cell { min-width: 90px; }
  .bar-track { width: 100%; height: 6px; background: rgba(0,229,255,0.08); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; width: 80px; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-fill.pos { background: var(--green); } .bar-fill.neg { background: var(--red); }
  footer { text-align: center; font-size: 0.65rem; color: var(--dim); letter-spacing: 0.15em; padding: 16px 0; border-top: 1px solid var(--border); }
  #clock { font-family: 'Orbitron', monospace; font-size: 0.78rem; color: var(--cyan); }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } .logo { font-size: 1.8rem; } }
</style>
</head>
<body>
<div class="container">
  <header><div class="logo">J.A.R.V.I.S.</div><div class="subtitle">Bankterminalen &middot; Live Portfoeljoeovervakning</div></header>
  <div class="statusbar"><div class="status-left"><div class="status-dot" id="status-dot"></div><span id="status-text"></span></div><div class="status-right">Uppdaterad: <span id="clock"></span></div></div>
  <div class="cards">
    <div class="card"><div class="card-label">Investerat</div><div class="card-value" style="font-size:1.1rem">699 475 kr</div><div class="card-sub">Nollpunkt: 9 jun 2026</div></div>
    <div class="card"><div class="card-label">Portfoeljvaerde</div><div class="card-value" id="total-value" style="font-size:1.1rem">-</div><div class="card-sub" id="total-value-sub"></div></div>
    <div class="card"><div class="card-label">Total P&amp;L</div><div class="card-value" id="total-pl" style="font-size:1.1rem">-</div><div class="card-sub" id="total-pl-pct"></div></div>
    <div class="card"><div class="card-label">Baest / Saemst</div><div class="card-value" id="best-worst" style="font-size:0.95rem; letter-spacing:0.05em">-</div><div class="card-sub">vs nollkurs</div></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Aktie</th><th>Nollkurs</th><th>Kurs</th><th>Dag%</th><th>Vs noll%</th><th>P&amp;L (SEK)</th><th class="bar-cell"></th></tr></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
  <footer>KAELLA: Avanza &nbsp;&middot;&nbsp; UPPDATERAS VAR 15 MIN MON-FRE 09:00-17:30</footer>
</div>
<script>
const STOCKS=[
  {ticker:'NDA-SE',name:'Nordea Bank',zero:175.25,shares:570,invested:99892.50,price:184.95,dayPct:2.38,status:'LIVE'},
  {ticker:'SHB-A',name:'Handelsbanken A',zero:135.15,shares:740,invested:100011.00,price:142.00,dayPct:0.67,status:'LIVE'},
  {ticker:'SHB-B',name:'Handelsbanken B',zero:224.20,shares:446,invested:99993.20,price:236.00,dayPct:1.29,status:'LIVE'},
  {ticker:'SEB-A',name:'SEB A',zero:184.00,shares:543,invested:99912.00,price:195.80,dayPct:0.64,status:'LIVE'},
  {ticker:'SEB-C',name:'SEB C',zero:188.20,shares:531,invested:99934.20,price:199.20,dayPct:1.74,status:'LIVE'},
  {ticker:'SWED-A',name:'Swedbank A',zero:336.10,shares:297,invested:99821.70,price:360.40,dayPct:1.35,status:'LIVE'},
  {ticker:'AZA',name:'Avanza Bank Holding',zero:358.10,shares:279,invested:99909.90,price:388.20,dayPct:2.18,status:'LIVE'}
];
const TOTAL_INVESTED=699474.50;
const SEK=n=>n.toLocaleString('sv-SE',{maximumFractionDigits:0});
const SEKD=n=>n.toLocaleString('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});
const sign=n=>n>=0?'+':'';
const cls=n=>n>=0?'positive':'negative';
let totalVarde=0,totalPl=0,maxAbsPlPct=0;
const rows=STOCKS.map(s=>{
  const varde=s.price*s.shares,pl=varde-s.invested,plPct=(pl/s.invested)*100,vsNollPct=((s.price-s.zero)/s.zero)*100;
  totalVarde+=varde;totalPl+=pl;
  if(Math.abs(plPct)>maxAbsPlPct)maxAbsPlPct=Math.abs(plPct);
  return{...s,varde,pl,plPct,vsNollPct};
});
const totalPlPct=(totalPl/TOTAL_INVESTED)*100;
const totalVsNollPct=((totalVarde-TOTAL_INVESTED)/TOTAL_INVESTED)*100;
const sorted=[...rows].sort((a,b)=>b.vsNollPct-a.vsNollPct);
const best=sorted[0],worst=sorted[sorted.length-1];
const liveCount=rows.filter(r=>r.status==='LIVE').length;
const dot=document.getElementById('status-dot'),statusText=document.getElementById('status-text');
if(liveCount===7){dot.className='status-dot';statusText.textContent='7/7 live - Stockholmsboersen';}
else if(liveCount===0){dot.className='status-dot red';statusText.textContent='0/7 live';}
else{dot.className='status-dot amber';statusText.textContent=liveCount+'/7 live';}
document.getElementById('total-value').textContent=SEK(totalVarde)+' kr';
document.getElementById('total-value-sub').textContent=liveCount+'/7 aktier live';
const plEl=document.getElementById('total-pl');
plEl.textContent=sign(totalPl)+SEK(totalPl)+' kr';plEl.className='card-value '+cls(totalPl);
const plPctEl=document.getElementById('total-pl-pct');
plPctEl.textContent=sign(totalPlPct)+totalPlPct.toFixed(2)+'% sedan nollpunkt';plPctEl.className='card-sub '+cls(totalPl);
document.getElementById('best-worst').innerHTML='<span class="positive">'+best.ticker+' '+sign(best.vsNollPct)+best.vsNollPct.toFixed(2)+'%</span><br><span class="negative">'+worst.ticker+' '+sign(worst.vsNollPct)+worst.vsNollPct.toFixed(2)+'%</span>';
const tbody=document.getElementById('tbody');
rows.forEach(r=>{
  const barWidth=Math.min(100,(Math.abs(r.plPct)/maxAbsPlPct)*100);
  const barClass=r.pl>=0?'pos':'neg';
  const badgeHtml=r.status==='LIVE'?'<span class="badge badge-live">LIVE</span>':'<span class="badge badge-fallback">FALLBACK</span>';
  const tr=document.createElement('tr');
  tr.innerHTML='<td class="ticker-cell"><div class="ticker">'+r.ticker+' '+badgeHtml+'</div><div class="ticker-name">'+r.name+'</div></td><td>'+SEKD(r.zero)+'</td><td><strong>'+SEKD(r.price)+'</strong></td><td class="'+cls(r.dayPct)+'">'+sign(r.dayPct)+r.dayPct.toFixed(2)+'%</td><td class="'+cls(r.vsNollPct)+'">'+sign(r.vsNollPct)+r.vsNollPct.toFixed(2)+'%</td><td class="'+cls(r.pl)+'">'+sign(r.pl)+SEK(Math.round(r.pl))+'</td><td class="bar-cell"><div class="bar-track"><div class="bar-fill '+barClass+'" style="width:'+barWidth+'%"></div></div></td>';
  tbody.appendChild(tr);
});
const tfoot=document.getElementById('tfoot'),trow=document.createElement('tr');
trow.className='totals-row';
trow.innerHTML='<td>TOTALT</td><td>'+SEK(TOTAL_INVESTED)+' kr</td><td>'+SEK(Math.round(totalVarde))+' kr</td><td>-</td><td class="'+cls(totalVsNollPct)+'">'+sign(totalVsNollPct)+totalVsNollPct.toFixed(2)+'%</td><td class="'+cls(totalPl)+'">'+sign(totalPl)+SEK(Math.round(totalPl))+' kr</td><td></td>';
tfoot.appendChild(trow);
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('sv-SE');}
updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
