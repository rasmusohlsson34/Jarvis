<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1001;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.2em;
    margin-top: 6px;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 10px 20px;
    margin-bottom: 24px;
    font-size: 0.8rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
  }

  .status-right {
    color: rgba(0,229,255,0.7);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.2);
    padding: 20px;
  }

  .card-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: rgba(0,229,255,0.5);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .card-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
    color: rgba(0,229,255,0.6);
  }

  .positive { color: #00ff88; }
  .negative { color: #ff1744; }

  /* Table */
  .table-wrapper {
    overflow-x: auto;
    background: rgba(0,229,255,0.02);
    border: 1px solid rgba(0,229,255,0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    background: rgba(0,229,255,0.08);
    color: rgba(0,229,255,0.7);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 12px 16px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:last-child {
    border-top: 2px solid rgba(0,229,255,0.3);
    background: rgba(0,229,255,0.05);
    font-weight: bold;
  }

  tbody td {
    padding: 14px 16px;
    text-align: right;
  }

  tbody td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .ticker-full {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.45);
    margin-top: 3px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 2px;
    letter-spacing: 0.1em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.4);
  }

  .badge-fallback {
    background: rgba(255,165,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,165,0,0.4);
  }

  /* Bar cell */
  .bar-cell {
    width: 100px;
    padding: 14px 12px;
  }

  .bar-track {
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.68rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <!-- Summary cards -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="totalVardeCard">—</div>
      <div class="card-sub" id="totalVardeSub">—</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPlCard">—</div>
      <div class="card-sub" id="totalPlSub">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="bestCard" style="font-size:1rem;">—</div>
      <div class="card-sub" id="worstCard">—</div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell">Bar</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer">KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>

</div>

<script>
const data = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  investerat: 99892.50,  price: 180.75, dagPct: -0.19, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       noll: 135.15, antal: 740,  investerat: 100011.00, price: 140.85, dagPct:  0.32, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       noll: 224.20, antal: 446,  investerat: 99993.20,  price: 234.40, dagPct:  0.77, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 noll: 184.00, antal: 543,  investerat: 99912.00,  price: 193.90, dagPct:  0.36, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 noll: 188.20, antal: 531,  investerat: 99934.20,  price: 199.20, dagPct:  0.30, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             noll: 336.10, antal: 297,  investerat: 99821.70,  price: 355.90, dagPct:  0.91, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  investerat: 99909.90,  price: 375.80, dagPct: -1.49, status: 'LIVE' },
];

const fmt = (n, decimals = 0) => n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
const sign = (n) => n >= 0 ? '+' : '';

// Compute per-stock P&L
const rows = data.map(d => {
  const varde = d.price * d.antal;
  const pl = varde - d.investerat;
  const plPct = (pl / d.investerat) * 100;
  const vsNollPct = (d.price - d.noll) / d.noll * 100;
  return { ...d, varde, pl, plPct, vsNollPct };
});

// Totals
const totalInvesterat = 699474.50;
const totalVarde = rows.reduce((s, r) => s + r.varde, 0);
const totalPl = totalVarde - totalInvesterat;
const totalPlPct = (totalPl / totalInvesterat) * 100;
const totalVsNollPct = (totalVarde - totalInvesterat) / totalInvesterat * 100;

// Best / worst by vsNollPct
const sorted = [...rows].sort((a, b) => b.vsNollPct - a.vsNollPct);
const best = sorted[0];
const worst = sorted[sorted.length - 1];

// Max |plPct| for bar scaling
const maxPlPct = Math.max(...rows.map(r => Math.abs(r.plPct)));

// Update status
const liveCount = rows.filter(r => r.status === 'LIVE').length;
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  dot.style.background = '#00ff88';
  dot.style.boxShadow = '0 0 8px #00ff88';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.style.background = '#ff1744';
  dot.style.boxShadow = '0 0 8px #ff1744';
  statusText.textContent = '0/7 live · FALLBACK DATA';
} else {
  dot.style.background = '#ffaa00';
  dot.style.boxShadow = '0 0 8px #ffaa00';
  statusText.textContent = liveCount + '/7 live · 2026-06-18';
}

// Update time
const now = new Date();
document.getElementById('updateTime').textContent = now.toLocaleTimeString('sv-SE');

// Live clock
setInterval(() => {
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('sv-SE');
}, 1000);

// Cards
const vardeEl = document.getElementById('totalVardeCard');
vardeEl.textContent = fmt(totalVarde) + ' kr';

document.getElementById('totalVardeSub').textContent = 'Vs investerat: ' + sign(totalPl) + fmt(totalPl) + ' kr';

const plCard = document.getElementById('totalPlCard');
plCard.textContent = sign(totalPl) + fmt(totalPl) + ' kr';
plCard.className = 'card-value ' + (totalPl >= 0 ? 'positive' : 'negative');

const plSub = document.getElementById('totalPlSub');
plSub.textContent = sign(totalPlPct) + fmt(totalPlPct, 2) + '% vs nollpunkt';
plSub.className = 'card-sub ' + (totalPlPct >= 0 ? 'positive' : 'negative');

document.getElementById('bestCard').innerHTML =
  '<span class="positive">' + best.ticker + ' ' + sign(best.vsNollPct) + fmt(best.vsNollPct, 2) + '%</span>';
document.getElementById('worstCard').innerHTML =
  'Sämst: <span class="' + (worst.vsNollPct >= 0 ? 'positive' : 'negative') + '">' + worst.ticker + ' ' + sign(worst.vsNollPct) + fmt(worst.vsNollPct, 2) + '%</span>';

// Table rows
const tbody = document.getElementById('tableBody');
rows.forEach(r => {
  const barWidth = Math.min(100, Math.abs(r.plPct) / maxPlPct * 100);
  const barColor = r.pl >= 0 ? '#00ff88' : '#ff1744';
  const dagClass = r.dagPct === null ? '' : (r.dagPct >= 0 ? 'positive' : 'negative');
  const dagText = r.dagPct === null ? '–' : sign(r.dagPct) + fmt(r.dagPct, 2) + '%';
  const vsClass = r.vsNollPct >= 0 ? 'positive' : 'negative';
  const plClass = r.pl >= 0 ? 'positive' : 'negative';
  const badge = r.status === 'LIVE'
    ? '<span class="badge badge-live">LIVE</span>'
    : '<span class="badge badge-fallback">2026-06-18</span>';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-name">${r.ticker}${badge}</div>
      <div class="ticker-full">${r.name}</div>
    </td>
    <td>${fmt(r.noll, 2)}</td>
    <td>${fmt(r.price, 2)}</td>
    <td class="${dagClass}">${dagText}</td>
    <td class="${vsClass}">${sign(r.vsNollPct)}${fmt(r.vsNollPct, 2)}%</td>
    <td class="${plClass}">${sign(r.pl)}${fmt(Math.round(r.pl))}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill" style="width:${barWidth}%;background:${barColor};"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
const totalVsClass = totalVsNollPct >= 0 ? 'positive' : 'negative';
const totalPlClass = totalPl >= 0 ? 'positive' : 'negative';
totalTr.innerHTML = `
  <td><div class="ticker-name" style="font-size:0.8rem;letter-spacing:0.2em;">TOTALT</div></td>
  <td>${fmt(totalInvesterat)}</td>
  <td>${fmt(totalVarde)}</td>
  <td>–</td>
  <td class="${totalVsClass}">${sign(totalVsNollPct)}${fmt(totalVsNollPct, 2)}%</td>
  <td class="${totalPlClass}">${sign(totalPl)}${fmt(Math.round(totalPl))}</td>
  <td class="bar-cell"></td>
`;
tbody.appendChild(totalTr);
</script>
</body>
</html>
