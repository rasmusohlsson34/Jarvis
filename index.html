<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. · Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #b0d4e0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px 40px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid rgba(0,229,255,0.15);
    margin-bottom: 24px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.25em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    line-height: 1;
  }

  .subtitle {
    font-size: 0.75rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 4px;
    margin-bottom: 24px;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(0,229,255,0.7);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    flex-shrink: 0;
  }

  .status-right {
    color: rgba(0,229,255,0.5);
    font-size: 0.68rem;
  }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.03);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 6px;
    padding: 16px 18px;
  }

  .card-label {
    font-size: 0.62rem;
    color: rgba(0,229,255,0.45);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Orbitron', monospace;
    font-size: 1.25rem;
    font-weight: 700;
    color: #00e5ff;
    line-height: 1.2;
  }

  .card-sub {
    font-size: 0.72rem;
    margin-top: 4px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: rgba(0,229,255,0.6); }

  /* TABLE */
  .table-wrap {
    border: 1px solid rgba(0,229,255,0.1);
    border-radius: 6px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }

  thead th {
    background: rgba(0,229,255,0.07);
    color: rgba(0,229,255,0.55);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.12);
    font-family: 'Share Tech Mono', monospace;
    font-weight: normal;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }

  tbody tr:last-child { border-bottom: none; }

  tbody tr:hover { background: rgba(0,229,255,0.03); }

  td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
  }

  td:first-child { text-align: left; }

  .ticker-cell { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    color: #00e5ff;
    letter-spacing: 0.05em;
  }

  .ticker-fullname {
    font-size: 0.62rem;
    color: rgba(0,229,255,0.4);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.1em;
    margin-left: 6px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.3);
  }

  /* BAR */
  .bar-cell { width: 80px; }

  .bar-track {
    background: rgba(0,229,255,0.06);
    border-radius: 2px;
    height: 6px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  /* TOTAL ROW */
  .total-row td {
    background: rgba(0,229,255,0.05);
    border-top: 1px solid rgba(0,229,255,0.2);
    font-weight: bold;
    color: #00e5ff;
  }

  .total-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: rgba(0,229,255,0.8);
    letter-spacing: 0.1em;
  }

  /* FOOTER */
  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.6rem;
    color: rgba(0,229,255,0.25);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot"></div>
      <span>7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock">--:--:--</span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value" style="font-size:1.05rem;">699 475 kr</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" style="font-size:1.05rem;" id="totalVarde">—</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPl" style="font-size:1.05rem;">—</div>
      <div class="card-sub" id="totalPlPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="bestWorst" style="font-size:0.9rem; line-height:1.5;">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer>KÄLLA: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30</footer>
</div>

<script>
const DATA = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',           nollkurs: 175.25, antal: 570,  investerat: 99892.50,  kurs: 179.35, dagPct: 0.00,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',        nollkurs: 135.15, antal: 740,  investerat: 100011.00, kurs: 140.9,  dagPct: -0.18, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',        nollkurs: 224.20, antal: 446,  investerat: 99993.20,  kurs: 233.2,  dagPct: -0.34, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                  nollkurs: 184.00, antal: 543,  investerat: 99912.00,  kurs: 189.3,  dagPct: -0.50, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                  nollkurs: 188.20, antal: 531,  investerat: 99934.20,  kurs: 191.8,  dagPct: -0.52, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',              nollkurs: 336.10, antal: 297,  investerat: 99821.70,  kurs: 356.9,  dagPct: 0.11,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',    nollkurs: 358.10, antal: 279,  investerat: 99909.90,  kurs: 384.6,  dagPct: 0.10,  status: 'LIVE' },
];

const INVESTERAT_TOTAL = 699474.50;
const TODAY = new Date().toLocaleDateString('sv-SE');

function fmt(n, decimals=0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function col(n) { return n >= 0 ? 'pos' : 'neg'; }

// Compute P&L for each stock
const rows = DATA.map(d => {
  const varde = d.kurs * d.antal;
  const pl = varde - d.investerat;
  const plPct = (pl / d.investerat) * 100;
  const vsNollPct = ((d.kurs - d.nollkurs) / d.nollkurs) * 100;
  return { ...d, varde, pl, plPct, vsNollPct };
});

// Totals
const totalVarde = rows.reduce((s, r) => s + r.varde, 0);
const totalPl = totalVarde - INVESTERAT_TOTAL;
const totalPlPct = (totalPl / INVESTERAT_TOTAL) * 100;
const totalVsNoll = ((totalVarde - INVESTERAT_TOTAL) / INVESTERAT_TOTAL) * 100;

// Best/worst by vsNollPct
const sorted = [...rows].sort((a, b) => b.vsNollPct - a.vsNollPct);
const best = sorted[0];
const worst = sorted[sorted.length - 1];

// Max |plPct| for bar scaling
const maxPlPct = Math.max(...rows.map(r => Math.abs(r.plPct)));

// Render summary cards
document.getElementById('totalVarde').textContent = fmt(totalVarde) + ' kr';
const plEl = document.getElementById('totalPl');
plEl.textContent = sign(totalPl) + fmt(totalPl) + ' kr';
plEl.className = 'card-value ' + col(totalPl);
plEl.style.fontSize = '1.05rem';
const plPctEl = document.getElementById('totalPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct, 2) + ' %';
plPctEl.className = 'card-sub ' + col(totalPlPct);

document.getElementById('bestWorst').innerHTML =
  `<span class="pos">${best.ticker} ${sign(best.vsNollPct)}${fmt(best.vsNollPct,2)}%</span><br>` +
  `<span class="neg">${worst.ticker} ${sign(worst.vsNollPct)}${fmt(worst.vsNollPct,2)}%</span>`;

// Render table rows
const tbody = document.getElementById('tbody');
rows.forEach(r => {
  const barWidth = maxPlPct > 0 ? Math.round((Math.abs(r.plPct) / maxPlPct) * 100) : 0;
  const barColor = r.pl >= 0 ? '#00ff88' : '#ff1744';
  const dagStr = r.dagPct === null ? '–' : sign(r.dagPct) + fmt(r.dagPct, 2) + '%';
  const badge = r.status === 'LIVE'
    ? `<span class="badge badge-live">LIVE</span>`
    : `<span class="badge badge-fallback">${TODAY}</span>`;

  tbody.innerHTML += `
    <tr>
      <td class="ticker-cell">
        <div class="ticker-name">${r.ticker}${badge}</div>
        <div class="ticker-fullname">${r.name}</div>
      </td>
      <td class="neu">${fmt(r.nollkurs, 2)}</td>
      <td style="color:#e0f4ff; font-weight:bold;">${fmt(r.kurs, 2)}</td>
      <td class="${col(r.dagPct)}">${dagStr}</td>
      <td class="${col(r.vsNollPct)}">${sign(r.vsNollPct)}${fmt(r.vsNollPct,2)}%</td>
      <td class="${col(r.pl)}">${sign(r.pl)}${fmt(r.pl)}</td>
      <td class="bar-cell">
        <div class="bar-track">
          <div class="bar-fill" style="width:${barWidth}%; background:${barColor};"></div>
        </div>
      </td>
    </tr>`;
});

// Total row
tbody.innerHTML += `
  <tr class="total-row">
    <td><span class="total-label">TOTALT</span></td>
    <td class="neu">${fmt(INVESTERAT_TOTAL)}</td>
    <td style="color:#e0f4ff; font-weight:bold;">${fmt(totalVarde)}</td>
    <td>–</td>
    <td class="${col(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll,2)}%</td>
    <td class="${col(totalPl)}">${sign(totalPl)}${fmt(totalPl)}</td>
    <td></td>
  </tr>`;

// Live clock
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('sv-SE');
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
