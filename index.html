<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.15em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    flex-shrink: 0;
  }

  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
  .status-dot.red   { background: #ff1744; box-shadow: 0 0 8px #ff1744; }

  .status-right { color: rgba(0,229,255,0.7); }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.2);
    padding: 16px 18px;
  }

  .card-label {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.5rem;
    font-weight: bold;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    margin-top: 4px;
  }

  .positive { color: #00ff88; }
  .negative { color: #ff1744; }

  /* Table */
  .table-wrapper {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.2);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  thead {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.3);
  }

  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(0,229,255,0.7);
    white-space: nowrap;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(0,229,255,0.07);
    vertical-align: middle;
    white-space: nowrap;
  }

  tr:last-child td { border-bottom: none; }

  tbody tr:hover { background: rgba(0,229,255,0.04); }

  .total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.25);
    font-weight: bold;
  }

  .total-row td { border-bottom: none; }

  /* Ticker cell */
  .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #00e5ff;
    display: block;
  }

  .stock-name {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.45);
    margin-top: 3px;
    display: block;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 2px;
    margin-top: 3px;
    letter-spacing: 0.08em;
    font-family: 'Share Tech Mono', monospace;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.3);
  }

  /* Bar */
  .bar-cell { width: 120px; }
  .bar-track {
    background: rgba(255,255,255,0.06);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    width: 100%;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }
  .bar-fill.pos { background: #00ff88; }
  .bar-fill.neg { background: #ff1744; }

  /* Footer */
  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-top: 16px;
    border-top: 1px solid rgba(0,229,255,0.08);
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <!-- Summary cards -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
      <div class="card-sub">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th>Bar</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer">Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30</div>

</div>

<script>
  const STOCKS = [
    { ticker: 'NDA-SE', name: 'Nordea Bank',           nollkurs: 175.25, antal: 570,  investerat: 99892.50,  kurs: 180.30, dagPct: 0.33,  status: 'LIVE' },
    { ticker: 'SHB-A',  name: 'Handelsbanken A',        nollkurs: 135.15, antal: 740,  investerat: 100011.00, kurs: 139.35, dagPct: 0.58,  status: 'LIVE' },
    { ticker: 'SHB-B',  name: 'Handelsbanken B',        nollkurs: 224.20, antal: 446,  investerat: 99993.20,  kurs: 231.80, dagPct: 0.17,  status: 'LIVE' },
    { ticker: 'SEB-A',  name: 'SEB A',                  nollkurs: 184.00, antal: 543,  investerat: 99912.00,  kurs: 193.20, dagPct: 0.23,  status: 'LIVE' },
    { ticker: 'SEB-C',  name: 'SEB C',                  nollkurs: 188.20, antal: 531,  investerat: 99934.20,  kurs: 199.00, dagPct: 0.51,  status: 'LIVE' },
    { ticker: 'SWED-A', name: 'Swedbank A',              nollkurs: 336.10, antal: 297,  investerat: 99821.70,  kurs: 347.40, dagPct: 0.46,  status: 'LIVE' },
    { ticker: 'AZA',    name: 'Avanza Bank Holding',    nollkurs: 358.10, antal: 279,  investerat: 99909.90,  kurs: 386.30, dagPct: 0.68,  status: 'LIVE' },
  ];

  const TOTAL_INVESTERAT = 699474.50;
  const UPDATE_TIME = '<!-- UPDATE_TIME -->'; // replaced dynamically

  function fmt(n, decimals = 2) {
    return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function fmtInt(n) {
    return n.toLocaleString('sv-SE', { maximumFractionDigits: 0 });
  }

  function sign(n) { return n >= 0 ? '+' : ''; }

  function colorClass(n) { return n >= 0 ? 'positive' : 'negative'; }

  // Compute per-stock P&L
  STOCKS.forEach(s => {
    s.varde    = s.kurs * s.antal;
    s.pl       = s.varde - s.investerat;
    s.plPct    = (s.pl / s.investerat) * 100;
    s.vsNollPct = (s.kurs - s.nollkurs) / s.nollkurs * 100;
  });

  const totalVarde = STOCKS.reduce((a, s) => a + s.varde, 0);
  const totalPl    = totalVarde - TOTAL_INVESTERAT;
  const totalPlPct = (totalPl / TOTAL_INVESTERAT) * 100;
  const totalVsNoll = (totalVarde - TOTAL_INVESTERAT) / TOTAL_INVESTERAT * 100;

  const liveCount = STOCKS.filter(s => s.status === 'LIVE').length;

  // Best / worst by vsNollPct
  const sorted = [...STOCKS].sort((a, b) => b.vsNollPct - a.vsNollPct);
  const best  = sorted[0];
  const worst = sorted[sorted.length - 1];

  const maxAbsPlPct = Math.max(...STOCKS.map(s => Math.abs(s.plPct)));

  // Status dot
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  if (liveCount === 7) {
    dot.className = 'status-dot';
    statusText.textContent = '7/7 live · Stockholmsbörsen';
  } else if (liveCount === 0) {
    dot.className = 'status-dot red';
    statusText.textContent = '0/7 live · Fallback-kurser';
  } else {
    dot.className = 'status-dot amber';
    statusText.textContent = liveCount + '/7 live · Stockholmsbörsen';
  }

  // Update time
  const now = new Date();
  const timeStr = now.toLocaleTimeString('sv-SE');
  document.getElementById('updateTime').textContent = timeStr;

  // Live clock
  function updateClock() {
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('sv-SE');
  }
  setInterval(updateClock, 1000);

  // Cards
  document.getElementById('cardVarde').textContent = fmtInt(totalVarde) + ' kr';
  document.getElementById('cardVarde').className = 'card-value';

  const cardPl = document.getElementById('cardPl');
  cardPl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
  cardPl.className = 'card-value ' + colorClass(totalPl);

  document.getElementById('cardPlPct').textContent = sign(totalPlPct) + fmt(totalPlPct) + ' % vs nollpunkt';
  document.getElementById('cardPlPct').className = 'card-sub ' + colorClass(totalPlPct);

  const cardBest = document.getElementById('cardBest');
  cardBest.textContent = best.ticker + ' ' + sign(best.vsNollPct) + fmt(best.vsNollPct) + '%';
  cardBest.className = 'card-value positive';

  const cardWorst = document.getElementById('cardWorst');
  cardWorst.textContent = worst.ticker + ' ' + sign(worst.vsNollPct) + fmt(worst.vsNollPct) + '%';
  cardWorst.className = 'card-sub ' + colorClass(worst.vsNollPct);

  // Table rows
  const tbody = document.getElementById('tableBody');

  STOCKS.forEach(s => {
    const tr = document.createElement('tr');

    const barWidth = Math.round((Math.abs(s.plPct) / maxAbsPlPct) * 100);
    const barClass = s.pl >= 0 ? 'pos' : 'neg';

    tr.innerHTML = `
      <td>
        <span class="ticker">${s.ticker}</span>
        <span class="badge ${s.status === 'LIVE' ? 'badge-live' : 'badge-fallback'}">${s.status}</span>
        <span class="stock-name">${s.name}</span>
      </td>
      <td>${fmt(s.nollkurs)} kr</td>
      <td>${fmt(s.kurs)} kr</td>
      <td class="${colorClass(s.dagPct)}">${sign(s.dagPct)}${fmt(s.dagPct)}%</td>
      <td class="${colorClass(s.vsNollPct)}">${sign(s.vsNollPct)}${fmt(s.vsNollPct)}%</td>
      <td class="${colorClass(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)} kr</td>
      <td class="bar-cell">
        <div class="bar-track">
          <div class="bar-fill ${barClass}" style="width:${barWidth}%"></div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // Total row
  const totalRow = document.createElement('tr');
  totalRow.className = 'total-row';
  totalRow.innerHTML = `
    <td><span class="ticker" style="font-size:0.75rem">TOTALT</span></td>
    <td>${fmtInt(TOTAL_INVESTERAT)} kr</td>
    <td>${fmtInt(totalVarde)} kr</td>
    <td>—</td>
    <td class="${colorClass(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)}%</td>
    <td class="${colorClass(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)} kr</td>
    <td></td>
  `;
  tbody.appendChild(totalRow);
</script>
</body>
</html>
