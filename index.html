<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.8rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.78rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    flex-shrink: 0;
  }

  .status-right {
    color: rgba(0,229,255,0.6);
  }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.2);
    padding: 16px;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, transparent);
    opacity: 0.4;
  }

  .card-label {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.4rem;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: #00e5ff; }

  /* TABLE */
  .table-wrapper {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    background: rgba(0,229,255,0.08);
    color: rgba(0,229,255,0.7);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
  }

  tbody td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    color: #00e5ff;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .stock-fullname {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.4);
    margin-top: 3px;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 2px 6px;
    border-radius: 2px;
    letter-spacing: 0.1em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,193,7,0.15);
    color: #ffc107;
    border: 1px solid rgba(255,193,7,0.3);
  }

  /* BAR */
  .bar-cell {
    width: 100px;
    padding-left: 10px;
  }

  .bar-bg {
    background: rgba(0,229,255,0.08);
    height: 6px;
    width: 80px;
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    position: absolute;
    left: 0;
    top: 0;
  }

  /* TOTAL ROW */
  .total-row {
    background: rgba(0,229,255,0.06) !important;
    border-top: 1px solid rgba(0,229,255,0.3) !important;
  }

  .total-row td {
    font-weight: bold;
    color: #00e5ff;
  }

  .total-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: rgba(0,229,255,0.8);
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-top: 1px solid rgba(0,229,255,0.1);
    padding-top: 16px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot"></div>
      <span id="live-status">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right" id="update-time"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neu">699 475 kr</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value neu" id="card-varde">—</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)" id="card-varde-sub"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="card-pl">—</div>
      <div class="card-sub" id="card-pl-pct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="card-best" style="font-size:1rem">—</div>
      <div class="card-sub" id="card-worst">—</div>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>

  <div class="footer">
    Källa: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30
  </div>
</div>

<script>
const DATA = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          nollkurs: 175.25, antal: 570,  investerat: 99892.50,  kurs: 183.65, dayPct: -0.60, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       nollkurs: 135.15, antal: 740,  investerat: 100011.00, kurs: 142.00, dayPct: -0.07, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       nollkurs: 224.20, antal: 446,  investerat: 99993.20,  kurs: 235.60, dayPct: -0.08, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 nollkurs: 184.00, antal: 543,  investerat: 99912.00,  kurs: 194.20, dayPct: -0.72, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 nollkurs: 188.20, antal: 531,  investerat: 99934.20,  kurs: 196.80, dayPct: -0.71, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             nollkurs: 336.10, antal: 297,  investerat: 99821.70,  kurs: 358.50, dayPct: -0.55, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   nollkurs: 358.10, antal: 279,  investerat: 99909.90,  kurs: 383.40, dayPct: -0.88, status: 'LIVE' },
];

const TOTAL_INVESTERAT = 699474.50;

// Compute P&L for each
DATA.forEach(d => {
  d.varde   = d.kurs * d.antal;
  d.pl      = d.varde - d.investerat;
  d.plPct   = (d.pl / d.investerat) * 100;
  d.vsNollPct = ((d.kurs - d.nollkurs) / d.nollkurs) * 100;
});

const totalVarde = DATA.reduce((s, d) => s + d.varde, 0);
const totalPl    = totalVarde - TOTAL_INVESTERAT;
const totalPlPct = (totalPl / TOTAL_INVESTERAT) * 100;
const totalVsNoll = (totalVarde / TOTAL_INVESTERAT - 1) * 100;

const liveCount = DATA.filter(d => d.status === 'LIVE').length;

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...DATA.map(d => Math.abs(d.plPct)));

function fmt(n, dec=2) {
  const sign = n >= 0 ? '+' : '';
  return sign + n.toFixed(dec);
}

function fmtSEK(n) {
  const abs = Math.abs(Math.round(n));
  const str = abs.toLocaleString('sv-SE');
  return (n >= 0 ? '+' : '−') + str + ' kr';
}

function fmtKr(n) {
  return Math.round(n).toLocaleString('sv-SE') + ' kr';
}

function colorClass(n) { return n >= 0 ? 'pos' : 'neg'; }

// Populate table
const tbody = document.getElementById('table-body');
DATA.forEach(d => {
  const barWidth = maxAbsPlPct > 0 ? Math.abs(d.plPct) / maxAbsPlPct * 80 : 0;
  const barColor = d.pl >= 0 ? '#00ff88' : '#ff1744';
  const badgeHtml = d.status === 'LIVE'
    ? '<span class="badge badge-live">LIVE</span>'
    : '<span class="badge badge-fallback">FALLBACK</span>';

  const row = document.createElement('tr');
  row.innerHTML = `
    <td>
      <div class="ticker-name">${d.ticker}${badgeHtml}</div>
      <div class="stock-fullname">${d.name}</div>
    </td>
    <td>${d.nollkurs.toFixed(2)}</td>
    <td>${d.kurs.toFixed(2)}</td>
    <td class="${colorClass(d.dayPct)}">${d.dayPct !== null ? fmt(d.dayPct) + ' %' : '–'}</td>
    <td class="${colorClass(d.vsNollPct)}">${fmt(d.vsNollPct)} %</td>
    <td class="${colorClass(d.pl)}">${Math.round(d.pl).toLocaleString('sv-SE', {signDisplay:'always'})} kr</td>
    <td class="bar-cell">
      <div class="bar-bg">
        <div class="bar-fill" style="width:${barWidth}px;background:${barColor}"></div>
      </div>
    </td>
  `;
  tbody.appendChild(row);
});

// Total row
const totalRow = document.createElement('tr');
totalRow.className = 'total-row';
totalRow.innerHTML = `
  <td><span class="total-label">TOTALT</span></td>
  <td style="color:rgba(0,229,255,0.5)">${TOTAL_INVESTERAT.toLocaleString('sv-SE')} kr</td>
  <td>${Math.round(totalVarde).toLocaleString('sv-SE')} kr</td>
  <td>–</td>
  <td class="${colorClass(totalVsNoll)}">${fmt(totalVsNoll)} %</td>
  <td class="${colorClass(totalPl)}">${Math.round(totalPl).toLocaleString('sv-SE', {signDisplay:'always'})} kr</td>
  <td></td>
`;
tbody.appendChild(totalRow);

// Cards
document.getElementById('card-varde').textContent = Math.round(totalVarde).toLocaleString('sv-SE') + ' kr';
document.getElementById('card-varde-sub').textContent = fmt(totalVsNoll) + ' % vs nollpunkt';
document.getElementById('card-varde-sub').className = 'card-sub ' + colorClass(totalVsNoll);

const plEl = document.getElementById('card-pl');
plEl.textContent = Math.round(totalPl).toLocaleString('sv-SE', {signDisplay:'always'}) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);

const plPctEl = document.getElementById('card-pl-pct');
plPctEl.textContent = fmt(totalPlPct) + ' % avkastning';
plPctEl.className = 'card-sub ' + colorClass(totalPl);

// Best / Worst by vsNollPct
const sorted = [...DATA].sort((a,b) => b.vsNollPct - a.vsNollPct);
const best = sorted[0];
const worst = sorted[sorted.length-1];

const bestEl = document.getElementById('card-best');
bestEl.innerHTML = `<span class="${colorClass(best.vsNollPct)}">${best.ticker} ${fmt(best.vsNollPct)} %</span>`;

const worstEl = document.getElementById('card-worst');
worstEl.innerHTML = `<span class="${colorClass(worst.vsNollPct)}" style="font-size:0.85rem">${worst.ticker} ${fmt(worst.vsNollPct)} %</span>`;

// Status bar
const dot = document.querySelector('.status-dot');
if (liveCount === 7) { dot.style.background = '#00ff88'; dot.style.boxShadow = '0 0 8px #00ff88'; }
else if (liveCount === 0) { dot.style.background = '#ff1744'; dot.style.boxShadow = '0 0 8px #ff1744'; }
else { dot.style.background = '#ffc107'; dot.style.boxShadow = '0 0 8px #ffc107'; }

const today = new Date().toLocaleDateString('sv-SE');
document.getElementById('live-status').textContent = liveCount === 7
  ? `7/7 live · Stockholmsbörsen`
  : `${liveCount}/7 live · ${today}`;

// Live clock
function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('sv-SE');
  const dateStr = now.toLocaleDateString('sv-SE');
  document.getElementById('update-time').textContent = `Uppdaterad: ${dateStr} ${timeStr}`;
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
