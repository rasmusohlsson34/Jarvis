<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050c12;
    --accent: #00e5ff;
    --pos: #00ff88;
    --neg: #ff1744;
    --dim: rgba(0,229,255,0.3);
    --card-bg: rgba(0,229,255,0.04);
    --border: rgba(0,229,255,0.15);
  }

  body {
    background: var(--bg);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 999;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 998;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--dim);
    letter-spacing: 0.15em;
    margin-top: 6px;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.75rem;
    margin-bottom: 20px;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pos);
    box-shadow: 0 0 8px var(--pos);
    flex-shrink: 0;
  }

  .status-dot.amber { background: #ffab00; box-shadow: 0 0 8px #ffab00; }
  .status-dot.red { background: var(--neg); box-shadow: 0 0 8px var(--neg); }

  .status-right { color: var(--dim); }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: var(--dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.35rem;
    font-weight: bold;
    color: var(--accent);
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
  }

  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .neutral { color: var(--accent); }

  /* Table */
  .table-wrap {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-x: auto;
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 10px 12px;
    text-align: right;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--dim);
    text-transform: uppercase;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  td {
    padding: 11px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.06);
    white-space: nowrap;
    vertical-align: middle;
  }

  td:first-child { text-align: left; }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr:hover { background: rgba(0,229,255,0.04); }

  .ticker-cell .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .ticker-cell .ticker-full {
    font-size: 0.68rem;
    color: var(--dim);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: var(--pos);
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,171,0,0.12);
    color: #ffab00;
    border: 1px solid rgba(255,171,0,0.3);
  }

  /* Bar cell */
  .bar-cell { width: 100px; }

  .bar-wrap {
    width: 100%;
    height: 8px;
    background: rgba(0,229,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
  }

  /* Total row */
  .total-row td {
    border-top: 1px solid var(--border);
    border-bottom: none;
    font-weight: bold;
    color: var(--accent);
    background: rgba(0,229,255,0.03);
    padding-top: 12px;
    padding-bottom: 12px;
  }

  /* Footer */
  footer {
    text-align: center;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.25);
    letter-spacing: 0.1em;
    padding: 12px 0 20px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &nbsp;·&nbsp; Live Portföljövervakning</div>
  </header>

  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right" id="statusRight"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neutral">699&nbsp;475&nbsp;kr</div>
      <div class="card-sub neutral">Nollpunkt 2026-06-09</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value neutral" id="cardVarde">—</div>
      <div class="card-sub neutral">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl">—</div>
      <div class="card-sub" id="cardPlPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value pos" id="cardBest">—</div>
      <div class="card-sub neg" id="cardWorst">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>KÄLLA: Avanza &nbsp;·&nbsp; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>
</div>

<script>
const NOLLPUNKT_DATE = '2026-06-09';
const INVESTERAT = 699474.50;

const stocks = [
  { ticker:'NDA-SE', name:'Nordea Bank',           nollkurs:175.25, antal:570,  investerat:99892.50,  price:182.4,  dagPct:0.72,  status:'LIVE' },
  { ticker:'SHB-A',  name:'Handelsbanken A',        nollkurs:135.15, antal:740,  investerat:100011.00, price:141.3,  dagPct:0.64,  status:'LIVE' },
  { ticker:'SHB-B',  name:'Handelsbanken B',        nollkurs:224.20, antal:446,  investerat:99993.20,  price:234.8,  dagPct:0.95,  status:'LIVE' },
  { ticker:'SEB-A',  name:'SEB A',                  nollkurs:184.00, antal:543,  investerat:99912.00,  price:194.3,  dagPct:0.57,  status:'LIVE' },
  { ticker:'SEB-C',  name:'SEB C',                  nollkurs:188.20, antal:531,  investerat:99934.20,  price:200.0,  dagPct:0.70,  status:'LIVE' },
  { ticker:'SWED-A', name:'Swedbank A',             nollkurs:336.10, antal:297,  investerat:99821.70,  price:357.5,  dagPct:1.36,  status:'LIVE' },
  { ticker:'AZA',    name:'Avanza Bank Holding',    nollkurs:358.10, antal:279,  investerat:99909.90,  price:379.9,  dagPct:-0.42, status:'LIVE' },
];

function fmt(n, decimals=2) {
  if (n === null || n === undefined) return '–';
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtInt(n) {
  if (n === null || n === undefined) return '–';
  return n.toLocaleString('sv-SE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  let totalVarde = 0;
  let totalPl = 0;
  const plPcts = [];

  stocks.forEach(s => {
    const varde = s.price * s.antal;
    const pl = varde - s.investerat;
    const plPct = (pl / s.investerat) * 100;
    const vsNoll = ((s.price - s.nollkurs) / s.nollkurs) * 100;
    totalVarde += varde;
    totalPl += pl;
    plPcts.push({ ticker: s.ticker, plPct });

    const tr = document.createElement('tr');
    const badgeHtml = s.status === 'LIVE'
      ? `<span class="badge badge-live">LIVE</span>`
      : `<span class="badge badge-fallback">${NOLLPUNKT_DATE}</span>`;

    tr.innerHTML = `
      <td class="ticker-cell">
        <div class="ticker-name">${s.ticker} ${badgeHtml}</div>
        <div class="ticker-full">${s.name}</div>
      </td>
      <td>${fmt(s.nollkurs)}</td>
      <td>${fmt(s.price)}</td>
      <td class="${s.dagPct >= 0 ? 'pos' : 'neg'}">${sign(s.dagPct)}${fmt(s.dagPct)}%</td>
      <td class="${vsNoll >= 0 ? 'pos' : 'neg'}">${sign(vsNoll)}${fmt(vsNoll)}%</td>
      <td class="${pl >= 0 ? 'pos' : 'neg'}">${sign(pl)}${fmtInt(pl)}</td>
      <td class="bar-cell"><div class="bar-wrap"><div class="bar-fill" style="width:0%;background:${pl>=0?'var(--pos)':'var(--neg)'}" data-pct="${plPct}"></div></div></td>
    `;
    tbody.appendChild(tr);
  });

  // Set bar widths proportionally
  const maxAbsPct = Math.max(...plPcts.map(p => Math.abs(p.plPct)));
  tbody.querySelectorAll('.bar-fill').forEach((el, i) => {
    const pct = parseFloat(el.dataset.pct);
    el.style.width = (maxAbsPct > 0 ? (Math.abs(pct) / maxAbsPct) * 100 : 0) + '%';
  });

  const totalPlPct = (totalPl / INVESTERAT) * 100;

  // Total row
  const totalVsNoll = (totalPlPct); // same since pl/investerat
  const tr = document.createElement('tr');
  tr.className = 'total-row';
  tr.innerHTML = `
    <td><span style="font-family:'Orbitron',sans-serif;font-size:0.75rem;letter-spacing:0.06em;">TOTALT</span></td>
    <td>${fmtInt(INVESTERAT)}</td>
    <td>${fmtInt(totalVarde)}</td>
    <td>–</td>
    <td class="${totalVsNoll >= 0 ? 'pos' : 'neg'}">${sign(totalVsNoll)}${fmt(totalVsNoll)}%</td>
    <td class="${totalPl >= 0 ? 'pos' : 'neg'}">${sign(totalPl)}${fmtInt(totalPl)}</td>
    <td></td>
  `;
  tbody.appendChild(tr);

  // Summary cards
  document.getElementById('cardVarde').textContent = fmtInt(totalVarde) + ' kr';

  const plEl = document.getElementById('cardPl');
  plEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
  plEl.className = 'card-value ' + (totalPl >= 0 ? 'pos' : 'neg');

  const plPctEl = document.getElementById('cardPlPct');
  plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + '%';
  plPctEl.className = 'card-sub ' + (totalPlPct >= 0 ? 'pos' : 'neg');

  // Best/worst
  const sortedByVsNoll = stocks.map(s => ({
    ticker: s.ticker,
    vsNoll: ((s.price - s.nollkurs) / s.nollkurs) * 100
  })).sort((a, b) => b.vsNoll - a.vsNoll);
  const best = sortedByVsNoll[0];
  const worst = sortedByVsNoll[sortedByVsNoll.length - 1];
  document.getElementById('cardBest').textContent = `${best.ticker} ${sign(best.vsNoll)}${fmt(best.vsNoll)}%`;
  document.getElementById('cardWorst').textContent = `${worst.ticker} ${sign(worst.vsNoll)}${fmt(worst.vsNoll)}%`;

  // Status
  const liveCount = stocks.filter(s => s.status === 'LIVE').length;
  const total = stocks.length;
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');

  if (liveCount === total) {
    dot.className = 'status-dot';
    txt.textContent = `${liveCount}/${total} live · Stockholmsbörsen`;
  } else if (liveCount === 0) {
    dot.className = 'status-dot red';
    txt.textContent = `0/${total} live · ${new Date().toLocaleDateString('sv-SE')}`;
  } else {
    dot.className = 'status-dot amber';
    txt.textContent = `${liveCount}/${total} live · ${new Date().toLocaleDateString('sv-SE')}`;
  }
}

function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('sv-SE');
  document.getElementById('statusRight').textContent = 'Uppdaterad: ' + timeStr;
}

renderTable();
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
