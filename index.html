<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050c12;
    --accent:#00e5ff;
    --pos:#00ff88;
    --neg:#ff1744;
    --amber:#ffb300;
    --panel:#0a1620;
    --panel-border:rgba(0,229,255,0.18);
    --text-dim:#5c8a9c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:#d6f3fa;
    font-family:'Share Tech Mono', monospace;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events:none;
    z-index:2;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events:none;
    z-index:3;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:32px 24px 60px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  .logo{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:42px;
    letter-spacing:6px;
    color:var(--accent);
    text-shadow:0 0 20px rgba(0,229,255,0.5);
  }
  .subtitle{
    margin-top:8px;
    color:var(--text-dim);
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .clock{
    margin-top:10px;
    font-size:15px;
    color:var(--accent);
    letter-spacing:2px;
  }
  .statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:6px;
    padding:10px 18px;
    margin-bottom:24px;
    font-size:13px;
    letter-spacing:1px;
  }
  .statusbar .left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
    box-shadow:0 0 8px currentColor;
  }
  .dot.green{background:var(--pos);color:var(--pos);}
  .dot.amber{background:var(--amber);color:var(--amber);}
  .dot.red{background:var(--neg);color:var(--neg);}
  .statusbar .right{
    color:var(--text-dim);
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
    margin-bottom:28px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:16px 18px;
  }
  .card .label{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .card .value{
    font-size:22px;
    font-weight:bold;
    color:#e8fbff;
  }
  .card .sub{
    margin-top:4px;
    font-size:13px;
    color:var(--text-dim);
  }
  .pos{color:var(--pos)!important;}
  .neg{color:var(--neg)!important;}
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:8px;
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    padding:12px 14px;
    border-bottom:1px solid var(--panel-border);
  }
  tbody td{
    padding:14px;
    border-bottom:1px solid rgba(0,229,255,0.08);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tr.total td{
    font-weight:bold;
    background:rgba(0,229,255,0.05);
    border-top:1px solid var(--panel-border);
  }
  .ticker{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:15px;
    color:#e8fbff;
  }
  .badge{
    display:inline-block;
    font-size:9px;
    letter-spacing:1px;
    padding:2px 6px;
    border-radius:3px;
    margin-left:8px;
    vertical-align:middle;
  }
  .badge.live{background:rgba(0,255,136,0.15);color:var(--pos);border:1px solid rgba(0,255,136,0.4);}
  .badge.fallback{background:rgba(255,179,0,0.15);color:var(--amber);border:1px solid rgba(255,179,0,0.4);}
  .namn{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin-top:3px;
  }
  .barcell{width:140px;}
  .bartrack{
    width:100%;
    height:8px;
    background:rgba(255,255,255,0.06);
    border-radius:4px;
    overflow:hidden;
  }
  .barfill{
    height:100%;
    border-radius:4px;
  }
  .barfill.pos{background:var(--pos);}
  .barfill.neg{background:var(--neg);}
  footer{
    text-align:center;
    margin-top:28px;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  @media (max-width:800px){
    .cards{grid-template-columns:repeat(2, 1fr);}
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tbody tr{margin-bottom:12px;border-bottom:1px solid var(--panel-border);}
    .barcell{width:100%;margin-top:8px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portf&ouml;lj&ouml;vervakning</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="statusbar">
    <div class="left">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">—</span>
    </div>
    <div class="right" id="updatedText">Uppdaterad: --:--:--</div>
  </div>

  <div class="cards" id="cards"></div>

  <table>
    <thead>
      <tr>
        <th>Aktie</th>
        <th>Nollkurs</th>
        <th>Kurs</th>
        <th>Dag%</th>
        <th>Vs noll%</th>
        <th>P&amp;L (SEK)</th>
        <th>Trend</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>K&Auml;LLA: Avanza &middot; UPPDATERAS VAR 15 MIN M&Aring;N&ndash;FRE 09:00&ndash;17:30</footer>
</div>

<script>
const stocks = [
  {ticker:"NDA-SE", namn:"Nordea Bank",          noll:175.25, antal:570, investerat:99892.50,  kurs:185.55, dag:1.64,  status:"LIVE"},
  {ticker:"SHB-A",  namn:"Handelsbanken A",       noll:135.15, antal:740, investerat:100011.00, kurs:143.15, dag:1.06,  status:"LIVE"},
  {ticker:"SHB-B",  namn:"Handelsbanken B",       noll:224.20, antal:446, investerat:99993.20,  kurs:236.60, dag:0.85,  status:"LIVE"},
  {ticker:"SEB-A",  namn:"SEB A",                 noll:184.00, antal:543, investerat:99912.00,  kurs:195.80, dag:1.74,  status:"LIVE"},
  {ticker:"SEB-C",  namn:"SEB C",                 noll:188.20, antal:531, investerat:99934.20,  kurs:197.60, dag:1.13,  status:"LIVE"},
  {ticker:"SWED-A", namn:"Swedbank A",             noll:336.10, antal:297, investerat:99821.70,  kurs:363.00, dag:1.42,  status:"LIVE"},
  {ticker:"AZA",    namn:"Avanza Bank Holding",    noll:358.10, antal:279, investerat:99909.90,  kurs:393.50, dag:0.90,  status:"LIVE"},
];
const TOTAL_INVESTERAT = 699474.50;
const DATUM_FALLBACK = "2026-07-02";

function fmtSEK(n){ return Math.round(n).toLocaleString('sv-SE'); }
function fmtSEK2(n){ return n.toLocaleString('sv-SE', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtPct(n){
  if(n === null || n === undefined) return "–";
  const s = n.toLocaleString('sv-SE', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (n > 0 ? "+" : "") + s + "%";
}
function signClass(n){ return n > 0 ? "pos" : (n < 0 ? "neg" : ""); }

stocks.forEach(s => {
  s.varde = s.kurs * s.antal;
  s.pl = s.varde - s.investerat;
  s.plPct = (s.pl / s.investerat) * 100; // = vs noll%
});

const totalVarde = stocks.reduce((a,s)=>a+s.varde,0);
const totalPl = totalVarde - TOTAL_INVESTERAT;
const totalPlPct = (totalPl / TOTAL_INVESTERAT) * 100;
const liveCount = stocks.filter(s=>s.status==="LIVE").length;

let best = stocks[0], worst = stocks[0];
stocks.forEach(s=>{
  if(s.plPct > best.plPct) best = s;
  if(s.plPct < worst.plPct) worst = s;
});

// Status bar
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if(liveCount === 7){
  statusDot.className = 'dot green';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if(liveCount === 0){
  statusDot.className = 'dot red';
  statusText.textContent = '0/7 live · ' + DATUM_FALLBACK;
} else {
  statusDot.className = 'dot amber';
  statusText.textContent = liveCount + '/7 live · ' + DATUM_FALLBACK;
}

// Cards
const maxAbs = Math.max(...stocks.map(s=>Math.abs(s.plPct)));
const cardsEl = document.getElementById('cards');
cardsEl.innerHTML = `
  <div class="card">
    <div class="label">Investerat</div>
    <div class="value">${fmtSEK(TOTAL_INVESTERAT)} kr</div>
  </div>
  <div class="card">
    <div class="label">Portföljvärde</div>
    <div class="value">${fmtSEK(totalVarde)} kr</div>
  </div>
  <div class="card">
    <div class="label">Total P&amp;L</div>
    <div class="value ${signClass(totalPl)}">${totalPl>0?'+':''}${fmtSEK(totalPl)} kr</div>
    <div class="sub ${signClass(totalPlPct)}">${fmtPct(totalPlPct)}</div>
  </div>
  <div class="card">
    <div class="label">Bäst / Sämst</div>
    <div class="value" style="font-size:16px;">
      <span class="pos">${best.ticker} ${fmtPct(best.plPct)}</span>
    </div>
    <div class="sub neg">${worst.ticker} ${fmtPct(worst.plPct)}</div>
  </div>
`;

// Table
const tbody = document.getElementById('tbody');
let rows = '';
stocks.forEach(s=>{
  const badge = s.status === 'LIVE'
    ? `<span class="badge live">LIVE</span>`
    : `<span class="badge fallback">${DATUM_FALLBACK}</span>`;
  const barPct = maxAbs > 0 ? (Math.abs(s.plPct)/maxAbs*100) : 0;
  const barClass = s.plPct >= 0 ? 'pos' : 'neg';
  rows += `
    <tr>
      <td><span class="ticker">${s.ticker}</span>${badge}<span class="namn">${s.namn}</span></td>
      <td>${fmtSEK2(s.noll)}</td>
      <td>${fmtSEK2(s.kurs)}</td>
      <td class="${signClass(s.dag)}">${s.dag===null?'–':fmtPct(s.dag)}</td>
      <td class="${signClass(s.plPct)}">${fmtPct(s.plPct)}</td>
      <td class="${signClass(s.pl)}">${s.pl>0?'+':''}${fmtSEK(s.pl)}</td>
      <td class="barcell"><div class="bartrack"><div class="barfill ${barClass}" style="width:${barPct}%"></div></div></td>
    </tr>
  `;
});
rows += `
  <tr class="total">
    <td>TOTALT</td>
    <td>${fmtSEK2(TOTAL_INVESTERAT)}</td>
    <td>${fmtSEK(totalVarde)}</td>
    <td>–</td>
    <td class="${signClass(totalPlPct)}">${fmtPct(totalPlPct)}</td>
    <td class="${signClass(totalPl)}">${totalPl>0?'+':''}${fmtSEK(totalPl)}</td>
    <td></td>
  </tr>
`;
tbody.innerHTML = rows;

// Clock
function updateClock(){
  const now = new Date();
  const t = now.toLocaleTimeString('sv-SE');
  document.getElementById('clock').textContent = t;
  document.getElementById('updatedText').textContent = 'Uppdaterad: ' + t;
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
