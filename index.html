<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 999;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 998;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.15em;
    margin-top: 6px;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    margin-bottom: 20px;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px rgba(0,255,136,0.8);
  }

  .status-right {
    color: rgba(0,229,255,0.7);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 6px;
    padding: 16px;
    text-align: center;
  }

  .card-label {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.35rem;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.78rem;
    margin-top: 4px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neutral { color: #00e5ff; }

  /* Table */
  .table-wrapper {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.25);
  }

  th {
    padding: 12px 14px;
    text-align: right;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: rgba(0,229,255,0.6);
    text-transform: uppercase;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr.total-row {
    border-top: 1px solid rgba(0,229,255,0.25);
    background: rgba(0,229,255,0.06);
    font-weight: bold;
  }

  td {
    padding: 12px 14px;
    text-align: right;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker-cell .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #00e5ff;
    display: block;
  }

  .ticker-cell .company-name {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.45);
    display: block;
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.05em;
    margin-left: 5px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.4);
  }

  .badge-fallback {
    background: rgba(255,193,7,0.15);
    color: #ffc107;
    border: 1px solid rgba(255,193,7,0.4);
  }

  /* Bar column */
  .bar-cell {
    width: 100px;
    padding-right: 14px;
  }

  .bar-outer {
    background: rgba(0,229,255,0.08);
    border-radius: 2px;
    height: 8px;
    width: 80px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-inner {
    height: 100%;
    border-radius: 2px;
  }

  /* Footer */
  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.1em;
    padding-top: 16px;
    border-top: 1px solid rgba(0,229,255,0.1);
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock">--:--:--</span></div>
  </div>

  <!-- Summary cards -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neutral">699&nbsp;475 kr</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde">–</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl">–</div>
      <div class="card-sub" id="cardPlPct">–</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest" style="font-size:1rem;">–</div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer">KÄLLA: Avanza &nbsp;&middot;&nbsp; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>

</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  kurs: 182.00, dag: 0.75,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      noll: 135.15, antal: 740,  inv: 100011.00, kurs: 141.15, dag: 0.07,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      noll: 224.20, antal: 446,  inv: 99993.20,  kurs: 234.20, dag: 0.52,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                noll: 184.00, antal: 543,  inv: 99912.00,  kurs: 193.65, dag: -0.46, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                noll: 188.20, antal: 531,  inv: 99934.20,  kurs: 197.40, dag: 0.82,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',           noll: 336.10, antal: 297,  inv: 99821.70,  kurs: 356.40, dag: 0.22,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  noll: 358.10, antal: 279,  inv: 99909.90,  kurs: 386.30, dag: 1.68,  status: 'LIVE' }
];

const TOTAL_INV = 699474.50;

function fmt(n, decimals=2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtInt(n) {
  return Math.round(n).toLocaleString('sv-SE');
}
function sign(n) { return n >= 0 ? '+' : ''; }
function colorClass(n) { return n >= 0 ? 'pos' : 'neg'; }

// Compute per-stock values
STOCKS.forEach(s => {
  s.varde    = s.kurs * s.antal;
  s.pl       = s.varde - s.inv;
  s.plPct    = (s.pl / s.inv) * 100;
  s.vsNoll   = ((s.kurs - s.noll) / s.noll) * 100;
});

const totalVarde  = STOCKS.reduce((a, s) => a + s.varde, 0);
const totalPl     = totalVarde - TOTAL_INV;
const totalPlPct  = (totalPl / TOTAL_INV) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INV) / TOTAL_INV) * 100;

const maxAbsPlPct = Math.max(...STOCKS.map(s => Math.abs(s.plPct)));

// Fill summary cards
document.getElementById('cardVarde').textContent = fmtInt(totalVarde) + ' kr';
document.getElementById('cardVarde').className = 'card-value ' + colorClass(totalPl);

const plEl = document.getElementById('cardPl');
plEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);

const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + ' %';
plPctEl.className = 'card-sub ' + colorClass(totalPlPct);

const sorted = [...STOCKS].sort((a,b) => b.vsNoll - a.vsNoll);
const best  = sorted[0];
const worst = sorted[sorted.length - 1];
document.getElementById('cardBest').innerHTML =
  `<span class="pos">${best.ticker} ${sign(best.vsNoll)}${fmt(best.vsNoll)}%</span><br>` +
  `<span class="neg" style="font-size:0.85rem;">${worst.ticker} ${sign(worst.vsNoll)}${fmt(worst.vsNoll)}%</span>`;

// Build table rows
const tbody = document.getElementById('tableBody');

STOCKS.forEach(s => {
  const barWidth = Math.round((Math.abs(s.plPct) / maxAbsPlPct) * 80);
  const barColor = s.pl >= 0 ? '#00ff88' : '#ff1744';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="ticker-cell">
      <span class="ticker-name">${s.ticker}<span class="badge ${s.status === 'LIVE' ? 'badge-live' : 'badge-fallback'}">${s.status}</span></span>
      <span class="company-name">${s.name}</span>
    </td>
    <td>${fmt(s.noll)}</td>
    <td>${fmt(s.kurs)}</td>
    <td class="${colorClass(s.dag)}">${sign(s.dag)}${fmt(s.dag)}%</td>
    <td class="${colorClass(s.vsNoll)}">${sign(s.vsNoll)}${fmt(s.vsNoll)}%</td>
    <td class="${colorClass(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-outer"><div class="bar-inner" style="width:${barWidth}px;background:${barColor};"></div></div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td class="ticker-cell"><span class="ticker-name" style="color:#00e5ff;">TOTALT</span></td>
  <td>${fmtInt(TOTAL_INV)}</td>
  <td>${fmtInt(totalVarde)}</td>
  <td>–</td>
  <td class="${colorClass(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)}%</td>
  <td class="${colorClass(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)}</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Status dot
const liveCount = STOCKS.filter(s => s.status === 'LIVE').length;
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  dot.style.background = '#00ff88';
  dot.style.boxShadow = '0 0 6px rgba(0,255,136,0.8)';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.style.background = '#ff1744';
  dot.style.boxShadow = '0 0 6px rgba(255,23,68,0.8)';
  statusText.textContent = '0/7 live · Stockholmsbörsen';
} else {
  dot.style.background = '#ffc107';
  dot.style.boxShadow = '0 0 6px rgba(255,193,7,0.8)';
  statusText.textContent = `${liveCount}/7 live · Stockholmsbörsen`;
}

// Live clock
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
