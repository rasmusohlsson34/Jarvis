<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #b0c8d4;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1001;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 16px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.2);
  }

  .subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.2em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px rgba(0,255,136,0.8);
    flex-shrink: 0;
  }

  .status-dot.amber { background: #ffab00; box-shadow: 0 0 8px rgba(255,171,0,0.8); }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 8px rgba(255,23,68,0.8); }

  .status-right {
    color: rgba(0,229,255,0.7);
  }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: rgba(0,229,255,0.03);
    border: 1px solid rgba(0,229,255,0.18);
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.35rem;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 3px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: #00e5ff; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    background: rgba(0,229,255,0.06);
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  th {
    padding: 10px 14px;
    text-align: right;
    color: rgba(0,229,255,0.6);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: normal;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr.total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.25);
    border-bottom: none;
    font-weight: bold;
  }

  td {
    padding: 10px 14px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker-cell { }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: #00e5ff;
    letter-spacing: 0.08em;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: bold;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.4);
  }

  .badge-fallback {
    background: rgba(255,171,0,0.15);
    color: #ffab00;
    border: 1px solid rgba(255,171,0,0.4);
  }

  .company-name {
    font-size: 0.65rem;
    color: rgba(176,200,212,0.5);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .bar-cell { width: 100px; }

  .bar-bg {
    background: rgba(255,255,255,0.05);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    width: 80px;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  /* FOOTER */
  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-top: 1px solid rgba(0,229,255,0.1);
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neu">699 475 kr</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value neu" id="cardValue"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest" style="font-size:1rem"></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer">KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>

</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',           noll: 175.25, antal: 570,  invested: 99892.50,  price: 180.6,  dayPct: 0.50,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       noll: 135.15, antal: 740,  invested: 100011.00, price: 139.75, dayPct: 0.87,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       noll: 224.20, antal: 446,  invested: 99993.20,  price: 232.6,  dayPct: 0.52,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 noll: 184.00, antal: 543,  invested: 99912.00,  price: 194.05, dayPct: 0.67,  status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 noll: 188.20, antal: 531,  invested: 99934.20,  price: 199.8,  dayPct: 0.91,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',            noll: 336.10, antal: 297,  invested: 99821.70,  price: 349.0,  dayPct: 0.93,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  invested: 99909.90,  price: 389.0,  dayPct: 1.38,  status: 'LIVE' },
];

const TOTAL_INVESTED = 699474.50;

function fmt(n, decimals = 0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function colorClass(n) { return n >= 0 ? 'pos' : 'neg'; }

// Compute per-stock P&L
const computed = STOCKS.map(s => {
  const varde  = s.price * s.antal;
  const pl     = varde - s.invested;
  const plPct  = (pl / s.invested) * 100;
  const vsNoll = ((s.price - s.noll) / s.noll) * 100;
  return { ...s, varde, pl, plPct, vsNoll };
});

// Totals
const totalVarde = computed.reduce((a, s) => a + s.varde, 0);
const totalPl    = totalVarde - TOTAL_INVESTED;
const totalPlPct = (totalPl / TOTAL_INVESTED) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INVESTED) / TOTAL_INVESTED) * 100;

// Best / worst by vsNoll
const sorted = [...computed].sort((a, b) => b.vsNoll - a.vsNoll);
const best  = sorted[0];
const worst = sorted[sorted.length - 1];

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...computed.map(s => Math.abs(s.plPct)));

// Status
const liveCount = computed.filter(s => s.status === 'LIVE').length;
const allLive   = liveCount === 7;
const noneLive  = liveCount === 0;

// Populate cards
document.getElementById('cardValue').textContent = fmt(totalVarde) + ' kr';

const plEl = document.getElementById('cardPl');
plEl.textContent = sign(totalPl) + fmt(totalPl) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);

const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct, 2) + '%';
plPctEl.className = 'card-sub ' + colorClass(totalPlPct);

const bestEl = document.getElementById('cardBest');
bestEl.innerHTML =
  '<span class="' + colorClass(best.vsNoll) + '">' + best.ticker + ' ' + sign(best.vsNoll) + fmt(best.vsNoll, 2) + '%</span>' +
  '<br><span style="font-size:0.7rem;color:rgba(176,200,212,0.5)">/ ' + worst.ticker + ' ' + sign(worst.vsNoll) + fmt(worst.vsNoll, 2) + '%</span>';

// Status bar
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (allLive) {
  dot.className = 'status-dot';
  statusText.textContent = '7/7 LIVE · Stockholmsbörsen · 16 jun 2026';
} else if (noneLive) {
  dot.className = 'status-dot red';
  statusText.textContent = '0/7 live · FALLBACK-DATA · 16 jun 2026';
} else {
  dot.className = 'status-dot amber';
  statusText.textContent = liveCount + '/7 live · Stockholmsbörsen · 16 jun 2026';
}

// Update time
document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('sv-SE');

// Build table rows
const tbody = document.getElementById('tableBody');
computed.forEach(s => {
  const barWidth = Math.round((Math.abs(s.plPct) / maxAbsPlPct) * 100);
  const barColor = s.pl >= 0 ? '#00ff88' : '#ff1744';
  const badge = s.status === 'LIVE'
    ? '<span class="badge badge-live">LIVE</span>'
    : '<span class="badge badge-fallback">FALLBACK</span>';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-name">${s.ticker}${badge}</div>
      <div class="company-name">${s.name}</div>
    </td>
    <td>${fmt(s.noll, 2)}</td>
    <td class="neu">${fmt(s.price, 2)}</td>
    <td class="${colorClass(s.dayPct)}">${s.dayPct !== null ? sign(s.dayPct) + fmt(s.dayPct, 2) + '%' : '–'}</td>
    <td class="${colorClass(s.vsNoll)}">${sign(s.vsNoll)}${fmt(s.vsNoll, 2)}%</td>
    <td class="${colorClass(s.pl)}">${sign(s.pl)}${fmt(Math.round(s.pl))}</td>
    <td class="bar-cell">
      <div class="bar-bg">
        <div class="bar-fill" style="width:${barWidth}%;background:${barColor}"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td><div class="ticker-name">TOTALT</div></td>
  <td class="neu">${fmt(TOTAL_INVESTED)} kr</td>
  <td class="neu">${fmt(totalVarde)} kr</td>
  <td>–</td>
  <td class="${colorClass(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll, 2)}%</td>
  <td class="${colorClass(totalPl)}">${sign(totalPl)}${fmt(Math.round(totalPl))}</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Live clock
setInterval(() => {
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('sv-SE');
}, 1000);
</script>
</body>
</html>
