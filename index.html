<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050c12;
    --cyan: #00e5ff;
    --pos: #00ff88;
    --neg: #ff1744;
    --amber: #ffb300;
    --dim: rgba(0,229,255,0.12);
    --border: rgba(0,229,255,0.2);
  }

  body {
    background: var(--bg);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 999;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 998;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    color: var(--cyan);
  }

  .subtitle {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: rgba(0,229,255,0.6);
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--dim);
    border: 1px solid var(--border);
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pos);
    display: inline-block;
  }

  .status-right {
    color: rgba(0,229,255,0.7);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--dim);
    border: 1px solid var(--border);
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: rgba(0,229,255,0.55);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.3rem;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.72rem;
    color: rgba(0,229,255,0.55);
    margin-top: 2px;
  }

  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .neutral { color: var(--cyan); }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 10px 12px;
    text-align: right;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(0,229,255,0.6);
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  td {
    padding: 10px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.07);
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  tr:last-child td { border-bottom: none; }

  .total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid var(--border);
    font-weight: bold;
  }

  .total-row td { border-bottom: none; }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--cyan);
  }

  .ticker-full {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.45);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    margin-left: 5px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    border: 1px solid rgba(0,255,136,0.4);
    color: var(--pos);
  }

  .badge-fallback {
    background: rgba(255,179,0,0.15);
    border: 1px solid rgba(255,179,0,0.4);
    color: var(--amber);
  }

  /* Bar cell */
  .bar-cell {
    min-width: 80px;
    padding-right: 16px;
  }

  .bar-track {
    background: rgba(0,229,255,0.08);
    height: 6px;
    width: 100%;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    position: absolute;
    left: 0;
    top: 0;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: rgba(0,229,255,0.3);
    text-transform: uppercase;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 768px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <div class="status-left">
      <span class="dot" id="statusDot"></span>
      <span id="statusText"></span>
    </div>
    <div class="status-right" id="updateTime"></div>
  </div>

  <!-- Summary cards -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neutral">699&nbsp;475 kr</div>
      <div class="card-sub">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value neutral" id="totalVarde">—</div>
      <div class="card-sub">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPl">—</div>
      <div class="card-sub" id="totalPlPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="bestWorst">—</div>
      <div class="card-sub">vs nollkurs</div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="stockTbody"></tbody>
    </table>
  </div>

  <div class="footer">
    Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30
  </div>

</div>

<script>
const NOLLPUNKT = [
  { ticker: 'NDA-SE',  namn: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  kurs: 180.30, dag: -0.88, status: 'LIVE' },
  { ticker: 'SHB-A',  namn: 'Handelsbanken A',       noll: 135.15, antal: 740,  inv: 100011.00, kurs: 140.45, dag: -0.60, status: 'LIVE' },
  { ticker: 'SHB-B',  namn: 'Handelsbanken B',       noll: 224.20, antal: 446,  inv: 99993.20,  kurs: 233.40, dag: -0.68, status: 'LIVE' },
  { ticker: 'SEB-A',  namn: 'SEB A',                 noll: 184.00, antal: 543,  inv: 99912.00,  kurs: 191.70, dag: -0.65, status: 'LIVE' },
  { ticker: 'SEB-C',  namn: 'SEB C',                 noll: 188.20, antal: 531,  inv: 99934.20,  kurs: 194.80, dag: -1.02, status: 'LIVE' },
  { ticker: 'SWED-A', namn: 'Swedbank A',            noll: 336.10, antal: 297,  inv: 99821.70,  kurs: 354.60, dag: -0.53, status: 'LIVE' },
  { ticker: 'AZA',    namn: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  inv: 99909.90,  kurs: 381.10, dag: -0.83, status: 'LIVE' },
];

const UPDATE_TIME = '08:23:47';
const UPDATE_DATE = '2026-06-24';

function fmt(n, decimals=2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtInt(n) {
  return (n >= 0 ? '+' : '') + Math.round(n).toLocaleString('sv-SE');
}

function fmtPct(n) {
  return (n >= 0 ? '+' : '') + fmt(n) + '%';
}

function colorClass(n) {
  return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neutral';
}

// Compute derived values
const stocks = NOLLPUNKT.map(s => {
  const varde = s.kurs * s.antal;
  const pl = varde - s.inv;
  const plPct = (pl / s.inv) * 100;
  const vsNoll = ((s.kurs - s.noll) / s.noll) * 100;
  return { ...s, varde, pl, plPct, vsNoll };
});

const totalInv = 699474.50;
const totalVarde = stocks.reduce((a, s) => a + s.varde, 0);
const totalPl = totalVarde - totalInv;
const totalPlPct = (totalPl / totalInv) * 100;
const liveCnt = stocks.filter(s => s.status === 'LIVE').length;

const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

// Status dot
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCnt === 7) {
  dot.style.background = '#00ff88';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCnt === 0) {
  dot.style.background = '#ff1744';
  statusText.textContent = '0/7 live · ' + UPDATE_DATE;
} else {
  dot.style.background = '#ffb300';
  statusText.textContent = liveCnt + '/7 live · ' + UPDATE_DATE;
}

// Update time — live clock
function updateClock() {
  const now = new Date();
  document.getElementById('updateTime').textContent =
    'Uppdaterad: ' + UPDATE_TIME + ' · ' + now.toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);

// Summary cards
document.getElementById('totalVarde').textContent = Math.round(totalVarde).toLocaleString('sv-SE') + ' kr';

const plEl = document.getElementById('totalPl');
plEl.textContent = fmtInt(totalPl) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);

const plPctEl = document.getElementById('totalPlPct');
plPctEl.textContent = fmtPct(totalPlPct) + ' vs nollpunkt';
plPctEl.className = 'card-sub ' + colorClass(totalPlPct);

const sorted = [...stocks].sort((a, b) => b.vsNoll - a.vsNoll);
const best = sorted[0];
const worst = sorted[sorted.length - 1];
const bwEl = document.getElementById('bestWorst');
bwEl.innerHTML =
  '<span class="pos">' + best.ticker + ' ' + fmtPct(best.vsNoll) + '</span>' +
  ' / ' +
  '<span class="neg">' + worst.ticker + ' ' + fmtPct(worst.vsNoll) + '</span>';
bwEl.className = 'card-value';

// Table rows
const tbody = document.getElementById('stockTbody');

stocks.forEach(s => {
  const barWidth = maxAbsPlPct > 0 ? Math.abs(s.plPct) / maxAbsPlPct * 100 : 0;
  const barColor = s.plPct >= 0 ? '#00ff88' : '#ff1744';
  const badge = s.status === 'LIVE'
    ? '<span class="badge badge-live">LIVE</span>'
    : '<span class="badge badge-fallback">' + UPDATE_DATE + '</span>';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-name">${s.ticker}${badge}</div>
      <div class="ticker-full">${s.namn}</div>
    </td>
    <td class="neutral">${fmt(s.noll)}</td>
    <td class="neutral">${fmt(s.kurs)}</td>
    <td class="${colorClass(s.dag)}">${s.dag !== null ? fmtPct(s.dag) : '–'}</td>
    <td class="${colorClass(s.vsNoll)}">${fmtPct(s.vsNoll)}</td>
    <td class="${colorClass(s.pl)}">${fmtInt(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill" style="width:${barWidth.toFixed(1)}%;background:${barColor}"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalRow = document.createElement('tr');
totalRow.className = 'total-row';
const totalVsNoll = ((totalVarde - totalInv) / totalInv) * 100;
totalRow.innerHTML = `
  <td><span class="ticker-name">TOTALT</span></td>
  <td class="neutral">${Math.round(totalInv).toLocaleString('sv-SE')} kr</td>
  <td class="neutral">${Math.round(totalVarde).toLocaleString('sv-SE')} kr</td>
  <td>–</td>
  <td class="${colorClass(totalVsNoll)}">${fmtPct(totalVsNoll)}</td>
  <td class="${colorClass(totalPl)}">${fmtInt(totalPl)}</td>
  <td class="bar-cell"></td>
`;
tbody.appendChild(totalRow);
</script>
</body>
</html>
