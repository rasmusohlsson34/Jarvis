<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #c8e8f0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.25em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.8rem;
    color: rgba(0,229,255,0.55);
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }

  .status-right {
    color: rgba(0,229,255,0.6);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.35rem;
    font-weight: 600;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.8rem;
    margin-top: 2px;
    opacity: 0.8;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: #00e5ff; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    text-align: left;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: rgba(0,229,255,0.5);
    text-transform: uppercase;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding: 8px 12px;
  }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr.total-row {
    border-top: 1px solid rgba(0,229,255,0.25);
    background: rgba(0,229,255,0.06);
    font-weight: 600;
  }

  td {
    padding: 10px 12px;
    vertical-align: middle;
  }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .stock-name {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.45);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.05em;
    vertical-align: middle;
    margin-left: 4px;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,193,7,0.15);
    color: #ffc107;
    border: 1px solid rgba(255,193,7,0.3);
  }

  /* Bar chart cell */
  .bar-cell {
    min-width: 80px;
  }

  .bar-bg {
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    height: 8px;
    width: 100%;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock">--:--:--</span></div>
  </div>

  <!-- Summary cards -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neu">699 475 kr</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value neu" id="totalVarde">–</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPl">–</div>
      <div class="card-sub" id="totalPlPct">–</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="bestStock">–</div>
      <div class="card-sub" id="worstStock">–</div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th style="min-width:90px"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>
</div>

<script>
const INVESTED_TOTAL = 699474.50;

const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',         noll: 175.25, antal: 570,  investerat: 99892.50,  price: 179.20, dayPct: -0.08, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',     noll: 135.15, antal: 740,  investerat: 100011.00, price: 140.95, dayPct: -0.14, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',     noll: 224.20, antal: 446,  investerat: 99993.20,  price: 233.00, dayPct: -0.43, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',               noll: 184.00, antal: 543,  investerat: 99912.00,  price: 190.00, dayPct: -0.13, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',               noll: 188.20, antal: 531,  investerat: 99934.20,  price: 192.80, dayPct:  0.00, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',           noll: 336.10, antal: 297,  investerat: 99821.70,  price: 357.70, dayPct: +0.34, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  noll: 358.10, antal: 279,  investerat: 99909.90,  price: 384.00, dayPct: -0.05, status: 'LIVE' },
];

const REFRESH_TIME = '07:19:00';
const REFRESH_DATE = '2026-06-26';

function fmt(n, decimals=2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtInt(n) {
  return Math.round(n).toLocaleString('sv-SE');
}

function sign(n) { return n >= 0 ? '+' : ''; }

function colorClass(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu'; }

// Compute P&L
stocks.forEach(s => {
  s.varde   = s.price * s.antal;
  s.pl      = s.varde - s.investerat;
  s.plPct   = (s.pl / s.investerat) * 100;
  s.vsNoll  = ((s.price - s.noll) / s.noll) * 100;
});

const totalVarde  = stocks.reduce((a, s) => a + s.varde, 0);
const totalPl     = totalVarde - INVESTED_TOTAL;
const totalPlPct  = (totalPl / INVESTED_TOTAL) * 100;
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

// Sort for best/worst by vsNoll
const sorted  = [...stocks].sort((a, b) => b.vsNoll - a.vsNoll);
const best    = sorted[0];
const worst   = sorted[sorted.length - 1];

// Fill summary cards
document.getElementById('totalVarde').textContent = fmtInt(totalVarde) + ' kr';
const plEl = document.getElementById('totalPl');
plEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);
const plPctEl = document.getElementById('totalPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + ' %';
plPctEl.className = 'card-sub ' + colorClass(totalPlPct);

document.getElementById('bestStock').innerHTML =
  '<span class="pos">' + best.ticker + ' ' + sign(best.vsNoll) + fmt(best.vsNoll) + ' %</span>';
document.getElementById('worstStock').innerHTML =
  '<span class="' + colorClass(worst.vsNoll) + '">' + worst.ticker + ' ' + sign(worst.vsNoll) + fmt(worst.vsNoll) + ' %</span>';

// Build table
const tbody = document.getElementById('tableBody');
stocks.forEach(s => {
  const badgeHtml = s.status === 'LIVE'
    ? '<span class="badge badge-live">LIVE</span>'
    : '<span class="badge badge-fallback">' + REFRESH_DATE + '</span>';

  const barWidth = maxAbsPlPct > 0 ? (Math.abs(s.plPct) / maxAbsPlPct * 100) : 0;
  const barColor = s.plPct >= 0 ? '#00ff88' : '#ff1744';

  const dayPctFmt = s.dayPct === null ? '–' :
    '<span class="' + colorClass(s.dayPct) + '">' + sign(s.dayPct) + fmt(s.dayPct) + ' %</span>';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-name">${s.ticker}${badgeHtml}</div>
      <div class="stock-name">${s.name}</div>
    </td>
    <td>${fmt(s.noll)} SEK</td>
    <td><strong>${fmt(s.price)} SEK</strong></td>
    <td>${dayPctFmt}</td>
    <td class="${colorClass(s.vsNoll)}">${sign(s.vsNoll)}${fmt(s.vsNoll)} %</td>
    <td class="${colorClass(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)} kr</td>
    <td class="bar-cell">
      <div class="bar-bg">
        <div class="bar-fill" style="width:${barWidth.toFixed(1)}%;background:${barColor}"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalVsNoll = ((totalVarde - INVESTED_TOTAL) / INVESTED_TOTAL) * 100;
const totalRow = document.createElement('tr');
totalRow.className = 'total-row';
totalRow.innerHTML = `
  <td><span class="ticker-name">TOTALT</span></td>
  <td class="neu">699 475 kr</td>
  <td class="neu"><strong>${fmtInt(totalVarde)} kr</strong></td>
  <td>–</td>
  <td class="${colorClass(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)} %</td>
  <td class="${colorClass(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)} kr</td>
  <td></td>
`;
tbody.appendChild(totalRow);

// Status dot + text
const liveCount = stocks.filter(s => s.status === 'LIVE').length;
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  dot.style.background = '#00ff88';
  dot.style.boxShadow = '0 0 6px #00ff88';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.style.background = '#ff1744';
  dot.style.boxShadow = '0 0 6px #ff1744';
  statusText.textContent = '0/7 live · ' + REFRESH_DATE;
} else {
  dot.style.background = '#ffc107';
  dot.style.boxShadow = '0 0 6px #ffc107';
  statusText.textContent = liveCount + '/7 live · ' + REFRESH_DATE;
}

// Live clock
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
