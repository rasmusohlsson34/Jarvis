<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #c0d8e8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    letter-spacing: 0.15em;
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.8rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }

  .status-right {
    color: rgba(192,216,232,0.6);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.4rem;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neu { color: rgba(192,216,232,0.7); }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  th {
    padding: 10px 14px;
    text-align: right;
    color: rgba(0,229,255,0.7);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  td {
    padding: 12px 14px;
    text-align: right;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: #00e5ff;
  }

  .badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: bold;
    margin-left: 6px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.3);
  }

  .stock-name {
    font-size: 0.7rem;
    color: rgba(192,216,232,0.5);
    margin-top: 2px;
  }

  /* Bar cell */
  .bar-cell {
    width: 80px;
    min-width: 80px;
  }

  .bar-track {
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    height: 8px;
    width: 80px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  /* Total row */
  .total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.3) !important;
    font-weight: bold;
  }

  .total-row td {
    color: #00e5ff;
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.7rem;
    color: rgba(192,216,232,0.3);
    letter-spacing: 0.1em;
    padding-top: 16px;
    border-top: 1px solid rgba(0,229,255,0.1);
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub neu">Nollpunkt 9 juni 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardValue">—</div>
      <div class="card-sub neu" id="cardValueSub"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl">—</div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" style="font-size:1rem" id="cardBestWorst">—</div>
      <div class="card-sub neu">vs nollkurs</div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="mainTable">
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">
    KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30
  </div>

</div>

<script>
  const STOCKS = [
    { ticker: 'NDA-SE', name: 'Nordea Bank',          zero: 175.25, qty: 570,  invested: 99892.50,  price: 179.35, dayPct: 0.00, live: true },
    { ticker: 'SHB-A',  name: 'Handelsbanken A',      zero: 135.15, qty: 740,  invested: 100011.00, price: 141.15, dayPct: 0.00, live: true },
    { ticker: 'SHB-B',  name: 'Handelsbanken B',      zero: 224.20, qty: 446,  invested: 99993.20,  price: 234.00, dayPct: 0.00, live: true },
    { ticker: 'SEB-A',  name: 'SEB A',                zero: 184.00, qty: 543,  invested: 99912.00,  price: 190.25, dayPct: 0.00, live: true },
    { ticker: 'SEB-C',  name: 'SEB C',                zero: 188.20, qty: 531,  invested: 99934.20,  price: 192.80, dayPct: 0.00, live: true },
    { ticker: 'SWED-A', name: 'Swedbank A',            zero: 336.10, qty: 297,  invested: 99821.70,  price: 356.50, dayPct: 0.00, live: true },
    { ticker: 'AZA',    name: 'Avanza Bank Holding',  zero: 358.10, qty: 279,  invested: 99909.90,  price: 384.20, dayPct: 0.00, live: true },
  ];

  const TOTAL_INVESTED = 699474.50;
  const fmt = (n, dec=2) => n.toLocaleString('sv-SE', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  const fmtInt = n => Math.round(n).toLocaleString('sv-SE');
  const sign = n => n >= 0 ? '+' : '';

  // Compute per-stock
  let totalVarde = 0, totalPl = 0;
  STOCKS.forEach(s => {
    s.varde = s.price * s.qty;
    s.pl = s.varde - s.invested;
    s.plPct = (s.pl / s.invested) * 100;
    s.vsNullPct = ((s.price - s.zero) / s.zero) * 100;
    totalVarde += s.varde;
    totalPl += s.pl;
  });
  const totalPlPct = (totalPl / TOTAL_INVESTED) * 100;
  const totalVsNull = ((totalVarde - TOTAL_INVESTED) / TOTAL_INVESTED) * 100;

  // Best / worst by vsNullPct
  const sorted = [...STOCKS].sort((a,b) => b.vsNullPct - a.vsNullPct);
  const best = sorted[0];
  const worst = sorted[sorted.length - 1];

  // Max |plPct| for bar scaling
  const maxAbsPlPct = Math.max(...STOCKS.map(s => Math.abs(s.plPct)));

  // Update cards
  document.getElementById('cardValue').textContent = fmtInt(totalVarde) + ' kr';
  document.getElementById('cardValueSub').textContent = '';

  const plEl = document.getElementById('cardPl');
  plEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
  plEl.className = 'card-value ' + (totalPl >= 0 ? 'pos' : 'neg');

  const plPctEl = document.getElementById('cardPlPct');
  plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + '%';
  plPctEl.className = 'card-sub ' + (totalPlPct >= 0 ? 'pos' : 'neg');

  const bwEl = document.getElementById('cardBestWorst');
  bwEl.innerHTML =
    '<span class="pos">' + best.ticker + ' ' + sign(best.vsNullPct) + fmt(best.vsNullPct) + '%</span>' +
    '<br><span class="' + (worst.vsNullPct >= 0 ? 'pos' : 'neg') + '">' + worst.ticker + ' ' + sign(worst.vsNullPct) + fmt(worst.vsNullPct) + '%</span>';

  // Status
  const liveCount = STOCKS.filter(s => s.live).length;
  const dotEl = document.getElementById('statusDot');
  if (liveCount === 7) {
    dotEl.style.background = '#00ff88';
    dotEl.style.boxShadow = '0 0 6px #00ff88';
  } else if (liveCount === 0) {
    dotEl.style.background = '#ff1744';
    dotEl.style.boxShadow = '0 0 6px #ff1744';
  } else {
    dotEl.style.background = '#ffaa00';
    dotEl.style.boxShadow = '0 0 6px #ffaa00';
  }
  const now = new Date();
  const dateStr = now.toLocaleDateString('sv-SE');
  document.getElementById('statusText').textContent =
    liveCount + '/7 live · ' + (liveCount === 7 ? 'Stockholmsbörsen' : dateStr);
  document.getElementById('updateTime').textContent = now.toLocaleTimeString('sv-SE');

  // Live clock
  setInterval(() => {
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('sv-SE');
  }, 1000);

  // Build table rows
  const tbody = document.getElementById('tableBody');
  STOCKS.forEach(s => {
    const tr = document.createElement('tr');
    const barPct = (Math.abs(s.plPct) / maxAbsPlPct) * 100;
    const barColor = s.pl >= 0 ? '#00ff88' : '#ff1744';
    const dayClass = s.dayPct > 0 ? 'pos' : s.dayPct < 0 ? 'neg' : 'neu';
    const vsClass = s.vsNullPct >= 0 ? 'pos' : 'neg';
    const plClass = s.pl >= 0 ? 'pos' : 'neg';

    tr.innerHTML =
      '<td>' +
        '<div>' +
          '<span class="ticker">' + s.ticker + '</span>' +
          '<span class="badge ' + (s.live ? 'badge-live' : 'badge-fallback') + '">' + (s.live ? 'LIVE' : 'FALLBACK') + '</span>' +
        '</div>' +
        '<div class="stock-name">' + s.name + '</div>' +
      '</td>' +
      '<td>' + fmt(s.zero) + '</td>' +
      '<td>' + fmt(s.price) + '</td>' +
      '<td class="' + dayClass + '">' + sign(s.dayPct) + fmt(s.dayPct) + '%</td>' +
      '<td class="' + vsClass + '">' + sign(s.vsNullPct) + fmt(s.vsNullPct) + '%</td>' +
      '<td class="' + plClass + '">' + sign(s.pl) + fmtInt(s.pl) + '</td>' +
      '<td class="bar-cell">' +
        '<div class="bar-track">' +
          '<div class="bar-fill" style="width:' + barPct + '%;background:' + barColor + '"></div>' +
        '</div>' +
      '</td>';
    tbody.appendChild(tr);
  });

  // Total row
  const totalTr = document.createElement('tr');
  totalTr.className = 'total-row';
  const totalVsNullPct = ((totalVarde - TOTAL_INVESTED) / TOTAL_INVESTED) * 100;
  totalTr.innerHTML =
    '<td><span class="ticker">TOTALT</span></td>' +
    '<td>' + fmtInt(TOTAL_INVESTED) + '</td>' +
    '<td>' + fmtInt(totalVarde) + '</td>' +
    '<td>—</td>' +
    '<td class="' + (totalVsNullPct >= 0 ? 'pos' : 'neg') + '">' + sign(totalVsNullPct) + fmt(totalVsNullPct) + '%</td>' +
    '<td class="' + (totalPl >= 0 ? 'pos' : 'neg') + '">' + sign(totalPl) + fmtInt(totalPl) + '</td>' +
    '<td></td>';
  tbody.appendChild(totalTr);
</script>
</body>
</html>
