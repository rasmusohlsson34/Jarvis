<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#050c12;
    color:#c8e6f0;
    font-family:'Share Tech Mono', ui-monospace, 'Courier New', monospace;
    min-height:100vh;
    padding:24px 28px 40px;
  }
  .scanlines {
    position:fixed; inset:0; pointer-events:none; z-index:9998;
    background:repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
  }
  .vignette {
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  }
  header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .logo {
    font-family:'Orbitron', 'Share Tech Mono', sans-serif;
    font-weight:900; font-size:34px; letter-spacing:6px; color:#00e5ff;
    text-shadow:0 0 20px rgba(0,229,255,0.5);
  }
  .subtitle { color:#4a7a8c; font-size:13px; letter-spacing:2px; margin-top:4px; }
  .clock { font-size:26px; color:#00e5ff; text-shadow:0 0 12px rgba(0,229,255,0.4); text-align:right; }
  .clock small { display:block; font-size:12px; color:#4a7a8c; letter-spacing:1px; }
  .statusbar {
    display:flex; justify-content:space-between; align-items:center;
    border:1px solid rgba(0,229,255,0.25); background:rgba(0,229,255,0.04);
    padding:8px 14px; font-size:13px; letter-spacing:1px; margin-bottom:18px;
  }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  .dot.green { background:#00ff88; box-shadow:0 0 8px #00ff88; }
  .dot.amber { background:#ffb300; box-shadow:0 0 8px #ffb300; }
  .dot.red   { background:#ff1744; box-shadow:0 0 8px #ff1744; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:14px; margin-bottom:20px; }
  .card {
    border:1px solid rgba(0,229,255,0.25); background:rgba(0,229,255,0.04);
    padding:14px 16px;
  }
  .card .label { font-size:11px; color:#4a7a8c; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  .card .value { font-size:24px; color:#e6f7ff; }
  .card .sub { font-size:13px; margin-top:4px; }
  .pos { color:#00ff88; }
  .neg { color:#ff1744; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  thead th {
    text-align:right; color:#4a7a8c; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    border-bottom:1px solid rgba(0,229,255,0.35); padding:8px 10px;
  }
  thead th:first-child { text-align:left; }
  tbody td, tfoot td { padding:10px; text-align:right; border-bottom:1px solid rgba(0,229,255,0.12); }
  tbody td:first-child, tfoot td:first-child { text-align:left; }
  .ticker { font-family:'Orbitron', sans-serif; font-weight:700; font-size:14px; color:#e6f7ff; letter-spacing:1px; }
  .badge {
    font-size:9px; letter-spacing:1px; padding:2px 6px; margin-left:8px; vertical-align:middle;
    border:1px solid #00ff88; color:#00ff88;
  }
  .badge.fb { border-color:#ffb300; color:#ffb300; }
  .name { font-size:11px; color:#4a7a8c; margin-top:3px; }
  .barcell { width:120px; }
  .bar { height:8px; background:rgba(255,255,255,0.06); position:relative; }
  .bar span { position:absolute; left:0; top:0; bottom:0; }
  tfoot td { border-top:2px solid rgba(0,229,255,0.4); border-bottom:none; color:#e6f7ff; font-weight:bold; }
  footer { margin-top:26px; text-align:center; font-size:11px; color:#33586a; letter-spacing:2px; }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>

<header>
  <div>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>
  <div class="clock"><span id="clock">--:--:--</span><small>STOCKHOLM</small></div>
</header>

<div class="statusbar">
  <div><span class="dot green"></span>7/7 live · Stockholmsbörsen</div>
  <div>Uppdaterad: 09:08:01</div>
</div>

<div class="cards" id="cards"></div>

<table>
  <thead>
    <tr>
      <th>Aktie</th><th>Nollkurs</th><th>Kurs</th><th>Dag%</th><th>Vs noll%</th><th>P&amp;L (SEK)</th><th class="barcell"></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
  <tfoot id="foot"></tfoot>
</table>

<footer>KÄLLA: AVANZA · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>

<script>
const DATA = [
  { t:'NDA-SE', n:'Nordea Bank',         noll:175.25, antal:570, inv:99892.50,  kurs:187.45, dag:0.00, live:true },
  { t:'SHB-A',  n:'Handelsbanken A',     noll:135.15, antal:740, inv:100011.00, kurs:143.65, dag:0.00, live:true },
  { t:'SHB-B',  n:'Handelsbanken B',     noll:224.20, antal:446, inv:99993.20,  kurs:236.80, dag:0.00, live:true },
  { t:'SEB-A',  n:'SEB A',               noll:184.00, antal:543, inv:99912.00,  kurs:197.20, dag:0.00, live:true },
  { t:'SEB-C',  n:'SEB C',               noll:188.20, antal:531, inv:99934.20,  kurs:198.40, dag:0.00, live:true },
  { t:'SWED-A', n:'Swedbank A',          noll:336.10, antal:297, inv:99821.70,  kurs:366.20, dag:0.00, live:true },
  { t:'AZA',    n:'Avanza Bank Holding', noll:358.10, antal:279, inv:99909.90,  kurs:390.00, dag:0.00, live:true }
];

const sek = n => Math.round(n).toLocaleString('sv-SE');
const sign = (n, d=2) => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(d).replace('.', ',');
const cls = n => n >= 0 ? 'pos' : 'neg';

let totInv = 0, totVarde = 0;
const rows = DATA.map(a => {
  const varde = a.kurs * a.antal;
  const pl = varde - a.inv;
  const plPct = pl / a.inv * 100;
  const vsNoll = (a.kurs - a.noll) / a.noll * 100;
  totInv += a.inv; totVarde += varde;
  return { ...a, varde, pl, plPct, vsNoll };
});
const totPl = totVarde - totInv;
const totPlPct = totPl / totInv * 100;
const maxAbs = Math.max(...rows.map(r => Math.abs(r.plPct)));
const best = rows.reduce((a,b) => b.vsNoll > a.vsNoll ? b : a);
const worst = rows.reduce((a,b) => b.vsNoll < a.vsNoll ? b : a);

document.getElementById('cards').innerHTML = `
  <div class="card"><div class="label">Investerat</div><div class="value">${sek(totInv)} kr</div><div class="sub">Nollpunkt 9 juni 2026</div></div>
  <div class="card"><div class="label">Portföljvärde</div><div class="value">${sek(totVarde)} kr</div><div class="sub">7 innehav</div></div>
  <div class="card"><div class="label">Total P&amp;L</div><div class="value ${cls(totPl)}">${totPl>=0?'+':'−'}${sek(Math.abs(totPl))} kr</div><div class="sub ${cls(totPl)}">${sign(totPlPct)} %</div></div>
  <div class="card"><div class="label">Bäst / Sämst</div>
    <div class="value" style="font-size:17px"><span class="${cls(best.vsNoll)}">${best.t} ${sign(best.vsNoll)} %</span></div>
    <div class="sub"><span class="${cls(worst.vsNoll)}">${worst.t} ${sign(worst.vsNoll)} %</span></div></div>`;

document.getElementById('rows').innerHTML = rows.map(r => `
  <tr>
    <td><span class="ticker">${r.t}</span><span class="badge${r.live?'':' fb'}">${r.live?'LIVE':'6 JUL'}</span><div class="name">${r.n}</div></td>
    <td>${r.noll.toFixed(2).replace('.', ',')}</td>
    <td>${r.kurs.toFixed(2).replace('.', ',')}</td>
    <td class="${r.dag===null?'':cls(r.dag)}">${r.dag===null?'–':sign(r.dag)+' %'}</td>
    <td class="${cls(r.vsNoll)}">${sign(r.vsNoll)} %</td>
    <td class="${cls(r.pl)}">${r.pl>=0?'+':'−'}${sek(Math.abs(r.pl))}</td>
    <td class="barcell"><div class="bar"><span style="width:${maxAbs?Math.abs(r.plPct)/maxAbs*100:0}%;background:${r.plPct>=0?'#00ff88':'#ff1744'}"></span></div></td>
  </tr>`).join('');

document.getElementById('foot').innerHTML = `
  <tr>
    <td>TOTALT</td>
    <td>${sek(totInv)}</td>
    <td>${sek(totVarde)}</td>
    <td>–</td>
    <td class="${cls(totPlPct)}">${sign(totPlPct)} %</td>
    <td class="${cls(totPl)}">${totPl>=0?'+':'−'}${sek(Math.abs(totPl))}</td>
    <td class="barcell"></td>
  </tr>`;

function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('sv-SE', { timeZone:'Europe/Stockholm' });
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
