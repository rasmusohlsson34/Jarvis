<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #c0d8e8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 100;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 100;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 16px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.75rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.2em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.12);
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px rgba(0,255,136,0.8);
  }

  .status-right {
    color: rgba(0,229,255,0.5);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (max-width: 800px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.62rem;
    color: rgba(0,229,255,0.45);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.1rem;
    color: #00e5ff;
    font-weight: bold;
  }

  .card-sub {
    font-size: 0.72rem;
    margin-top: 3px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neutral { color: #00e5ff; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }

  thead tr {
    border-bottom: 1px solid rgba(0,229,255,0.25);
  }

  th {
    padding: 8px 10px;
    text-align: right;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: rgba(0,229,255,0.45);
    text-transform: uppercase;
    font-weight: normal;
  }

  th:first-child { text-align: left; }

  td {
    padding: 10px 10px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.06);
    vertical-align: middle;
  }

  td:first-child { text-align: left; }

  tr:hover td { background: rgba(0,229,255,0.04); }

  .ticker-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    color: #00e5ff;
    letter-spacing: 0.05em;
  }

  .stock-fullname {
    font-size: 0.6rem;
    color: rgba(0,229,255,0.35);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.5rem;
    padding: 1px 4px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    margin-left: 4px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  /* Bar chart cell */
  .bar-cell {
    width: 80px;
    padding-right: 10px;
  }

  .bar-track {
    background: rgba(255,255,255,0.05);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    width: 70px;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  .bar-pos { background: #00ff88; }
  .bar-neg { background: #ff1744; }

  /* Total row */
  .total-row td {
    border-top: 1px solid rgba(0,229,255,0.2);
    border-bottom: none;
    color: #00e5ff;
    font-weight: bold;
    padding-top: 12px;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.6rem;
    color: rgba(0,229,255,0.2);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-top: 1px solid rgba(0,229,255,0.08);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clockDisplay"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475&nbsp;kr</div>
      <div class="card-sub neutral">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="totalVardeCard">–</div>
      <div class="card-sub neutral" id="totalVardeSub"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPlCard">–</div>
      <div class="card-sub" id="totalPlPctCard"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="bestCard">–</div>
      <div class="card-sub" id="worstCard"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">Källa: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  kurs: 184.45, dag: 2.10,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       noll: 135.15, antal: 740,  inv: 100011.00, kurs: 141.90, dag: 0.60,  status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       noll: 224.20, antal: 446,  inv: 99993.20,  kurs: 235.60, dag: 1.12,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 noll: 184.00, antal: 543,  inv: 99912.00,  kurs: 195.10, dag: 0.28,  status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 noll: 188.20, antal: 531,  inv: 99934.20,  kurs: 199.20, dag: 1.74,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             noll: 336.10, antal: 297,  inv: 99821.70,  kurs: 359.10, dag: 0.98,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  inv: 99909.90,  kurs: 386.20, dag: 1.66,  status: 'LIVE' },
];

const TOTAL_INV = 699474.50;
const UPDATE_TIME = '13:36';

function fmt(n, dec=2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtInt(n) {
  return Math.round(n).toLocaleString('sv-SE');
}
function sign(n) { return n >= 0 ? '+' : ''; }
function cls(n) { return n >= 0 ? 'pos' : 'neg'; }

// Calculate P&L per stock
STOCKS.forEach(s => {
  s.varde = s.kurs * s.antal;
  s.pl = s.varde - s.inv;
  s.plPct = (s.pl / s.inv) * 100;
  s.vsNoll = ((s.kurs - s.noll) / s.noll) * 100;
});

const totalVarde = STOCKS.reduce((a, s) => a + s.varde, 0);
const totalPl = totalVarde - TOTAL_INV;
const totalPlPct = (totalPl / TOTAL_INV) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INV) / TOTAL_INV) * 100;

// Best/worst by vsNoll
const sorted = [...STOCKS].sort((a, b) => b.vsNoll - a.vsNoll);
const best = sorted[0];
const worst = sorted[sorted.length - 1];

// Cards
document.getElementById('totalVardeCard').textContent = fmtInt(totalVarde) + ' kr';
document.getElementById('totalVardeSub').textContent = sign(totalPl) + fmtInt(totalPl) + ' kr vs noll';
document.getElementById('totalVardeSub').className = 'card-sub ' + cls(totalPl);

const plCardEl = document.getElementById('totalPlCard');
plCardEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
plCardEl.className = 'card-value ' + cls(totalPl);
const plPctEl = document.getElementById('totalPlPctCard');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + '%';
plPctEl.className = 'card-sub ' + cls(totalPlPct);

document.getElementById('bestCard').innerHTML = `<span class="pos">${best.ticker} ${sign(best.vsNoll)}${fmt(best.vsNoll)}%</span>`;
document.getElementById('worstCard').innerHTML = `<span class="${cls(worst.vsNoll)}">${worst.ticker} ${sign(worst.vsNoll)}${fmt(worst.vsNoll)}%</span>`;

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...STOCKS.map(s => Math.abs(s.plPct)));

// Table
const tbody = document.getElementById('tableBody');

STOCKS.forEach(s => {
  const barPct = maxAbsPlPct > 0 ? (Math.abs(s.plPct) / maxAbsPlPct) * 100 : 0;
  const barClass = s.pl >= 0 ? 'bar-pos' : 'bar-neg';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-name">${s.ticker}<span class="badge badge-live">LIVE</span></div>
      <div class="stock-fullname">${s.name}</div>
    </td>
    <td>${fmt(s.noll)} SEK</td>
    <td><strong>${fmt(s.kurs)} SEK</strong></td>
    <td class="${cls(s.dag)}">${sign(s.dag)}${fmt(s.dag)}%</td>
    <td class="${cls(s.vsNoll)}">${sign(s.vsNoll)}${fmt(s.vsNoll)}%</td>
    <td class="${cls(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${barPct.toFixed(1)}%"></div></div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td><span class="ticker-name">TOTALT</span></td>
  <td>${fmtInt(TOTAL_INV)} kr</td>
  <td>${fmtInt(totalVarde)} kr</td>
  <td>–</td>
  <td class="${cls(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)}%</td>
  <td class="${cls(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)}</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
