<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #050c12; color: #cfeef5; font-family: 'Share Tech Mono', monospace; }
  body { min-height: 100vh; padding: 28px 20px 60px; position: relative; }
  .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px); }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 8;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%); }
  .wrap { max-width: 1080px; margin: 0 auto; position: relative; z-index: 1; }
  header { text-align: center; border-bottom: 1px solid rgba(0,229,255,0.25); padding-bottom: 16px; margin-bottom: 20px; }
  .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 40px; letter-spacing: 8px;
    color: #00e5ff; text-shadow: 0 0 20px rgba(0,229,255,0.5); }
  .subtitle { font-size: 13px; letter-spacing: 3px; color: #6fb9c9; margin-top: 6px; text-transform: uppercase; }
  .clock { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #00e5ff; margin-top: 10px; letter-spacing: 2px; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    border: 1px solid rgba(0,229,255,0.2); border-radius: 4px; padding: 8px 14px; margin-bottom: 22px; background: rgba(0,229,255,0.03); }
  .status-left { display: flex; align-items: center; gap: 10px; letter-spacing: 1px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot.green { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
  .dot.amber { background: #ffb300; box-shadow: 0 0 10px #ffb300; }
  .dot.red { background: #ff1744; box-shadow: 0 0 10px #ff1744; }
  .status-right { color: #6fb9c9; letter-spacing: 1px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
  .card { border: 1px solid rgba(0,229,255,0.2); border-radius: 6px; padding: 16px; background: linear-gradient(180deg, rgba(0,229,255,0.05), rgba(0,229,255,0.01)); }
  .card .label { font-size: 11px; letter-spacing: 2px; color: #6fb9c9; text-transform: uppercase; margin-bottom: 10px; }
  .card .value { font-family: 'Orbitron', sans-serif; font-size: 22px; color: #cfeef5; }
  .card .sub { font-size: 14px; margin-top: 6px; }
  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-family: 'Orbitron', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: #00e5ff; text-align: right; padding: 10px 12px; border-bottom: 1px solid rgba(0,229,255,0.3); }
  th:first-child { text-align: left; }
  td { padding: 11px 12px; border-bottom: 1px solid rgba(0,229,255,0.08); text-align: right; vertical-align: middle; }
  td:first-child { text-align: left; }
  .tk { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #cfeef5; display: flex; align-items: center; gap: 8px; }
  .name { font-size: 11px; color: #6fb9c9; margin-top: 3px; }
  .badge { font-size: 9px; padding: 2px 6px; border-radius: 3px; letter-spacing: 1px; font-family: 'Share Tech Mono'; }
  .badge.live { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.4); }
  .badge.fb { background: rgba(255,179,0,0.15); color: #ffb300; border: 1px solid rgba(255,179,0,0.4); }
  .bar-cell { width: 120px; }
  .bar-track { width: 110px; height: 10px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-left: auto; position: relative; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .bar-fill.pos { background: #00ff88; }
  .bar-fill.neg { background: #ff1744; }
  tr.total td { border-top: 2px solid rgba(0,229,255,0.4); border-bottom: none; font-family: 'Orbitron', sans-serif; font-size: 13px; padding-top: 14px; }
  footer { text-align: center; margin-top: 30px; font-size: 11px; letter-spacing: 2px; color: #436573; text-transform: uppercase; }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="wrap">
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="statusbar">
    <div class="status-left"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
    <div class="status-right">Uppdaterad: <span id="updated"></span></div>
  </div>

  <div class="cards" id="cards"></div>

  <table>
    <thead>
      <tr>
        <th>Aktie</th><th>Nollkurs</th><th>Kurs</th><th>Dag%</th><th>Vs noll%</th><th>P&amp;L (SEK)</th><th class="bar-cell"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>
</div>

<script>
  var UPDATED = "09:19:16";
  var DATESTAMP = "2026-06-29";
  var stocks = [
    { tk: "NDA-SE", name: "Nordea Bank",          noll: 175.25, antal: 570, inv: 99892.50, kurs: 179.80, day: -0.42, status: "LIVE" },
    { tk: "SHB-A",  name: "Handelsbanken A",       noll: 135.15, antal: 740, inv: 100011.00, kurs: 141.20, day: -0.28, status: "LIVE" },
    { tk: "SHB-B",  name: "Handelsbanken B",       noll: 224.20, antal: 446, inv: 99993.20, kurs: 233.80, day: null,  status: "LIVE" },
    { tk: "SEB-A",  name: "SEB A",                 noll: 184.00, antal: 543, inv: 99912.00, kurs: 190.35, day: -0.31, status: "LIVE" },
    { tk: "SEB-C",  name: "SEB C",                 noll: 188.20, antal: 531, inv: 99934.20, kurs: 192.80, day: -0.41, status: "LIVE" },
    { tk: "SWED-A", name: "Swedbank A",            noll: 336.10, antal: 297, inv: 99821.70, kurs: 357.60, day: -0.36, status: "LIVE" },
    { tk: "AZA",    name: "Avanza Bank Holding",   noll: 358.10, antal: 279, inv: 99909.90, kurs: 387.70, day: 0.08,  status: "LIVE" }
  ];

  function nf(n, dec) { return n.toLocaleString('sv-SE', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  function sgn(n, dec) { return (n >= 0 ? "+" : "−") + nf(Math.abs(n), dec); }

  var totalInv = 0, totalVarde = 0, liveCount = 0;
  stocks.forEach(function(s) {
    s.varde = s.kurs * s.antal;
    s.pl = s.varde - s.inv;
    s.plPct = (s.pl / s.inv) * 100;
    s.vsNoll = ((s.kurs - s.noll) / s.noll) * 100;
    totalInv += s.inv;
    totalVarde += s.varde;
    if (s.status === "LIVE") liveCount++;
  });
  var totalPl = totalVarde - totalInv;
  var totalPlPct = (totalPl / totalInv) * 100;
  var totalVsNoll = totalPlPct;

  var sorted = stocks.slice().sort(function(a,b){ return b.vsNoll - a.vsNoll; });
  var best = sorted[0], worst = sorted[sorted.length - 1];
  var maxAbs = Math.max.apply(null, stocks.map(function(s){ return Math.abs(s.plPct); }));

  // status bar
  var dot = document.getElementById('statusDot');
  var stxt = document.getElementById('statusText');
  if (liveCount === stocks.length) { dot.className = 'dot green'; stxt.textContent = liveCount + '/' + stocks.length + ' live · Stockholmsbörsen'; }
  else if (liveCount === 0) { dot.className = 'dot red'; stxt.textContent = liveCount + '/' + stocks.length + ' live · ' + DATESTAMP; }
  else { dot.className = 'dot amber'; stxt.textContent = liveCount + '/' + stocks.length + ' live · ' + DATESTAMP; }
  document.getElementById('updated').textContent = UPDATED;

  // cards
  var bestWorst = (best.vsNoll >= 0 ? '+' : '−') + nf(Math.abs(best.vsNoll), 2);
  var cardsHtml = ''
    + card('Investerat', nf(699475, 0) + ' kr', '')
    + card('Portföljvärde', nf(Math.round(totalVarde), 0) + ' kr', '')
    + card('Total P&L', '<span class="' + (totalPl>=0?'pos':'neg') + '">' + sgn(Math.round(totalPl), 0) + ' kr</span>',
           '<span class="' + (totalPl>=0?'pos':'neg') + '">' + sgn(totalPlPct, 2) + ' %</span>')
    + card('Bäst / Sämst',
           '<span class="pos">' + best.tk + ' ' + sgn(best.vsNoll,2) + '%</span>',
           '<span class="' + (worst.vsNoll>=0?'pos':'neg') + '">' + worst.tk + ' ' + sgn(worst.vsNoll,2) + '%</span>');
  document.getElementById('cards').innerHTML = cardsHtml;

  function card(label, value, sub) {
    return '<div class="card"><div class="label">' + label + '</div><div class="value">' + value + '</div>'
      + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }

  // table
  var rows = '';
  stocks.forEach(function(s) {
    var badge = s.status === 'LIVE'
      ? '<span class="badge live">LIVE</span>'
      : '<span class="badge fb">' + DATESTAMP + '</span>';
    var dayCell = s.day === null ? '–' : '<span class="' + (s.day>=0?'pos':'neg') + '">' + sgn(s.day,2) + '%</span>';
    var vsCls = s.vsNoll >= 0 ? 'pos' : 'neg';
    var plCls = s.pl >= 0 ? 'pos' : 'neg';
    var barW = maxAbs > 0 ? Math.abs(s.plPct) / maxAbs * 110 : 0;
    var barCls = s.plPct >= 0 ? 'pos' : 'neg';
    rows += '<tr>'
      + '<td><div class="tk">' + s.tk + ' ' + badge + '</div><div class="name">' + s.name + '</div></td>'
      + '<td>' + nf(s.noll,2) + '</td>'
      + '<td>' + nf(s.kurs,2) + '</td>'
      + '<td>' + dayCell + '</td>'
      + '<td class="' + vsCls + '">' + sgn(s.vsNoll,2) + '%</td>'
      + '<td class="' + plCls + '">' + sgn(Math.round(s.pl),0) + '</td>'
      + '<td class="bar-cell"><div class="bar-track"><div class="bar-fill ' + barCls + '" style="width:' + barW + 'px"></div></div></td>'
      + '</tr>';
  });
  rows += '<tr class="total">'
    + '<td>TOTALT</td>'
    + '<td>' + nf(totalInv,0) + '</td>'
    + '<td>' + nf(Math.round(totalVarde),0) + '</td>'
    + '<td>–</td>'
    + '<td class="' + (totalVsNoll>=0?'pos':'neg') + '">' + sgn(totalVsNoll,2) + '%</td>'
    + '<td class="' + (totalPl>=0?'pos':'neg') + '">' + sgn(Math.round(totalPl),0) + '</td>'
    + '<td></td>'
    + '</tr>';
  document.getElementById('tbody').innerHTML = rows;

  // live clock
  function tick() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('sv-SE');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
