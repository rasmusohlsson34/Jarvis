<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050c12;
    --accent:#00e5ff;
    --pos:#00ff88;
    --neg:#ff1744;
    --amber:#ffb300;
    --panel:#0a161f;
    --border:rgba(0,229,255,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:#d6f6ff;
    font-family:'Share Tech Mono', monospace;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events:none;
    z-index:10;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events:none;
    z-index:11;
  }
  .wrap{
    position:relative;
    max-width:1180px;
    margin:0 auto;
    padding:32px 24px 60px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
    margin-bottom:20px;
  }
  .logo{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:34px;
    letter-spacing:4px;
    color:var(--accent);
    text-shadow:0 0 20px rgba(0,229,255,0.5);
  }
  .subtitle{
    font-size:13px;
    color:#7fb8c9;
    letter-spacing:1px;
    margin-top:6px;
  }
  .clock{
    font-family:'Orbitron', sans-serif;
    font-size:26px;
    color:var(--accent);
    text-shadow:0 0 12px rgba(0,229,255,0.4);
    text-align:right;
  }
  .clock-date{
    font-size:12px;
    color:#7fb8c9;
    text-align:right;
    margin-top:4px;
    letter-spacing:1px;
  }
  .statusrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 18px;
    margin-bottom:28px;
    font-size:13px;
    letter-spacing:0.5px;
  }
  .statusrow .left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
    box-shadow:0 0 8px currentColor;
  }
  .dot.green{background:var(--pos);color:var(--pos);}
  .dot.amber{background:var(--amber);color:var(--amber);}
  .dot.red{background:var(--neg);color:var(--neg);}
  .statusrow .right{color:#7fb8c9;}

  .cards{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
    margin-bottom:32px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:18px 20px;
  }
  .card .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:#7fb8c9;
    margin-bottom:10px;
  }
  .card .value{
    font-size:24px;
    font-weight:bold;
    color:#eafcff;
  }
  .card .subvalue{
    font-size:14px;
    margin-top:4px;
  }
  .pos{color:var(--pos);}
  .neg{color:var(--neg);}

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    font-size:14px;
  }
  thead th{
    text-align:left;
    padding:12px 14px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:#7fb8c9;
    border-bottom:1px solid var(--border);
  }
  tbody td{
    padding:14px;
    border-bottom:1px solid rgba(0,229,255,0.08);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.total td{
    border-top:1px solid var(--border);
    font-weight:bold;
    background:rgba(0,229,255,0.04);
  }
  .ticker{
    font-family:'Orbitron', sans-serif;
    font-size:15px;
    letter-spacing:1px;
    color:#eafcff;
  }
  .name{
    font-size:11px;
    color:#7fb8c9;
    margin-top:3px;
  }
  .badge{
    display:inline-block;
    font-size:9px;
    letter-spacing:1px;
    padding:2px 6px;
    border-radius:3px;
    margin-left:8px;
    vertical-align:middle;
    font-family:'Share Tech Mono', monospace;
  }
  .badge.live{background:rgba(0,255,136,0.15);color:var(--pos);border:1px solid rgba(0,255,136,0.4);}
  .badge.fallback{background:rgba(255,179,0,0.15);color:var(--amber);border:1px solid rgba(255,179,0,0.4);}
  .barcell{width:160px;}
  .bar-track{
    width:100%;
    height:8px;
    background:rgba(255,255,255,0.06);
    border-radius:4px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:4px;
  }
  .bar-fill.pos{background:var(--pos);box-shadow:0 0 6px var(--pos);}
  .bar-fill.neg{background:var(--neg);box-shadow:0 0 6px var(--neg);}

  footer{
    margin-top:28px;
    text-align:center;
    font-size:11px;
    letter-spacing:1px;
    color:#4d7a89;
  }

  @media (max-width:800px){
    .cards{grid-template-columns:repeat(2,1fr);}
    table{font-size:12px;}
    .barcell{width:90px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="logo">J.A.R.V.I.S.</div>
      <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
    </div>
    <div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="clock-date" id="clockDate">-</div>
    </div>
  </header>

  <div class="statusrow">
    <div class="left">
      <span class="dot green" id="statusDot"></span>
      <span id="statusText">7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="right">Uppdaterad: <span id="updatedAt">10:41:33</span></div>
  </div>

  <div class="cards" id="cards"></div>

  <table>
    <thead>
      <tr>
        <th>Aktie</th>
        <th>Nollkurs</th>
        <th>Kurs</th>
        <th>Dag%</th>
        <th>Vs noll%</th>
        <th>P&amp;L (SEK)</th>
        <th>Utveckling</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>KÄLLA: Avanza · UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>

</div>

<script>
  // ---- Portföljdata (nollpunkt 9 juni 2026, kl 10:30 Stockholm) ----
  const stocks = [
    { ticker:"NDA-SE", name:"Nordea Bank",           nollkurs:175.25, antal:570, investerat:99892.50,  kurs:182.90, dagPct:0.19,  status:"LIVE" },
    { ticker:"SHB-A",  name:"Handelsbanken A",       nollkurs:135.15, antal:740, investerat:100011.00, kurs:142.20, dagPct:0.39,  status:"LIVE" },
    { ticker:"SHB-B",  name:"Handelsbanken B",       nollkurs:224.20, antal:446, investerat:99993.20,  kurs:235.20, dagPct:0.26,  status:"LIVE" },
    { ticker:"SEB-A",  name:"SEB A",                 nollkurs:184.00, antal:543, investerat:99912.00,  kurs:193.95, dagPct:0.78,  status:"LIVE" },
    { ticker:"SEB-C",  name:"SEB C",                 nollkurs:188.20, antal:531, investerat:99934.20,  kurs:196.60, dagPct:0.61,  status:"LIVE" },
    { ticker:"SWED-A", name:"Swedbank A",            nollkurs:336.10, antal:297, investerat:99821.70,  kurs:359.70, dagPct:0.50,  status:"LIVE" },
    { ticker:"AZA",    name:"Avanza Bank Holding",   nollkurs:358.10, antal:279, investerat:99909.90,  kurs:391.40, dagPct:0.36,  status:"LIVE" },
  ];

  const totalInvesterat = 699474.50;

  stocks.forEach(s=>{
    s.varde = s.kurs * s.antal;
    s.pl = s.varde - s.investerat;
    s.plPct = (s.pl / s.investerat) * 100;
  });

  const totalVarde = stocks.reduce((a,s)=>a+s.varde,0);
  const totalPl = totalVarde - totalInvesterat;
  const totalPlPct = (totalPl / totalInvesterat) * 100;

  const liveCount = stocks.filter(s=>s.status==="LIVE").length;

  function fmtKr(n){
    return Math.round(n).toLocaleString('sv-SE');
  }
  function fmtPct(n){
    const sign = n > 0 ? "+" : (n < 0 ? "−" : "");
    return sign + Math.abs(n).toFixed(2).replace('.', ',') + "%";
  }
  function pctClass(n){ return n >= 0 ? "pos" : "neg"; }

  // ---- Statusrad ----
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  if (liveCount === stocks.length){
    statusDot.className = "dot green";
    statusText.textContent = `${liveCount}/${stocks.length} live · Stockholmsbörsen`;
  } else if (liveCount === 0){
    statusDot.className = "dot red";
    statusText.textContent = `${liveCount}/${stocks.length} live · ${new Date().toLocaleDateString('sv-SE')}`;
  } else {
    statusDot.className = "dot amber";
    statusText.textContent = `${liveCount}/${stocks.length} live · ${new Date().toLocaleDateString('sv-SE')}`;
  }

  // ---- Sammanfattningskort ----
  const best = stocks.reduce((a,b)=> b.plPct > a.plPct ? b : a);
  const worst = stocks.reduce((a,b)=> b.plPct < a.plPct ? b : a);

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = `
    <div class="card">
      <div class="label">Investerat</div>
      <div class="value">${fmtKr(totalInvesterat)} kr</div>
    </div>
    <div class="card">
      <div class="label">Portföljvärde</div>
      <div class="value">${fmtKr(totalVarde)} kr</div>
    </div>
    <div class="card">
      <div class="label">Total P&amp;L</div>
      <div class="value ${pctClass(totalPl)}">${totalPl>=0?'+':'−'}${fmtKr(Math.abs(totalPl))} kr</div>
      <div class="subvalue ${pctClass(totalPlPct)}">${fmtPct(totalPlPct)}</div>
    </div>
    <div class="card">
      <div class="label">Bäst / Sämst (vs nollkurs)</div>
      <div class="value" style="font-size:16px;">
        <span class="pos">${best.ticker} ${fmtPct(best.plPct)}</span>
      </div>
      <div class="subvalue neg">${worst.ticker} ${fmtPct(worst.plPct)}</div>
    </div>
  `;

  // ---- Tabell ----
  const maxAbsPct = Math.max(...stocks.map(s=>Math.abs(s.plPct)));
  const tbody = document.getElementById('tbody');
  let rows = "";
  stocks.forEach(s=>{
    const barPct = Math.min(100, (Math.abs(s.plPct) / maxAbsPct) * 100);
    const barClass = s.plPct >= 0 ? "pos" : "neg";
    const badgeClass = s.status === "LIVE" ? "live" : "fallback";
    const badgeText = s.status === "LIVE" ? "LIVE" : new Date().toLocaleDateString('sv-SE');
    rows += `
      <tr>
        <td>
          <span class="ticker">${s.ticker}</span><span class="badge ${badgeClass}">${badgeText}</span>
          <div class="name">${s.name}</div>
        </td>
        <td>${s.nollkurs.toFixed(2).replace('.', ',')}</td>
        <td>${s.kurs.toFixed(2).replace('.', ',')}</td>
        <td class="${pctClass(s.dagPct)}">${s.dagPct===null?'–':fmtPct(s.dagPct)}</td>
        <td class="${pctClass(s.plPct)}">${fmtPct(s.plPct)}</td>
        <td class="${pctClass(s.pl)}">${s.pl>=0?'+':'−'}${fmtKr(Math.abs(s.pl))}</td>
        <td class="barcell">
          <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${barPct}%;"></div></div>
        </td>
      </tr>
    `;
  });
  rows += `
    <tr class="total">
      <td>TOTALT</td>
      <td>–</td>
      <td>–</td>
      <td>–</td>
      <td class="${pctClass(totalPlPct)}">${fmtPct(totalPlPct)}</td>
      <td class="${pctClass(totalPl)}">${totalPl>=0?'+':'−'}${fmtKr(Math.abs(totalPl))}</td>
      <td>–</td>
    </tr>
  `;
  tbody.innerHTML = rows;

  // ---- Klocka ----
  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('sv-SE');
    document.getElementById('clockDate').textContent = now.toLocaleDateString('sv-SE', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
