<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    letter-spacing: 0.2em;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.6);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.8rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
  }

  .status-right {
    color: rgba(0,229,255,0.6);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  @media (max-width: 800px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 6px;
    padding: 16px;
  }

  .card-label {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.2rem;
    color: #00e5ff;
  }

  .card-value.positive { color: #00ff88; }
  .card-value.negative { color: #ff1744; }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
    color: rgba(0,229,255,0.5);
  }

  .card-sub.positive { color: #00ff88; }
  .card-sub.negative { color: #ff1744; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead tr {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  th {
    padding: 10px 14px;
    text-align: right;
    color: rgba(0,229,255,0.6);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr.total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.25);
    font-weight: bold;
  }

  td {
    padding: 12px 14px;
    text-align: right;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    color: #00e5ff;
  }

  .stock-name {
    font-size: 0.7rem;
    color: rgba(0,229,255,0.4);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 2px 5px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,193,7,0.15);
    color: #ffc107;
    border: 1px solid rgba(255,193,7,0.3);
  }

  .positive { color: #00ff88; }
  .negative { color: #ff1744; }
  .neutral  { color: rgba(0,229,255,0.5); }

  /* Bar cell */
  .bar-cell {
    width: 100px;
    padding: 12px 14px;
  }

  .bar-track {
    width: 80px;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.68rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot"></div>
      <span>7/7 live · Stockholmsbörsen</span>
    </div>
    <div class="status-right">Uppdaterad: <span id="clock">--:--:--</span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475 kr</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="totalVarde">—</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPl">—</div>
      <div class="card-sub" id="totalPlPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst (vs noll)</div>
      <div class="card-value positive" id="bestStock">—</div>
      <div class="card-sub negative" id="worstStock">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>KÄLLA: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30</footer>

</div>

<script>
const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  kurs: 182.40, dagPct: 0.97,  status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       noll: 135.15, antal: 740,  inv: 100011.00, kurs: 141.00, dagPct: -0.04, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       noll: 224.20, antal: 446,  inv: 99993.20,  kurs: 234.40, dagPct: 0.60,  status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 noll: 184.00, antal: 543,  inv: 99912.00,  kurs: 193.80, dagPct: -0.39, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 noll: 188.20, antal: 531,  inv: 99934.20,  kurs: 197.40, dagPct: 0.82,  status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             noll: 336.10, antal: 297,  inv: 99821.70,  kurs: 356.00, dagPct: 0.11,  status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  inv: 99909.90,  kurs: 386.50, dagPct: 1.74,  status: 'LIVE' },
];

const totalInv = 699474.50;

// Calculate P&L
stocks.forEach(s => {
  s.varde  = s.kurs * s.antal;
  s.pl     = s.varde - s.inv;
  s.plPct  = (s.pl / s.inv) * 100;
  s.vsNoll = (s.kurs - s.noll) / s.noll * 100;
});

const totalVarde = stocks.reduce((a, s) => a + s.varde, 0);
const totalPl    = totalVarde - totalInv;
const totalPlPct = (totalPl / totalInv) * 100;

// Best / worst by vsNoll
const sorted  = [...stocks].sort((a, b) => b.vsNoll - a.vsNoll);
const best    = sorted[0];
const worst   = sorted[sorted.length - 1];

// Max bar scale
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

function fmt(n, dec = 2) {
  const sign = n >= 0 ? '+' : '';
  return sign + n.toFixed(dec).replace('.', ',');
}
function fmtSEK(n) {
  const sign = n >= 0 ? '+' : '';
  return sign + Math.round(n).toLocaleString('sv-SE') + ' kr';
}
function fmtPlain(n) {
  return Math.round(n).toLocaleString('sv-SE') + ' kr';
}

// Summary cards
document.getElementById('totalVarde').textContent  = fmtPlain(totalVarde);
const plEl = document.getElementById('totalPl');
plEl.textContent = fmtSEK(totalPl);
plEl.className = 'card-value ' + (totalPl >= 0 ? 'positive' : 'negative');
const plPctEl = document.getElementById('totalPlPct');
plPctEl.textContent = fmt(totalPlPct) + '%';
plPctEl.className = 'card-sub ' + (totalPlPct >= 0 ? 'positive' : 'negative');

document.getElementById('bestStock').textContent  = best.ticker + ' ' + fmt(best.vsNoll) + '%';
document.getElementById('worstStock').textContent = worst.ticker + ' ' + fmt(worst.vsNoll) + '%';

// Table rows
const tbody = document.getElementById('tableBody');
stocks.forEach(s => {
  const barW = Math.round((Math.abs(s.plPct) / maxAbsPlPct) * 80);
  const barColor = s.pl >= 0 ? '#00ff88' : '#ff1744';
  const dagClass = s.dagPct > 0 ? 'positive' : s.dagPct < 0 ? 'negative' : 'neutral';
  const vsClass  = s.vsNoll > 0 ? 'positive' : s.vsNoll < 0 ? 'negative' : 'neutral';
  const plClass  = s.pl >= 0 ? 'positive' : 'negative';
  const badge    = `<span class="badge badge-live">LIVE</span>`;
  const dagStr   = s.dagPct !== null ? fmt(s.dagPct) + '%' : '–';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div><span class="ticker">${s.ticker}</span>${badge}</div>
      <div class="stock-name">${s.name}</div>
    </td>
    <td>${s.noll.toLocaleString('sv-SE', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
    <td>${s.kurs.toLocaleString('sv-SE', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
    <td class="${dagClass}">${dagStr}</td>
    <td class="${vsClass}">${fmt(s.vsNoll)}%</td>
    <td class="${plClass}">${Math.round(s.pl).toLocaleString('sv-SE', {signDisplay:'exceptZero'})}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill" style="width:${barW}px;background:${barColor};"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totRow = document.createElement('tr');
totRow.className = 'total-row';
const totVsNoll = (totalVarde - totalInv) / totalInv * 100; // same as totalPlPct
totRow.innerHTML = `
  <td><span class="ticker">TOTALT</span></td>
  <td>${Math.round(totalInv).toLocaleString('sv-SE')} kr</td>
  <td>${Math.round(totalVarde).toLocaleString('sv-SE')} kr</td>
  <td class="neutral">–</td>
  <td class="${totalPlPct >= 0 ? 'positive' : 'negative'}">${fmt(totalPlPct)}%</td>
  <td class="${totalPl >= 0 ? 'positive' : 'negative'}">${Math.round(totalPl).toLocaleString('sv-SE', {signDisplay:'exceptZero'})}</td>
  <td></td>
`;
tbody.appendChild(totRow);

// Live clock
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('sv-SE');
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
