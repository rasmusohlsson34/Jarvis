<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #a0c8d8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1001;
  }

  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 28px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    padding-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.2);
  }

  .subtitle {
    font-size: 0.85rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.2em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 8px 16px;
    margin-bottom: 24px;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
  }

  .status-dot.amber { background: #ffab00; box-shadow: 0 0 8px #ffab00; }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 8px #ff1744; }

  .status-text { color: #00ff88; }
  .status-right { color: rgba(0,229,255,0.6); }

  /* SUMMARY CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: rgba(0,229,255,0.03);
    border: 1px solid rgba(0,229,255,0.18);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, transparent);
    opacity: 0.4;
  }

  .card-label {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.5rem;
    color: #00e5ff;
    line-height: 1;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 4px;
  }

  .positive { color: #00ff88; }
  .negative { color: #ff1744; }
  .neutral { color: #00e5ff; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    background: rgba(0,229,255,0.06);
    color: rgba(0,229,255,0.7);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.07);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr.total-row {
    background: rgba(0,229,255,0.05);
    border-top: 1px solid rgba(0,229,255,0.25);
    border-bottom: none;
  }

  td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: #00e5ff;
    letter-spacing: 0.08em;
  }

  .stock-name {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.4);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.55rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    margin-left: 6px;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.12);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,171,0,0.12);
    color: #ffab00;
    border: 1px solid rgba(255,171,0,0.3);
  }

  /* BAR */
  .bar-cell { width: 100px; }

  .bar-bg {
    background: rgba(255,255,255,0.04);
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    width: 100px;
    display: inline-block;
    vertical-align: middle;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
  }

  .bar-pos { background: #00ff88; box-shadow: 0 0 4px rgba(0,255,136,0.4); }
  .bar-neg { background: #ff1744; box-shadow: 0 0 4px rgba(255,23,68,0.4); }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.25);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-top: 16px;
    border-top: 1px solid rgba(0,229,255,0.08);
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neutral">699 475 kr</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value neutral" id="cardVarde"></div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Live · Avanza</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest" style="font-size:1.1rem"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <div class="footer">Källa: Avanza · Uppdateras var 15 min mån–fre 09:00–17:30</div>
</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',         baseline: 175.25, count: 570,  invested: 99892.50,  price: 179.30, day: -0.28, live: true },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',     baseline: 135.15, count: 740,  invested: 100011.00, price: 140.45, day:  0.18, live: true },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',     baseline: 224.20, count: 446,  invested: 99993.20,  price: 232.80, day:  0.17, live: true },
  { ticker: 'SEB-A',  name: 'SEB A',               baseline: 184.00, count: 543,  invested: 99912.00,  price: 190.95, day:  0.42, live: true },
  { ticker: 'SEB-C',  name: 'SEB C',               baseline: 188.20, count: 531,  invested: 99934.20,  price: 194.00, day:  0.21, live: true },
  { ticker: 'SWED-A', name: 'Swedbank A',           baseline: 336.10, count: 297,  invested: 99821.70,  price: 356.60, day:  1.02, live: true },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  baseline: 358.10, count: 279,  invested: 99909.90,  price: 385.10, day:  2.01, live: true },
];

const UPDATE_TIME = '10:18:38';
const UPDATE_DATE = '2026-06-25';
const TOTAL_INVESTED = 699474.50;

function fmt(n, decimals=0) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function signStr(n, decimals=2) {
  const s = Math.abs(n).toFixed(decimals);
  return (n >= 0 ? '+' : '−') + s.replace('.', ',');
}

function colorClass(n) { return n >= 0 ? 'positive' : 'negative'; }

// Compute per-stock
const computed = STOCKS.map(s => {
  const varde = s.price * s.count;
  const pl = varde - s.invested;
  const plPct = (pl / s.invested) * 100;
  const vsNull = ((s.price - s.baseline) / s.baseline) * 100;
  return { ...s, varde, pl, plPct, vsNull };
});

const totalVarde = computed.reduce((a, s) => a + s.varde, 0);
const totalPl = totalVarde - TOTAL_INVESTED;
const totalPlPct = (totalPl / TOTAL_INVESTED) * 100;
const totalVsNull = ((totalVarde - TOTAL_INVESTED) / TOTAL_INVESTED) * 100;

const liveCount = computed.filter(s => s.live).length;
const maxAbsPlPct = Math.max(...computed.map(s => Math.abs(s.plPct)));

// Best / Worst by vsNull
const sorted = [...computed].sort((a, b) => b.vsNull - a.vsNull);
const best = sorted[0];
const worst = sorted[sorted.length - 1];

// Status dot
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  dot.className = 'status-dot';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
  statusText.className = 'status-text positive';
} else if (liveCount === 0) {
  dot.className = 'status-dot red';
  statusText.textContent = '0/7 live · ' + UPDATE_DATE;
  statusText.className = 'status-text negative';
} else {
  dot.className = 'status-dot amber';
  statusText.textContent = liveCount + '/7 live · ' + UPDATE_DATE;
  statusText.className = 'status-text';
  statusText.style.color = '#ffab00';
}

// Update time
document.getElementById('updateTime').textContent = UPDATE_TIME;

// Cards
document.getElementById('cardVarde').textContent = fmt(totalVarde) + ' kr';

const plEl = document.getElementById('cardPl');
plEl.textContent = (totalPl >= 0 ? '+' : '') + fmt(Math.round(totalPl)) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);

const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = signStr(totalPlPct) + ' % vs nollpunkt';
plPctEl.className = colorClass(totalPl);

document.getElementById('cardBest').innerHTML =
  '<span class="positive">' + best.ticker + ' ' + signStr(best.vsNull) + '%</span>';
document.getElementById('cardWorst').innerHTML =
  '<span class="' + colorClass(worst.vsNull) + '">' + worst.ticker + ' ' + signStr(worst.vsNull) + '%</span>';

// Table body
const tbody = document.getElementById('tableBody');

computed.forEach(s => {
  const badge = s.live
    ? '<span class="badge badge-live">LIVE</span>'
    : '<span class="badge badge-fallback">' + UPDATE_DATE + '</span>';

  const dayStr = s.day != null ? (s.day >= 0 ? '+' : '') + s.day.toFixed(2).replace('.', ',') + '%' : '–';
  const dayClass = s.day != null ? colorClass(s.day) : '';

  const barWidth = maxAbsPlPct > 0 ? Math.round((Math.abs(s.plPct) / maxAbsPlPct) * 100) : 0;
  const barClass = s.pl >= 0 ? 'bar-pos' : 'bar-neg';

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker">${s.ticker}${badge}</div>
      <div class="stock-name">${s.name}</div>
    </td>
    <td>${s.baseline.toFixed(2).replace('.', ',')} SEK</td>
    <td class="neutral">${s.price.toFixed(2).replace('.', ',')} SEK</td>
    <td class="${dayClass}">${dayStr}</td>
    <td class="${colorClass(s.vsNull)}">${signStr(s.vsNull)} %</td>
    <td class="${colorClass(s.pl)}">${(s.pl >= 0 ? '+' : '') + fmt(Math.round(s.pl))} kr</td>
    <td class="bar-cell">
      <div class="bar-bg"><div class="bar-fill ${barClass}" style="width:${barWidth}%"></div></div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
totalTr.innerHTML = `
  <td><div class="ticker" style="color:#00e5ff">TOTALT</div></td>
  <td class="neutral">${fmt(TOTAL_INVESTED)} kr</td>
  <td class="neutral">${fmt(Math.round(totalVarde))} kr</td>
  <td>–</td>
  <td class="${colorClass(totalVsNull)}">${signStr(totalVsNull)} %</td>
  <td class="${colorClass(totalPl)}">${(totalPl >= 0 ? '+' : '') + fmt(Math.round(totalPl))} kr</td>
  <td></td>
`;
tbody.appendChild(totalTr);

// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('updateTime').textContent = now.toLocaleTimeString('sv-SE');
}
setInterval(updateClock, 1000);
</script>
</body>
</html>
