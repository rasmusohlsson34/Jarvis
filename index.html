<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminal</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #c8e8f0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 2px,
      rgba(0,229,255,0.015) 2px 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 101;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 32px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 28px 0 20px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    margin-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 3rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.25em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.2);
  }

  .subtitle {
    color: rgba(0,229,255,0.6);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 8px 18px;
    margin-bottom: 20px;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }

  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
  .status-dot.red   { background: #ff1744; box-shadow: 0 0 6px #ff1744; }

  .status-right { color: rgba(0,229,255,0.5); }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00e5ff, transparent);
    opacity: 0.4;
  }

  .card-label {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 1.5rem;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    color: #00e5ff;
  }

  .card-sub {
    font-size: 0.78rem;
    margin-top: 4px;
    color: rgba(0,229,255,0.5);
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.15);
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead {
    background: rgba(0,229,255,0.08);
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  th {
    padding: 10px 14px;
    text-align: right;
    color: rgba(0,229,255,0.6);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 400;
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }

  tbody tr:hover {
    background: rgba(0,229,255,0.04);
  }

  tbody tr.total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.2);
    font-family: 'Orbitron', monospace;
    font-size: 0.78rem;
  }

  td {
    padding: 12px 14px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.88rem;
    font-weight: 700;
    color: #00e5ff;
    letter-spacing: 0.05em;
  }

  .company-name {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.4);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.58rem;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 6px;
    letter-spacing: 0.08em;
    vertical-align: middle;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.3);
  }

  /* Bar cell */
  .bar-cell { min-width: 100px; }

  .bar-track {
    background: rgba(255,255,255,0.05);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    width: 100%;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  .bar-fill.pos { background: #00ff88; }
  .bar-fill.neg { background: #ff1744; }

  footer {
    text-align: center;
    padding: 14px;
    color: rgba(0,229,255,0.3);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    border-top: 1px solid rgba(0,229,255,0.1);
  }

  .clock {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    color: #00e5ff;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen · Live Portföljövervakning</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span class="clock" id="updateTime">08:09:01</span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699 475 kr</div>
      <div class="card-sub">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPL"></div>
      <div class="card-sub" id="cardPLPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest" style="font-size:1rem;"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="mainTable">
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>KÄLLA: Avanza &nbsp;·&nbsp; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</footer>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const STOCKS = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  kurs: 182.8,  dagPct: -1.06, live: true },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',      noll: 135.15, antal: 740,  inv: 100011.00, kurs: 141.85, dagPct: -0.18, live: true },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',      noll: 224.20, antal: 446,  inv: 99993.20,  kurs: 235.0,  dagPct: -0.34, live: true },
  { ticker: 'SEB-A',  name: 'SEB A',                noll: 184.00, antal: 543,  inv: 99912.00,  kurs: 194.45, dagPct: -0.59, live: true },
  { ticker: 'SEB-C',  name: 'SEB C',                noll: 188.20, antal: 531,  inv: 99934.20,  kurs: 197.2,  dagPct: -0.50, live: true },
  { ticker: 'SWED-A', name: 'Swedbank A',            noll: 336.10, antal: 297,  inv: 99821.70,  kurs: 359.7,  dagPct: -0.22, live: true },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',  noll: 358.10, antal: 279,  inv: 99909.90,  kurs: 382.1,  dagPct: -1.22, live: true },
];

const TOTAL_INV = 699474.50;

// ── CALCULATIONS ──────────────────────────────────────────────────────────────
STOCKS.forEach(s => {
  s.varde  = s.kurs * s.antal;
  s.pl     = s.varde - s.inv;
  s.plPct  = (s.pl / s.inv) * 100;
  s.vsNoll = ((s.kurs - s.noll) / s.noll) * 100;
});

const totalVarde  = STOCKS.reduce((a, s) => a + s.varde, 0);
const totalPL     = totalVarde - TOTAL_INV;
const totalPLPct  = (totalPL / TOTAL_INV) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INV) / TOTAL_INV) * 100;
const liveCount   = STOCKS.filter(s => s.live).length;

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt = (n, dec=2) => n.toLocaleString('sv-SE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtInt = n => Math.round(n).toLocaleString('sv-SE');
const sign = n => n >= 0 ? '+' : '';
const cls  = n => n >= 0 ? 'pos' : 'neg';

// ── STATUS BAR ────────────────────────────────────────────────────────────────
const dot  = document.getElementById('statusDot');
const stxt = document.getElementById('statusText');
if (liveCount === 7) {
  dot.className = 'status-dot';
  stxt.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.className = 'status-dot red';
  stxt.textContent = '0/7 live · Fallback-kurser';
} else {
  dot.className = 'status-dot amber';
  stxt.textContent = liveCount + '/7 live · 2026-06-23';
}

// ── SUMMARY CARDS ─────────────────────────────────────────────────────────────
document.getElementById('cardVarde').innerHTML =
  '<span>' + fmtInt(totalVarde) + ' kr</span>';

const plEl = document.getElementById('cardPL');
plEl.innerHTML = '<span class="' + cls(totalPL) + '">' + sign(totalPL) + fmtInt(totalPL) + ' kr</span>';

document.getElementById('cardPLPct').innerHTML =
  '<span class="' + cls(totalPLPct) + '">' + sign(totalPLPct) + fmt(totalPLPct) + '%</span> vs nollpunkt';

// Best / worst by vsNoll
const sorted = [...STOCKS].sort((a, b) => b.vsNoll - a.vsNoll);
const best  = sorted[0];
const worst = sorted[sorted.length - 1];
document.getElementById('cardBest').innerHTML =
  '<span class="pos">' + best.ticker + ' ' + sign(best.vsNoll) + fmt(best.vsNoll) + '%</span>';
document.getElementById('cardWorst').innerHTML =
  'Sämst: <span class="neg">' + worst.ticker + ' ' + sign(worst.vsNoll) + fmt(worst.vsNoll) + '%</span>';

// ── TABLE ─────────────────────────────────────────────────────────────────────
const maxAbsPlPct = Math.max(...STOCKS.map(s => Math.abs(s.plPct)));
const tbody = document.getElementById('tableBody');

STOCKS.forEach(s => {
  const barW = Math.min(100, (Math.abs(s.plPct) / maxAbsPlPct) * 100);
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <div class="ticker-name">${s.ticker}<span class="badge ${s.live ? 'badge-live' : 'badge-fallback'}">${s.live ? 'LIVE' : '2026-06-23'}</span></div>
      <div class="company-name">${s.name}</div>
    </td>
    <td>${fmt(s.noll)}</td>
    <td>${fmt(s.kurs)}</td>
    <td class="${cls(s.dagPct)}">${sign(s.dagPct)}${fmt(s.dagPct)}%</td>
    <td class="${cls(s.vsNoll)}">${sign(s.vsNoll)}${fmt(s.vsNoll)}%</td>
    <td class="${cls(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill ${cls(s.pl)}" style="width:${barW}%"></div>
      </div>
    </td>`;
  tbody.appendChild(tr);
});

// Total row
const totalRow = document.createElement('tr');
totalRow.className = 'total-row';
totalRow.innerHTML = `
  <td><span class="ticker-name">TOTALT</span></td>
  <td>${fmtInt(TOTAL_INV)}</td>
  <td>${fmtInt(totalVarde)}</td>
  <td>—</td>
  <td class="${cls(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)}%</td>
  <td class="${cls(totalPL)}">${sign(totalPL)}${fmtInt(totalPL)}</td>
  <td></td>`;
tbody.appendChild(totalRow);

// ── LIVE CLOCK ────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('updateTime').textContent =
    new Date().toLocaleTimeString('sv-SE');
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
