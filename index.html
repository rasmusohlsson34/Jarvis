<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #b0d4e0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 9998;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 9997;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.25em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.78rem;
    color: rgba(0,229,255,0.55);
    letter-spacing: 0.18em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.78rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
    flex-shrink: 0;
  }

  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 6px #ff1744; }

  .status-right {
    color: rgba(0,229,255,0.6);
  }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.18);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.65rem;
    color: rgba(0,229,255,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.4rem;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
  }

  .card-sub {
    font-size: 0.75rem;
    color: rgba(0,229,255,0.45);
    margin-top: 2px;
  }

  .positive { color: #00ff88; }
  .negative { color: #ff1744; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  th {
    background: rgba(0,229,255,0.08);
    color: rgba(0,229,255,0.6);
    font-weight: normal;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.68rem;
    padding: 10px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(0,229,255,0.2);
    white-space: nowrap;
  }

  th:first-child { text-align: left; }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(0,229,255,0.07);
    text-align: right;
    vertical-align: middle;
  }

  td:first-child { text-align: left; }

  tr:hover td {
    background: rgba(0,229,255,0.035);
  }

  .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    color: #00e5ff;
    font-weight: 700;
    display: block;
  }

  .stock-name {
    font-size: 0.68rem;
    color: rgba(0,229,255,0.4);
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.58rem;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.05em;
    margin-left: 6px;
    vertical-align: middle;
    font-family: 'Share Tech Mono', monospace;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,170,0,0.15);
    color: #ffaa00;
    border: 1px solid rgba(255,170,0,0.3);
  }

  /* Bar cell */
  .bar-cell {
    width: 100px;
    padding-right: 16px;
  }

  .bar-track {
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    height: 8px;
    overflow: hidden;
    min-width: 60px;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  .bar-fill.pos { background: #00ff88; box-shadow: 0 0 4px rgba(0,255,136,0.4); }
  .bar-fill.neg { background: #ff1744; box-shadow: 0 0 4px rgba(255,23,68,0.4); }

  /* Total row */
  .total-row td {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.25);
    border-bottom: none;
    font-size: 0.82rem;
    color: #00e5ff;
  }

  .total-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.68rem;
    color: rgba(0,229,255,0.7);
    letter-spacing: 0.1em;
  }

  /* Footer */
  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.65rem;
    color: rgba(0,229,255,0.3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-top: 1px solid rgba(0,229,255,0.1);
    padding-top: 14px;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right">Uppdaterad: <span id="updateTime"></span></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475&nbsp;kr</div>
      <div class="card-sub">Nollpunkt: 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portfölj��£7lj�vervakning</div>
      <div class="card-value" id="cardVarde"></div>
      <div class="card-sub">7 bankaktier</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl"></div>
      <div class="card-sub" id="cardPlPct"></div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest"></div>
      <div class="card-sub" id="cardWorst"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag %</th>
          <th>Vs Noll %</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">
    Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30
  </div>
</div>

<script>
const STOCKS = [
  { ticker: 'NDA-SE',  name: 'Nordea Bank',          nollkurs: 175.25, antal: 570,  investerat: 99892.50,  price: 179.70, dayPct: -0.06, live: true },
  { ticker: 'SHB-A',   name: 'Handelsbanken A',       nollkurs: 135.15, antal: 740,  investerat: 100011.00, price: 140.65, dayPct:  0.32, live: true },
  { ticker: 'SHB-B',   name: 'Handelsbanken B',       nollkurs: 224.20, antal: 446,  investerat: 99993.20,  price: 233.40, dayPct:  0.43, live: true },
  { ticker: 'SEB-A',   name: 'SEB A',                 nollkurs: 184.00, antal: 543,  investerat: 99912.00,  price: 191.10, dayPct:  0.50, live: true },
  { ticker: 'SEB-C',   name: 'SEB C',                 nollkurs: 188.20, antal: 531,  investerat: 99934.20,  price: 193.80, dayPct:  0.10, live: true },
  { ticker: 'SWED-A',  name: 'Swedbank A',            nollkurs: 336.10, antal: 297,  investerat: 99821.70,  price: 356.40, dayPct:  0.96, live: true },
  { ticker: 'AZA',     name: 'Avanza Bank Holding',   nollkurs: 358.10, antal: 279,  investerat: 99909.90,  price: 386.20, dayPct:  2.30, live: true },
];

const TOTAL_INVESTERAT = 699474.50;
const UPDATE_TIME = '13:35';
const UPDATE_DATE = '2026-06-25';

function fmt(n, decimals = 2) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtInt(n) {
  return n.toLocaleString('sv-SE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function sign(n) { return n >= 0 ? '+' : ''; }

function colorClass(n) { return n >= 0 ? 'positive' : 'negative'; }

// Compute P&L
const computed = STOCKS.map(s => {
  const varde = s.price * s.antal;
  const pl = varde - s.investerat;
  const plPct = (pl / s.investerat) * 100;
  const vsNoll = ((s.price - s.nollkurs) / s.nollkurs) * 100;
  return { ...s, varde, pl, plPct, vsNoll };
});

const totalVarde = computed.reduce((acc, s) => acc + s.varde, 0);
const totalPl = totalVarde - TOTAL_INVESTERAT;
const totalPlPct = (totalPl / TOTAL_INVESTERAT) * 100;
const totalVsNoll = ((totalVarde - TOTAL_INVESTERAT) / TOTAL_INVESTERAT) * 100;

// Best / worst by vsNoll
const sorted = [...computed].sort((a, b) => b.vsNoll - a.vsNoll);
const best = sorted[0];
const worst = sorted[sorted.length - 1];

// Live count
const liveCount = computed.filter(s => s.live).length;

// Status
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
if (liveCount === 7) {
  statusDot.className = 'status-dot';
  statusText.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount > 0) {
  statusDot.className = 'status-dot amber';
  statusText.textContent = `${liveCount}/7 live · ${UPDATE_DATE}`;
} else {
  statusDot.className = 'status-dot red';
  statusText.textContent = `0/7 live · Fallback-kurser`;
}

document.getElementById('updateTime').textContent = UPDATE_TIME;

// Cards
document.getElementById('cardVarde').textContent = fmtInt(totalVarde) + ' kr';
const plEl = document.getElementById('cardPl');
plEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
plEl.className = 'card-value ' + colorClass(totalPl);
const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + '% vs nollpunkt';
plPctEl.className = 'card-sub ' + colorClass(totalPl);

const bestEl = document.getElementById('cardBest');
bestEl.innerHTML = `<span class="positive">${best.ticker} ${sign(best.vsNoll)}${fmt(best.vsNoll)}%</span>`;
const worstEl = document.getElementById('cardWorst');
worstEl.innerHTML = `<span class="${colorClass(worst.vsNoll)}">${worst.ticker} ${sign(worst.vsNoll)}${fmt(worst.vsNoll)}%</span>`;

// Max |plPct| for bar scaling
const maxAbsPlPct = Math.max(...computed.map(s => Math.abs(s.plPct)));

// Table
const tbody = document.getElementById('tableBody');

computed.forEach(s => {
  const barPct = maxAbsPlPct > 0 ? Math.abs(s.plPct) / maxAbsPlPct * 100 : 0;
  const barClass = s.pl >= 0 ? 'pos' : 'neg';
  const dayStr = s.dayPct !== null ? `<span class="${colorClass(s.dayPct)}">${sign(s.dayPct)}${fmt(s.dayPct)}%</span>` : '–';
  const badge = s.live
    ? `<span class="badge badge-live">LIVE</span>`
    : `<span class="badge badge-fallback">FALLBACK</span>`;

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <span class="ticker">${s.ticker}${badge}</span>
      <span class="stock-name">${s.name}</span>
    </td>
    <td>${fmt(s.nollkurs)}</td>
    <td>${fmt(s.price)}</td>
    <td>${dayStr}</td>
    <td class="${colorClass(s.vsNoll)}">${sign(s.vsNoll)}${fmt(s.vsNoll)}%</td>
    <td class="${colorClass(s.pl)}">${sign(s.pl)}${fmtInt(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill ${barClass}" style="width:${barPct.toFixed(1)}%"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalRow = document.createElement('tr');
totalRow.className = 'total-row';
totalRow.innerHTML = `
  <td><span class="total-label">TOTALT</span></td>
  <td class="positive">${fmtInt(TOTAL_INVESTERAT)}</td>
  <td class="positive">${fmtInt(totalVarde)}</td>
  <td>–</td>
  <td class="${colorClass(totalVsNoll)}">${sign(totalVsNoll)}${fmt(totalVsNoll)}%</td>
  <td class="${colorClass(totalPl)}">${sign(totalPl)}${fmtInt(totalPl)}</td>
  <td></td>
`;
tbody.appendChild(totalRow);

// Live clock
function updateClock() {
  const now = new Date();
  document.getElementById('updateTime').textContent = now.toLocaleTimeString('sv-SE');
}
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
