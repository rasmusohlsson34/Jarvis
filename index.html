<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050c12; color: #a0c8d8; font-family: 'Share Tech Mono', monospace; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px); pointer-events: none; z-index: 1000; }
  body::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%); pointer-events: none; z-index: 999; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px 40px; }
  .header { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid rgba(0,229,255,0.2); }
  .logo { font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900; color: #00e5ff; letter-spacing: 0.25em; text-shadow: 0 0 20px rgba(0,229,255,0.5); line-height: 1; }
  .subtitle { font-size: 0.85rem; color: rgba(0,229,255,0.5); letter-spacing: 0.2em; margin-top: 6px; text-transform: uppercase; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,229,255,0.04); border: 1px solid rgba(0,229,255,0.15); border-radius: 4px; padding: 8px 16px; margin-bottom: 24px; font-size: 0.8rem; }
  .status-left { display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 6px #00ff88; }
  .status-dot.amber { background: #ffaa00; box-shadow: 0 0 6px #ffaa00; }
  .status-dot.red { background: #ff1744; box-shadow: 0 0 6px #ff1744; }
  .status-right { color: rgba(0,229,255,0.6); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .card { background: rgba(0,229,255,0.04); border: 1px solid rgba(0,229,255,0.2); border-radius: 6px; padding: 16px; }
  .card-label { font-size: 0.7rem; color: rgba(0,229,255,0.5); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .card-value { font-size: 1.4rem; font-weight: bold; color: #00e5ff; }
  .card-sub { font-size: 0.75rem; margin-top: 4px; }
  .positive { color: #00ff88; }
  .negative { color: #ff1744; }
  .neutral { color: #00e5ff; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; color: rgba(0,229,255,0.5); text-transform: uppercase; border-bottom: 1px solid rgba(0,229,255,0.25); padding: 10px 12px; text-align: right; white-space: nowrap; }
  thead th:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid rgba(0,229,255,0.07); }
  tbody tr:hover { background: rgba(0,229,255,0.03); }
  tbody td { padding: 12px 12px; text-align: right; vertical-align: middle; }
  tbody td:first-child { text-align: left; }
  .ticker { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: #00e5ff; }
  .badge { display: inline-block; font-size: 0.6rem; font-family: 'Share Tech Mono', monospace; padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: middle; letter-spacing: 0.05em; }
  .badge-live { background: rgba(0,255,136,0.15); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
  .badge-fallback { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
  .stock-name { font-size: 0.7rem; color: rgba(160,200,216,0.5); margin-top: 2px; }
  .bar-cell { width: 120px; }
  .bar-track { background: rgba(255,255,255,0.05); border-radius: 2px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .bar-fill.pos { background: #00ff88; }
  .bar-fill.neg { background: #ff1744; }
  .total-row td { border-top: 1px solid rgba(0,229,255,0.3); font-weight: bold; color: #00e5ff; padding-top: 14px; }
  .footer { margin-top: 32px; text-align: center; font-size: 0.7rem; color: rgba(0,229,255,0.25); letter-spacing: 0.1em; border-top: 1px solid rgba(0,229,255,0.1); padding-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>
  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText"></span>
    </div>
    <div class="status-right" id="clockDisplay"></div>
  </div>
  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value neutral">699&nbsp;475 kr</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value neutral" id="totalVardeCard">—</div>
      <div class="card-sub" style="color:rgba(0,229,255,0.4)">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="totalPlCard">—</div>
      <div class="card-sub" id="totalPlPctCard">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="bestCard" style="font-size:1rem">—</div>
      <div class="card-sub" id="worstCard">—</div>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="text-align:left">Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell">Graf</th>
        </tr>
      </thead>
      <tbody id="stockTable"></tbody>
    </table>
  </div>
  <div class="footer">KÄLLA: Avanza &middot; UPPDATERAS VAR 15 MIN MÅN–FRE 09:00–17:30</div>
</div>
<script>
const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',         nollkurs: 175.25, antal: 570, investerat: 99892.50,  kurs: 180.45, dagPct: 0.42, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',     nollkurs: 135.15, antal: 740, investerat: 100011.00, kurs: 139.15, dagPct: 0.43, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',     nollkurs: 224.20, antal: 446, investerat: 99993.20,  kurs: 232.40, dagPct: 0.43, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',               nollkurs: 184.00, antal: 543, investerat: 99912.00,  kurs: 193.20, dagPct: 0.23, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',               nollkurs: 188.20, antal: 531, investerat: 99934.20,  kurs: 198.80, dagPct: 0.40, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',           nollkurs: 336.10, antal: 297, investerat: 99821.70,  kurs: 348.30, dagPct: 0.72, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding', nollkurs: 358.10, antal: 279, investerat: 99909.90,  kurs: 388.80, dagPct: 1.33, status: 'LIVE' },
];
const TOTAL_INVESTERAT = 699474.50;
const UPDATE_TIME = new Date();
stocks.forEach(s => {
  s.varde  = s.kurs * s.antal;
  s.pl     = s.varde - s.investerat;
  s.plPct  = (s.pl / s.investerat) * 100;
  s.vsNoll = ((s.kurs - s.nollkurs) / s.nollkurs) * 100;
});
const totalVarde = stocks.reduce((a,s) => a + s.varde, 0);
const totalPl    = totalVarde - TOTAL_INVESTERAT;
const totalPlPct = (totalPl / TOTAL_INVESTERAT) * 100;
const totalVsNoll = totalPlPct;
const maxAbsPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));
const liveCount = stocks.filter(s => s.status === 'LIVE').length;
const sorted = [...stocks].sort((a,b) => b.vsNoll - a.vsNoll);
const best = sorted[0], worst = sorted[sorted.length-1];
const fmt = (n,dec=2) => (n>=0?'+':'') + n.toFixed(dec).replace('.',',');
const fmtSEK = n => (n>=0?'+':'') + Math.round(n).toLocaleString('sv-SE') + ' kr';
const fmtKr  = n => Math.round(n).toLocaleString('sv-SE') + ' kr';
const dot = document.getElementById('statusDot');
const stxt = document.getElementById('statusText');
if (liveCount === 7) { stxt.textContent = '7/7 live · Stockholmsbörsen'; }
else if (liveCount === 0) { dot.classList.add('red'); stxt.textContent = '0/7 live · Fallback-kurser används'; }
else { dot.classList.add('amber'); stxt.textContent = liveCount+'/7 live · 16 jun 2026'; }
function tick() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent = 'Nu: ' + now.toLocaleTimeString('sv-SE') + '  ·  Uppdaterad: ' + UPDATE_TIME.toLocaleTimeString('sv-SE');
}
tick(); setInterval(tick, 1000);
document.getElementById('totalVardeCard').textContent = fmtKr(totalVarde);
const plCard = document.getElementById('totalPlCard');
plCard.textContent = fmtSEK(totalPl);
plCard.className = 'card-value ' + (totalPl >= 0 ? 'positive' : 'negative');
const plPctCard = document.getElementById('totalPlPctCard');
plPctCard.textContent = fmt(totalPlPct) + '%  vs nollpunkt';
plPctCard.className = totalPl >= 0 ? 'positive' : 'negative';
document.getElementById('bestCard').innerHTML = '<span class="positive">'+best.ticker+' '+fmt(best.vsNoll)+'%</span>';
document.getElementById('worstCard').innerHTML = '<span class="'+(worst.vsNoll<0?'negative':'positive')+'">'+worst.ticker+' '+fmt(worst.vsNoll)+'%</span>';
const tbody = document.getElementById('stockTable');
stocks.forEach(s => {
  const barPct = Math.abs(s.plPct) / maxAbsPlPct * 100;
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td><span class="ticker">'+s.ticker+'</span><span class="badge badge-'+(s.status==='LIVE'?'live">LIVE':'fallback">16 jun')+'</span><div class="stock-name">'+s.name+'</div></td>'+
    '<td>'+s.nollkurs.toLocaleString('sv-SE',{minimumFractionDigits:2})+' kr</td>'+
    '<td>'+s.kurs.toLocaleString('sv-SE',{minimumFractionDigits:2})+' kr</td>'+
    '<td class="'+(s.dagPct>=0?'positive':'negative')+'">'+fmt(s.dagPct)+'%</td>'+
    '<td class="'+(s.vsNoll>=0?'positive':'negative')+'">'+fmt(s.vsNoll)+'%</td>'+
    '<td class="'+(s.pl>=0?'positive':'negative')+'">'+fmtSEK(s.pl)+'</td>'+
    '<td class="bar-cell"><div class="bar-track"><div class="bar-fill '+(s.pl>=0?'pos':'neg')+'" style="width:'+barPct.toFixed(1)+'%"></div></div></td>';
  tbody.appendChild(tr);
});
const trow = document.createElement('tr');
trow.className = 'total-row';
trow.innerHTML =
  '<td><span class="ticker">TOTALT</span></td>'+
  '<td>'+fmtKr(TOTAL_INVESTERAT)+'</td>'+
  '<td>'+fmtKr(totalVarde)+'</td>'+
  '<td>–</td>'+
  '<td class="'+(totalVsNoll>=0?'positive':'negative')+'">'+fmt(totalVsNoll)+'%</td>'+
  '<td class="'+(totalPl>=0?'positive':'negative')+'">'+fmtSEK(totalPl)+'</td>'+
  '<td></td>';
tbody.appendChild(trow);
</script>
</body>
</html>
