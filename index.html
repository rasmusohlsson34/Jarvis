<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Bankterminalen</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050c12;
    color: #b0d8e8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent 2px, rgba(0,229,255,0.015) 2px 4px);
    pointer-events: none;
    z-index: 1000;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1001;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00e5ff;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
  }

  .subtitle {
    font-size: 0.85rem;
    color: #4a8fa8;
    letter-spacing: 0.2em;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 4px;
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 0.78rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px rgba(0,255,136,0.8);
  }

  .status-dot.amber { background: #ffb300; box-shadow: 0 0 6px rgba(255,179,0,0.8); }
  .status-dot.red   { background: #ff1744; box-shadow: 0 0 6px rgba(255,23,68,0.8); }

  .status-text { color: #00e5ff; }
  .status-right { color: #4a8fa8; }

  /* Summary cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .card-label {
    font-size: 0.68rem;
    color: #4a8fa8;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-value {
    font-size: 1.25rem;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
  }

  .card-sub {
    font-size: 0.75rem;
    margin-top: 2px;
  }

  .pos { color: #00ff88; }
  .neg { color: #ff1744; }
  .neutral { color: #b0d8e8; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(0,229,255,0.12);
    border-radius: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead th {
    background: rgba(0,229,255,0.07);
    color: #4a8fa8;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 12px;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid rgba(0,229,255,0.12);
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(0,229,255,0.06);
  }

  tbody tr:hover { background: rgba(0,229,255,0.03); }

  tbody tr.total-row {
    background: rgba(0,229,255,0.06);
    border-top: 1px solid rgba(0,229,255,0.2);
  }

  td {
    padding: 10px 12px;
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }

  td:first-child { text-align: left; }

  .ticker {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: #00e5ff;
    display: block;
  }

  .stock-name {
    font-size: 0.65rem;
    color: #4a8fa8;
    display: block;
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.05em;
  }

  .badge-live {
    background: rgba(0,255,136,0.15);
    color: #00ff88;
    border: 1px solid rgba(0,255,136,0.3);
  }

  .badge-fallback {
    background: rgba(255,179,0,0.15);
    color: #ffb300;
    border: 1px solid rgba(255,179,0,0.3);
  }

  /* Bar cell */
  .bar-cell { width: 100px; }

  .bar-track {
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    height: 8px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
  }

  .bar-pos { background: #00ff88; }
  .bar-neg { background: #ff1744; }

  /* Total row */
  .total-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: #00e5ff;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.65rem;
    color: #2a5a6a;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="subtitle">Bankterminalen &middot; Live Portföljövervakning</div>
  </div>

  <div class="statusbar">
    <div class="status-left">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText"></span>
    </div>
    <div class="status-right" id="statusRight"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label">Investerat</div>
      <div class="card-value">699&nbsp;475&nbsp;kr</div>
      <div class="card-sub neutral">Nollpunkt 9 jun 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Portföljvärde</div>
      <div class="card-value" id="cardVarde">—</div>
      <div class="card-sub neutral">Aktuellt marknadsvärde</div>
    </div>
    <div class="card">
      <div class="card-label">Total P&amp;L</div>
      <div class="card-value" id="cardPl">—</div>
      <div class="card-sub" id="cardPlPct">—</div>
    </div>
    <div class="card">
      <div class="card-label">Bäst / Sämst</div>
      <div class="card-value" id="cardBest">—</div>
      <div class="card-sub" id="cardWorst">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Nollkurs</th>
          <th>Kurs</th>
          <th>Dag%</th>
          <th>Vs noll%</th>
          <th>P&amp;L (SEK)</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer">
    Källa: Avanza &middot; Uppdateras var 15 min mån–fre 09:00–17:30
  </div>

</div>

<script>
const INVESTED = 699474.50;

const stocks = [
  { ticker: 'NDA-SE', name: 'Nordea Bank',          noll: 175.25, antal: 570,  inv: 99892.50,  kurs: 179.00, dagPct: -0.39, status: 'LIVE' },
  { ticker: 'SHB-A',  name: 'Handelsbanken A',       noll: 135.15, antal: 740,  inv: 100011.00, kurs: 138.95, dagPct:  0.29, status: 'LIVE' },
  { ticker: 'SHB-B',  name: 'Handelsbanken B',       noll: 224.20, antal: 446,  inv: 99993.20,  kurs: 230.80, dagPct: -0.26, status: 'LIVE' },
  { ticker: 'SEB-A',  name: 'SEB A',                 noll: 184.00, antal: 543,  inv: 99912.00,  kurs: 192.55, dagPct: -0.10, status: 'LIVE' },
  { ticker: 'SEB-C',  name: 'SEB C',                 noll: 188.20, antal: 531,  inv: 99934.20,  kurs: 198.20, dagPct:  0.10, status: 'LIVE' },
  { ticker: 'SWED-A', name: 'Swedbank A',             noll: 336.10, antal: 297,  inv: 99821.70,  kurs: 346.80, dagPct:  0.29, status: 'LIVE' },
  { ticker: 'AZA',    name: 'Avanza Bank Holding',   noll: 358.10, antal: 279,  inv: 99909.90,  kurs: 383.60, dagPct: -0.03, status: 'LIVE' },
];

const fmt = (n, dec=2) => n.toLocaleString('sv-SE', {minimumFractionDigits: dec, maximumFractionDigits: dec});
const fmtInt = n => Math.round(n).toLocaleString('sv-SE');
const sign = n => n >= 0 ? '+' : '';

// Compute per-stock
let totalVarde = 0;
let totalPl    = 0;
stocks.forEach(s => {
  s.varde   = s.kurs * s.antal;
  s.pl      = s.varde - s.inv;
  s.plPct   = s.pl / s.inv * 100;
  s.vsNoll  = (s.kurs - s.noll) / s.noll * 100;
  totalVarde += s.varde;
  totalPl    += s.pl;
});
const totalPlPct   = totalPl / INVESTED * 100;
const totalVsNoll  = (totalVarde - INVESTED) / INVESTED * 100;

// Max |plPct| for bar scaling
const maxPlPct = Math.max(...stocks.map(s => Math.abs(s.plPct)));

// Summary cards
const liveCount = stocks.filter(s => s.status === 'LIVE').length;

document.getElementById('cardVarde').textContent = fmtInt(totalVarde) + ' kr';

const plEl = document.getElementById('cardPl');
plEl.textContent = sign(totalPl) + fmtInt(totalPl) + ' kr';
plEl.className = 'card-value ' + (totalPl >= 0 ? 'pos' : 'neg');

const plPctEl = document.getElementById('cardPlPct');
plPctEl.textContent = sign(totalPlPct) + fmt(totalPlPct) + '%';
plPctEl.className = 'card-sub ' + (totalPlPct >= 0 ? 'pos' : 'neg');

// Best/Worst by vsNoll%
const sorted = [...stocks].sort((a,b) => b.vsNoll - a.vsNoll);
const best = sorted[0], worst = sorted[sorted.length-1];
const bestEl = document.getElementById('cardBest');
bestEl.innerHTML = `<span class="pos">${best.ticker} ${sign(best.vsNoll)}${fmt(best.vsNoll)}%</span>`;
const worstEl = document.getElementById('cardWorst');
worstEl.innerHTML = `<span class="${worst.vsNoll >= 0 ? 'pos' : 'neg'}">${worst.ticker} ${sign(worst.vsNoll)}${fmt(worst.vsNoll)}%</span>`;

// Status bar
const dot = document.getElementById('statusDot');
const txt = document.getElementById('statusText');
if (liveCount === 7) {
  dot.className = 'status-dot';
  txt.textContent = '7/7 live · Stockholmsbörsen';
} else if (liveCount === 0) {
  dot.className = 'status-dot red';
  txt.textContent = '0/7 live · Fallback-kurser används';
} else {
  dot.className = 'status-dot amber';
  txt.textContent = liveCount + '/7 live · 16 jun 2026';
}

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('statusRight').textContent =
    'Uppdaterad: ' + now.toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
updateClock();
setInterval(updateClock, 1000);

// Table
const tbody = document.getElementById('tableBody');

stocks.forEach(s => {
  const tr = document.createElement('tr');
  const barPct = maxPlPct > 0 ? Math.abs(s.plPct) / maxPlPct * 100 : 0;
  const plClass = s.pl >= 0 ? 'pos' : 'neg';
  const vsClass = s.vsNoll >= 0 ? 'pos' : 'neg';
  const dagClass = s.dagPct >= 0 ? 'pos' : 'neg';
  const badgeHtml = s.status === 'LIVE'
    ? `<span class="badge badge-live">LIVE</span>`
    : `<span class="badge badge-fallback">FALLBACK</span>`;

  tr.innerHTML = `
    <td>
      <span class="ticker">${s.ticker}${badgeHtml}</span>
      <span class="stock-name">${s.name}</span>
    </td>
    <td>${fmt(s.noll)}</td>
    <td>${fmt(s.kurs)}</td>
    <td class="${dagClass}">${sign(s.dagPct)}${fmt(s.dagPct)}%</td>
    <td class="${vsClass}">${sign(s.vsNoll)}${fmt(s.vsNoll)}%</td>
    <td class="${plClass}">${sign(s.pl)}${fmtInt(s.pl)}</td>
    <td class="bar-cell">
      <div class="bar-track">
        <div class="bar-fill ${s.pl >= 0 ? 'bar-pos' : 'bar-neg'}" style="width:${barPct.toFixed(1)}%"></div>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Total row
const totalTr = document.createElement('tr');
totalTr.className = 'total-row';
const totalVsNollPct = (totalVarde - INVESTED) / INVESTED * 100;
const totalClass = totalPl >= 0 ? 'pos' : 'neg';
totalTr.innerHTML = `
  <td><span class="total-label">TOTALT</span></td>
  <td class="neutral">${fmtInt(INVESTED)}</td>
  <td class="neutral">${fmtInt(totalVarde)}</td>
  <td>—</td>
  <td class="${totalClass}">${sign(totalVsNollPct)}${fmt(totalVsNollPct)}%</td>
  <td class="${totalClass}">${sign(totalPl)}${fmtInt(totalPl)}</td>
  <td></td>
`;
tbody.appendChild(totalTr);
</script>
</body>
</html>
